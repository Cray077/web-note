          setStatus(err.message || "Failed to create note", true);
        }
      }

      async function handleExport() {
        await saveCurrentNote();
        window.location.href = "/api/export";
      }

      function flushOnUnload() {
        flushPreviewSync();
        if (activeId === null || !dirty) return;
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        dirty = false;
        try {
          ws.send(
            JSON.stringify({
              type: "update_note",
              id: activeId,
              content: cm.getValue(),
            })
          );
        } catch {}
      }

      // Live preview slash command menu
      function closePreviewSlashMenu() {
        previewSlash = null;
        previewSlashMenuEl.hidden = true;
        previewSlashMenuEl.innerHTML = "";
      }

      function setCaret(node, offset) {
        const sel = window.getSelection();
        if (!sel) return;
        const range = document.createRange();
        range.setStart(node, offset);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
      }

      function selectNodeContents(node) {
        const sel = window.getSelection();
        if (!sel) return;
        const range = document.createRange();
        range.selectNodeContents(node);
        sel.removeAllRanges();
        sel.addRange(range);
      }

      function insertPreviewBlock(targetNode, nodesToInsert) {
        let top = targetNode;
        while (top && top.parentNode !== previewEl) {
          top = top.parentNode;
        }
        const frag = document.createDocumentFragment();
        for (const n of nodesToInsert) frag.appendChild(n);

        if (!top) {
          previewEl.appendChild(frag);
          return;
        }
        const isEmptyBlock =
          (top.nodeType === Node.TEXT_NODE && top.nodeValue.trim() === "") ||
          ((top.nodeName === "P" || top.nodeName === "DIV") &&
            top.textContent.trim() === "" &&
            !top.querySelector("img, hr, input, table, pre"));

        if (isEmptyBlock) {
          top.replaceWith(frag);
        } else {
          top.after(frag);
        }
      }

      function normalizeLinkUrl(raw) {
        const trimmed = (raw || "").trim();
        if (!trimmed || /^https?:\/\/$/i.test(trimmed)) return "";
        if (/^(https?:\/\/|mailto:|\/)/i.test(trimmed)) return trimmed;
        if (/^[a-z][a-z0-9+.-]*:/i.test(trimmed)) return "";
        return `https://${trimmed}`;
      }

      function applyPreviewSlashItem(item) {
        if (!previewSlash) return;
        const { node, startOffset, endOffset } = previewSlash;
        closePreviewSlashMenu();

        if (!previewEl.contains(node)) return;

        // Remove the typed /query
        const delRange = document.createRange();
        delRange.setStart(node, startOffset);
        delRange.setEnd(node, endOffset);
        delRange.deleteContents();

        const makeEmptyP = () => {
          const p = document.createElement("p");
          p.appendChild(document.createElement("br"));
          return p;
        };

        if (item.id === "link") {
          const rawUrl = prompt("Link URL:", "https://");
          const url = normalizeLinkUrl(rawUrl);
          if (!url) {
            syncPreviewToEditor();
            return;
          }
          const a = document.createElement("a");
          a.href = url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = "text";
          delRange.insertNode(a);
          previewEl.focus();
          selectNodeContents(a);
          syncPreviewToEditor();
          return;
        }

        if (item.id === "image") {
          openImageUploadModal({ mode: "preview", node });
          return;
        }

        if (item.id === "h1" || item.id === "h2" || item.id === "h3") {
          const h = document.createElement(item.id);
          h.appendChild(document.createElement("br"));
          insertPreviewBlock(node, [h]);
          previewEl.focus();
          setCaret(h, 0);
        } else if (item.id === "ul" || item.id === "ol") {
          const list = document.createElement(item.id);
          const li = document.createElement("li");
          li.appendChild(document.createElement("br"));
          list.appendChild(li);
          insertPreviewBlock(node, [list]);
          previewEl.focus();
          setCaret(li, 0);
        } else if (item.id === "task") {
          const ul = document.createElement("ul");
          const li = document.createElement("li");
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.setAttribute("contenteditable", "false");
          const sp = document.createTextNode(" ");
          li.appendChild(cb);
          li.appendChild(sp);
          ul.appendChild(li);
          insertPreviewBlock(node, [ul]);
          previewEl.focus();
          setCaret(sp, 1);
        } else if (item.id === "quote") {
          const bq = document.createElement("blockquote");
          const p = makeEmptyP();
          bq.appendChild(p);
          insertPreviewBlock(node, [bq]);
          previewEl.focus();
          setCaret(p, 0);
        } else if (item.id === "code") {
          const pre = document.createElement("pre");
          const code = document.createElement("code");
          code.appendChild(document.createElement("br"));
          pre.appendChild(code);
          insertPreviewBlock(node, [pre, makeEmptyP()]);
          previewEl.focus();
          setCaret(code, 0);
        } else if (item.id === "table") {
          const table = document.createElement("table");
          const thead = document.createElement("thead");
          const headRow = document.createElement("tr");
          for (let i = 0; i < 3; i++) {
            const th = document.createElement("th");
            th.textContent = "Column";
            headRow.appendChild(th);
          }
          thead.appendChild(headRow);
          const tbody = document.createElement("tbody");
          const bodyRow = document.createElement("tr");
          for (let i = 0; i < 3; i++) {
            const td = document.createElement("td");
            td.appendChild(document.createElement("br"));
            bodyRow.appendChild(td);
          }
          tbody.appendChild(bodyRow);
          table.appendChild(thead);
          table.appendChild(tbody);
          insertPreviewBlock(node, [table, makeEmptyP()]);
          enhanceTable(table);
          const firstTitle = table.querySelector("thead th .col-title") || table.querySelector("thead th");
          previewEl.focus();
          if (firstTitle) selectNodeContents(firstTitle);
        } else if (item.id === "divider") {
          const hr = document.createElement("hr");
          const afterP = makeEmptyP();
          insertPreviewBlock(node, [hr, afterP]);
          previewEl.focus();
          setCaret(afterP, 0);
        }

        syncPreviewToEditor();
      }

      function renderPreviewSlashMenu() {
        if (!previewSlash) return;
        const { items, index, rect } = previewSlash;
        previewSlashMenuEl.innerHTML = "";
        const frag = document.createDocumentFragment();
        items.forEach((item, i) => {
          const li = document.createElement("li");
          li.className = "slash-menu-item" + (i === index ? " active" : "");
          li.dataset.index = String(i);
          li.setAttribute("role", "option");
          li.setAttribute("aria-selected", i === index ? "true" : "false");
          li.textContent = item.name;
          frag.appendChild(li);
        });
        previewSlashMenuEl.appendChild(frag);
        previewSlashMenuEl.hidden = false;

        const menuRect = previewSlashMenuEl.getBoundingClientRect();
        let left = rect.left;
        let top = rect.bottom + 4;
        if (left + menuRect.width > window.innerWidth - 8) {
          left = Math.max(8, window.innerWidth - menuRect.width - 8);
        }
        if (top + menuRect.height > window.innerHeight - 8) {
          top = Math.max(8, rect.top - menuRect.height - 4);
        }
        previewSlashMenuEl.style.left = `${left}px`;
        previewSlashMenuEl.style.top = `${top}px`;

        const activeEl = previewSlashMenuEl.querySelector(".slash-menu-item.active");
        if (activeEl) activeEl.scrollIntoView({ block: "nearest" });
      }

      function updatePreviewSlashMenu() {
        if (activeId === null || previewEl.hidden) {
          closePreviewSlashMenu();
          return;
        }
        const sel = window.getSelection();
        if (!sel || !sel.isCollapsed || !sel.anchorNode) {
          closePreviewSlashMenu();
          return;
        }
        const node = sel.anchorNode;
        if (node.nodeType !== Node.TEXT_NODE || !previewEl.contains(node)) {
          closePreviewSlashMenu();
          return;
        }
        const parentEl = node.parentElement;
        if (parentEl && parentEl.closest("pre, code")) {
          closePreviewSlashMenu();
          return;
        }
        const before = node.nodeValue.slice(0, sel.anchorOffset);
        const match = before.match(/(^|\s)\/(\w*)$/);
        if (!match) {
          closePreviewSlashMenu();
          return;
        }
        const query = match[2];
        const items = filterSlashItems(query);
        if (items.length === 0) {
          closePreviewSlashMenu();
          return;
        }

        const startOffset = sel.anchorOffset - query.length - 1;
        const range = document.createRange();
        range.setStart(node, startOffset);
        range.setEnd(node, sel.anchorOffset);
        const rect = range.getBoundingClientRect();
        if (rect.width === 0 && rect.height === 0) {
          closePreviewSlashMenu();
          return;
        }

        previewSlash = {
          node,
          startOffset,
          endOffset: sel.anchorOffset,
          items,
          index: 0,
          rect,
        };
        renderPreviewSlashMenu();
      }

      previewSlashMenuEl.addEventListener("mousedown", (e) => {
        const li = e.target.closest(".slash-menu-item");
        if (!li || !previewSlash) return;
        e.preventDefault();
        const idx = Number(li.dataset.index);
        const item = previewSlash.items[idx];
        if (item) applyPreviewSlashItem(item);
      });

      // Interactive tables: + row, + column, and column types
      const COL_TYPES = [
        { id: "text", badge: "Aa", label: "Text" },
        { id: "number", badge: "#", label: "Number" },
        { id: "currency", badge: "$", label: "Currency" },
        { id: "checkbox", badge: "☑", label: "Checkbox" },
        { id: "date", badge: "Date", label: "Date" },
      ];

      const currencyFormatter = new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD",
      });

      function colTypeMeta(typeId) {
        return COL_TYPES.find((t) => t.id === typeId) || COL_TYPES[0];
      }

      function parseNumeric(raw) {
        const cleaned = String(raw || "").replace(/[$,\s]/g, "");
        if (!cleaned || !/^-?\d+(\.\d+)?$/.test(cleaned)) return null;
        const num = Number(cleaned);
        return Number.isFinite(num) ? num : null;
      }

      function getCellRawText(td) {
        const cb = td.querySelector('input[type="checkbox"]');
        if (cb) return cb.checked ? "[x]" : "[ ]";
        const dateInput = td.querySelector('input[type="date"]');
        if (dateInput) return dateInput.value || "";
        return td.textContent.trim();
      }

      function applyCellType(td, type, rawValue) {
        const raw = rawValue !== undefined ? rawValue : getCellRawText(td);
        td.dataset.colType = type;

        if (type === "number" || type === "currency") {
          td.setAttribute("align", "right");
        } else {
          td.removeAttribute("align");
        }

        if (type === "checkbox") {
          const checked = /^(\[x\]|x|yes|true|1|✓)$/i.test(raw);
          td.innerHTML = "";
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = checked;
          cb.setAttribute("contenteditable", "false");
          td.appendChild(cb);
          return;
        }

        if (type === "date") {
          const val = /^\d{4}-\d{2}-\d{2}$/.test(raw) ? raw : "";
          td.innerHTML = "";
          const input = document.createElement("input");
          input.type = "date";
          input.className = "cell-date";
          input.value = val;
          input.setAttribute("contenteditable", "false");
          td.appendChild(input);
          return;
        }

        let display = raw;
        if (type === "currency") {
          const num = parseNumeric(raw);
          display = num !== null ? currencyFormatter.format(num) : raw === "[ ]" || raw === "[x]" ? "" : raw;
        } else if (type === "number") {
          const num = parseNumeric(raw);
          display = num !== null ? String(num) : raw === "[ ]" || raw === "[x]" ? "" : raw;
        } else {
          if (raw === "[x]") display = "Yes";
          else if (raw === "[ ]") display = "";
        }

        td.innerHTML = "";
        if (display) {
          td.textContent = display;
        } else {
          td.appendChild(document.createElement("br"));
        }
      }

      function inferColumnType(table, colIndex) {
        const th = table.querySelector(`thead tr th:nth-child(${colIndex + 1})`);
        if (th && th.dataset.colType) return th.dataset.colType;
        const rows = Array.from(table.querySelectorAll("tbody tr"));
        const values = [];
        for (const row of rows) {
          const td = row.cells[colIndex];
          if (!td) continue;
          const v = getCellRawText(td);
          if (v !== "") values.push(v);
        }
        if (values.length === 0) {
          return th && th.getAttribute("align") === "right" ? "number" : "text";
        }
        if (values.every((v) => /^\[[ xX]\]$/.test(v))) return "checkbox";
        if (values.every((v) => /^-?\$[\d,]+(\.\d+)?$/.test(v))) return "currency";
        if (values.every((v) => /^\d{4}-\d{2}-\d{2}$/.test(v))) return "date";
        if (
          values.every((v) => /^-?[\d,]+(\.\d+)?$/.test(v)) &&
          th &&
          th.getAttribute("align") === "right"
        ) {
          return "number";
        }
        return "text";
      }

      function ensureHeaderControl(th, type) {
        const meta = colTypeMeta(type);
        th.dataset.colType = meta.id;
        if (meta.id === "number" || meta.id === "currency") {
          th.setAttribute("align", "right");
        } else {
          th.removeAttribute("align");
        }

        let titleEl = th.querySelector(":scope > .col-title");
        let btn = th.querySelector(":scope > .col-type-btn");
        if (!titleEl) {
          const existingText = Array.from(th.childNodes)
            .filter((n) => !(n.nodeType === Node.ELEMENT_NODE && n.classList.contains("col-type-btn")))
            .map((n) => n.textContent)
            .join("")
            .trim();
          th.innerHTML = "";
          titleEl = document.createElement("span");
          titleEl.className = "col-title";
          titleEl.textContent = existingText || "Column";
          th.appendChild(titleEl);
          btn = null;
        }
        if (!btn) {
          btn = document.createElement("button");
          btn.type = "button";
          btn.className = "col-type-btn";
          btn.setAttribute("contenteditable", "false");
          th.appendChild(btn);
        }
        btn.textContent = meta.badge;
        btn.title = `Column type: ${meta.label} (click to change)`;
      }

      function setColumnType(table, colIndex, type) {
        const headRow = table.querySelector("thead tr");
        if (!headRow) return;
        const th = headRow.cells[colIndex];
        if (!th) return;

        ensureHeaderControl(th, type);
        const rows = table.querySelectorAll("tbody tr");
        for (const row of rows) {
          const td = row.cells[colIndex];
          if (td) applyCellType(td, type);
        }
        syncPreviewToEditor();
      }

      function enhanceTable(table) {
        if (!table.parentElement || !table.parentElement.classList.contains("table-row-top")) {
          const wrap = document.createElement("div");
          wrap.className = "table-wrap";
          const rowTop = document.createElement("div");
          rowTop.className = "table-row-top";

          const addColBtn = document.createElement("button");
          addColBtn.type = "button";
          addColBtn.className = "table-add-col";
          addColBtn.setAttribute("contenteditable", "false");
          addColBtn.title = "Add column";
          addColBtn.setAttribute("aria-label", "Add column");
          addColBtn.textContent = "+";

          const addRowBtn = document.createElement("button");
          addRowBtn.type = "button";
          addRowBtn.className = "table-add-row";
          addRowBtn.setAttribute("contenteditable", "false");
          addRowBtn.title = "Add row";
          addRowBtn.setAttribute("aria-label", "Add row");
          addRowBtn.textContent = "+";

          table.parentNode.insertBefore(wrap, table);
          rowTop.appendChild(table);
          rowTop.appendChild(addColBtn);
          wrap.appendChild(rowTop);
          wrap.appendChild(addRowBtn);
        }

        const headRow = table.querySelector("thead tr");
        if (!headRow) return;
        const colCount = headRow.cells.length;
        for (let col = 0; col < colCount; col++) {
          const th = headRow.cells[col];
          const type = inferColumnType(table, col);
          ensureHeaderControl(th, type);
          const rows = table.querySelectorAll("tbody tr");
          for (const row of rows) {
            const td = row.cells[col];
            if (td) applyCellType(td, type);
          }
        }
      }

      function enhanceTables(root) {
        const tables = root.querySelectorAll("table");
        for (const table of tables) {
          enhanceTable(table);
        }
      }

      function focusTableCell(cell) {
        if (!cell) return;
        const input = cell.querySelector("input");
        if (input) {
          input.focus();
          return;
        }
        const title = cell.querySelector(":scope > .col-title");
        previewEl.focus();
        if (title) {
          selectNodeContents(title);
        } else {
          setCaret(cell, cell.childNodes.length ? 0 : 0);
        }
      }

      function addTableRow(table) {
        const headRow = table.querySelector("thead tr");
        if (!headRow) return;
        let tbody = table.querySelector("tbody");
        if (!tbody) {
          tbody = document.createElement("tbody");
          table.appendChild(tbody);
        }
        const tr = document.createElement("tr");
        let firstEditable = null;
        for (let col = 0; col < headRow.cells.length; col++) {
          const th = headRow.cells[col];
          const type = th.dataset.colType || "text";
          const td = document.createElement("td");
          applyCellType(td, type, "");
          tr.appendChild(td);
          if (!firstEditable && type !== "checkbox") firstEditable = td;
        }
        tbody.appendChild(tr);
        syncPreviewToEditor();
        focusTableCell(firstEditable || tr.cells[0]);
      }

      function addTableColumn(table) {
        const headRow = table.querySelector("thead tr");
        if (!headRow) return;
        const th = document.createElement("th");
        th.textContent = "Column";
        headRow.appendChild(th);
        ensureHeaderControl(th, "text");

        const rows = table.querySelectorAll("tbody tr");
        for (const row of rows) {
          const td = document.createElement("td");
          applyCellType(td, "text", "");
          row.appendChild(td);
        }
        syncPreviewToEditor();
        focusTableCell(th);
      }

      function closeColTypeMenu() {
        colTypeTarget = null;
        colTypeMenuEl.hidden = true;
        colTypeMenuEl.innerHTML = "";
      }

      function openColTypeMenu(btn, table, colIndex) {
        if (colTypeTarget && colTypeTarget.btn === btn) {
          closeColTypeMenu();
          return;
        }
        closePreviewSlashMenu();
        const th = table.querySelector(`thead tr th:nth-child(${colIndex + 1})`);
        const currentType = (th && th.dataset.colType) || "text";
        colTypeTarget = { btn, table, colIndex };

        colTypeMenuEl.innerHTML = "";
        const frag = document.createDocumentFragment();
        for (const t of COL_TYPES) {
          const li = document.createElement("li");
          li.className = "slash-menu-item" + (t.id === currentType ? " active" : "");
          li.dataset.type = t.id;
          li.setAttribute("role", "menuitem");

          const badge = document.createElement("span");
          badge.className = "col-type-badge";
          badge.textContent = t.badge;

          const label = document.createElement("span");
          label.textContent = t.label;

          li.appendChild(badge);
          li.appendChild(label);
          frag.appendChild(li);
        }
        colTypeMenuEl.appendChild(frag);
        colTypeMenuEl.hidden = false;

        const rect = btn.getBoundingClientRect();
        const menuRect = colTypeMenuEl.getBoundingClientRect();
        let left = rect.left;
        let top = rect.bottom + 4;
        if (left + menuRect.width > window.innerWidth - 8) {
          left = Math.max(8, window.innerWidth - menuRect.width - 8);
        }
        if (top + menuRect.height > window.innerHeight - 8) {
          top = Math.max(8, rect.top - menuRect.height - 4);
        }
        colTypeMenuEl.style.left = `${left}px`;
        colTypeMenuEl.style.top = `${top}px`;
      }

      colTypeMenuEl.addEventListener("mousedown", (e) => {
        const li = e.target.closest(".slash-menu-item");
        if (!li || !colTypeTarget) return;
        e.preventDefault();
        const { table, colIndex } = colTypeTarget;
        const type = li.dataset.type;
        closeColTypeMenu();
        setColumnType(table, colIndex, type);
      });

      document.addEventListener("mousedown", (e) => {
        if (
          colTypeTarget &&
          !colTypeMenuEl.contains(e.target) &&
          !e.target.closest(".col-type-btn")
        ) {
          closeColTypeMenu();
        }
      });

      // Preview editing events (two-way sync back to CodeMirror)
      previewEl.addEventListener("input", () => {
        if (activeId === null) return;
        dirty = true;
        setStatus("Unsaved...");
        schedulePreviewToEditor();
        updatePreviewSlashMenu();
      });

      previewEl.addEventListener("change", (e) => {
        if (e.target && e.target.matches('input[type="checkbox"], input[type="date"]')) {
          syncPreviewToEditor();
        }
      });

      function flushTypedCell(nextCell = null) {
        if (
          activeTypedCell &&
          activeTypedCell !== nextCell &&
          previewEl.contains(activeTypedCell) &&
          (activeTypedCell.dataset.colType === "currency" ||
            activeTypedCell.dataset.colType === "number")
        ) {
          const before = activeTypedCell.textContent;
          applyCellType(activeTypedCell, activeTypedCell.dataset.colType);
          if (activeTypedCell.textContent !== before) {
            syncPreviewToEditor();
          }
        }
        activeTypedCell =
          nextCell &&
          (nextCell.dataset.colType === "currency" || nextCell.dataset.colType === "number")
            ? nextCell
            : null;
      }

      document.addEventListener("selectionchange", () => {
        if (previewEl.hidden) return;
        const sel = window.getSelection();
        const anchor = sel && sel.anchorNode;
        const el =
          anchor && previewEl.contains(anchor)
            ? anchor.nodeType === Node.ELEMENT_NODE
              ? anchor
              : anchor.parentElement
            : null;
        const td = el ? el.closest("td[data-col-type]") : null;
        if (td !== activeTypedCell) {
          flushTypedCell(td);
        }
      });

      previewEl.addEventListener("blur", () => {
        closePreviewSlashMenu();
        flushTypedCell(null);
        flushPreviewSync();
      });

      previewEl.addEventListener("scroll", () => {
        closePreviewSlashMenu();
        closeColTypeMenu();
      }, { passive: true });

      previewEl.addEventListener("paste", (e) => {
        const clipboard = e.clipboardData || window.clipboardData;
        const imgFile = extractClipboardImage(clipboard);
        if (imgFile) {
          e.preventDefault();
          closePreviewSlashMenu();
          const sel = window.getSelection();
          const anchor = sel && sel.anchorNode ? sel.anchorNode : previewEl.lastChild;
          uploadAndInsertImageFile(imgFile, "", { mode: "preview", node: anchor });
          return;
        }
        e.preventDefault();
        closePreviewSlashMenu();
        const text = clipboard?.getData("text/plain") || "";
        if (!text) return;
        document.execCommand("insertText", false, text);
      });

      previewEl.addEventListener("mousedown", (e) => {
        const imgToolBtn = e.target.closest(".img-tool-btn");
        if (imgToolBtn) {
          e.preventDefault();
          e.stopPropagation();
          const wrap = imgToolBtn.closest(".img-wrap");
          const img = wrap ? wrap.querySelector("img") : null;
          const action = imgToolBtn.dataset.imgAction;
          if (img && action) {
            handleInlineImageAction(img, action);
          }
          return;
        }
        const resizeHandle = e.target.closest(".img-resize-handle");
        if (resizeHandle) {
          e.preventDefault();
          e.stopPropagation();
          const wrap = resizeHandle.closest(".img-wrap");
          const img = wrap ? wrap.querySelector("img") : null;
          if (wrap && img) {
            startInlineImageResize(e, wrap, img);
          }
          return;
        }
        const addRowBtn = e.target.closest(".table-add-row");
        if (addRowBtn) {
          e.preventDefault();
          closeColTypeMenu();
          const table = addRowBtn.closest(".table-wrap")?.querySelector("table");
          if (table) addTableRow(table);
          return;
        }
        const addColBtn = e.target.closest(".table-add-col");
        if (addColBtn) {
          e.preventDefault();
          closeColTypeMenu();
          const table = addColBtn.closest(".table-wrap")?.querySelector("table");
          if (table) addTableColumn(table);
          return;
        }
        const typeBtn = e.target.closest(".col-type-btn");
        if (typeBtn) {
          e.preventDefault();
          const th = typeBtn.closest("th");
          const table = typeBtn.closest("table");
          if (th && table) {
            openColTypeMenu(typeBtn, table, th.cellIndex);
          }
        }
      });

      previewEl.addEventListener("click", (e) => {
        closePreviewSlashMenu();
        const link = e.target.closest("a[href]");
        if (!link || e.altKey) return;
        const sel = window.getSelection();
        if (sel && !sel.isCollapsed) return;
        const rawHref = (link.getAttribute("href") || "").trim();
        if (/^(https?:\/\/|mailto:|\/)/i.test(rawHref)) {
          e.preventDefault();
          window.open(link.href, "_blank", "noopener,noreferrer");
        }
      });

      previewEl.addEventListener("keydown", (e) => {
        if (colTypeTarget && e.key === "Escape") {
          e.preventDefault();
          closeColTypeMenu();
          return;
        }
        if (previewSlash) {
          if (e.key === "ArrowDown") {
            e.preventDefault();
            previewSlash.index = (previewSlash.index + 1) % previewSlash.items.length;
            renderPreviewSlashMenu();
            return;
          }
          if (e.key === "ArrowUp") {
            e.preventDefault();
            previewSlash.index =
              (previewSlash.index - 1 + previewSlash.items.length) % previewSlash.items.length;
            renderPreviewSlashMenu();
            return;
          }
          if (e.key === "Enter" || e.key === "Tab") {
            e.preventDefault();
            const item = previewSlash.items[previewSlash.index];
            if (item) applyPreviewSlashItem(item);
            return;
          }
          if (e.key === "Escape") {
            e.preventDefault();
            closePreviewSlashMenu();
            return;
          }
        }

        const mod = e.ctrlKey || e.metaKey;
        if (mod && !e.altKey) {
          const key = e.key.toLowerCase();
          if (key === "b") {
            e.preventDefault();
            document.execCommand("bold");
          } else if (key === "i") {
            e.preventDefault();
            document.execCommand("italic");
          } else if (key === "k") {
            e.preventDefault();
            const url = normalizeLinkUrl(prompt("Link URL:", "https://"));
            if (url) {
              document.execCommand("createLink", false, url);
              syncPreviewToEditor();
            }
          }
        } else if (e.key === "Enter" && !e.altKey) {
          const sel = window.getSelection();
          const anchor = sel && sel.anchorNode;
          const el = anchor && (anchor.nodeType === Node.ELEMENT_NODE ? anchor : anchor.parentElement);
          if (el && el.closest("pre")) {
            e.preventDefault();
            document.execCommand("insertLineBreak");
            return;
          }
          const cell = el && el.closest("th, td");
          if (cell) {
            e.preventDefault();
            const table = cell.closest("table");
            const colIndex = cell.cellIndex;
            const row = cell.parentElement;
            const rows = Array.from(table.querySelectorAll("tr"));
            const rowIdx = rows.indexOf(row);
            flushTypedCell(null);
            if (rowIdx >= 0 && rowIdx < rows.length - 1) {
              const target = rows[rowIdx + 1].cells[colIndex];
              if (target) focusTableCell(target);
            } else {
              addTableRow(table);
              const newRow = table.querySelector("tbody tr:last-child");
              if (newRow && newRow.cells[colIndex]) {
                focusTableCell(newRow.cells[colIndex]);
              }
            }
          }
        } else if (e.key === "Tab") {
          const sel = window.getSelection();
          const anchor = sel && sel.anchorNode;
          const el = anchor && (anchor.nodeType === Node.ELEMENT_NODE ? anchor : anchor.parentElement);
          const cell = el && el.closest("th, td");
          if (cell) {
            e.preventDefault();
            const table = cell.closest("table");
            if (cell.tagName === "TD" && (cell.dataset.colType === "currency" || cell.dataset.colType === "number")) {
              applyCellType(cell, cell.dataset.colType);
              syncPreviewToEditor();
            }
            const cells = Array.from(table.querySelectorAll("th, td"));
            const idx = cells.indexOf(cell);
            const nextIdx = idx + (e.shiftKey ? -1 : 1);
            if (nextIdx >= 0 && nextIdx < cells.length) {
              focusTableCell(cells[nextIdx]);
            } else if (!e.shiftKey && nextIdx === cells.length) {
              addTableRow(table);
            }
            return;
          }
          e.preventDefault();
          document.execCommand(e.shiftKey ? "outdent" : "indent");
        }
      });

      // Interactive images: upload, inline resize/flip/rotate, and scribble editor modal
      function parseLocalImageUrl(cleanSrc) {
        const m = /^\/images\/([a-zA-Z0-9_-]+)\/([a-zA-Z0-9_-]+\.(png|jpg|jpeg|webp|gif))$/i.exec(
          cleanSrc || ""
        );
        if (!m) return null;
        return { username: m[1], filename: m[2], ext: "." + m[3].toLowerCase() };
      }

      function extractClipboardImage(clipboard) {
        if (!clipboard || !clipboard.items) return null;
        for (const item of clipboard.items) {
          if (item.kind === "file" && item.type && item.type.startsWith("image/")) {
            return item.getAsFile();
          }
        }
        return null;
      }

      function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ""));
          reader.onerror = () => reject(new Error("Failed to read image file"));
          reader.readAsDataURL(file);
        });
      }

      function loadImageElement(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          if (!src.startsWith("/") && !src.startsWith("data:")) {
            img.crossOrigin = "anonymous";
          }
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error("Failed to load image for editing"));
          img.src = src;
        });
      }

      function canvasToDataUrl(canvas, ext) {
        if (ext === ".jpg" || ext === ".jpeg") {
          const flat = document.createElement("canvas");
          flat.width = canvas.width;
          flat.height = canvas.height;
          const fctx = flat.getContext("2d");
          fctx.fillStyle = "#ffffff";
          fctx.fillRect(0, 0, flat.width, flat.height);
          fctx.drawImage(canvas, 0, 0);
          return flat.toDataURL("image/jpeg", 0.92);
        }
        if (ext === ".webp") {
          const url = canvas.toDataURL("image/webp", 0.92);
          if (url.startsWith("data:image/webp")) return url;
        }
        return canvas.toDataURL("image/png");
      }

      function getVersionedSrc(cleanSrc) {
        const v = imageVersions.get(cleanSrc);
        if (v && cleanSrc.startsWith("/images/")) {
          return `${cleanSrc}?v=${encodeURIComponent(v)}`;
        }
        return cleanSrc;
      }

      function refreshImagesForUrl(cleanSrc) {
        const versioned = getVersionedSrc(cleanSrc);
        previewEl.querySelectorAll("img").forEach((img) => {
          const base = stripImageVersion(img.dataset.cleanSrc || img.getAttribute("src") || "");
          if (base === cleanSrc) {
            img.dataset.cleanSrc = cleanSrc;
            img.src = versioned;
          }
        });
      }

      function handleRemoteImageUpdated(image) {
        if (!image || typeof image.url !== "string") return;
        const cleanSrc = stripImageVersion(image.url);
        if (image.v) {
          imageVersions.set(cleanSrc, String(image.v));
        }
        refreshImagesForUrl(cleanSrc);
      }

      function enhanceImages(root) {
        const imgs = Array.from(root.querySelectorAll("img"));
        for (const img of imgs) {
          const rawSrc = img.getAttribute("src") || "";
          const cleanSrc = stripImageVersion(img.dataset.cleanSrc || rawSrc);
          img.dataset.cleanSrc = cleanSrc;
          const versioned = getVersionedSrc(cleanSrc);
          if (versioned && img.getAttribute("src") !== versioned) {
            img.setAttribute("src", versioned);
          }

          if (img.parentElement && img.parentElement.classList.contains("img-wrap")) {
            continue;
          }

          const wrap = document.createElement("span");
          wrap.className = "img-wrap";
          wrap.setAttribute("contenteditable", "false");

          const toolbar = document.createElement("span");
          toolbar.className = "img-toolbar";
          toolbar.setAttribute("contenteditable", "false");

          const buttons = [
            { action: "rot-left", label: "\u21BA", title: "Rotate 90° left" },
            { action: "rot-right", label: "\u21BB", title: "Rotate 90° right" },
            { action: "flip-h", label: "\u21C4", title: "Flip horizontal" },
            { action: "flip-v", label: "\u21C5", title: "Flip vertical" },
            { action: "edit", label: "\u270E Edit", title: "Resize, transform & scribble" },
          ];
          for (const b of buttons) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "img-tool-btn";
            btn.dataset.imgAction = b.action;
            btn.title = b.title;
            btn.textContent = b.label;
            toolbar.appendChild(btn);
          }

          const handle = document.createElement("span");
          handle.className = "img-resize-handle";
          handle.setAttribute("contenteditable", "false");
          handle.title = "Drag to resize";

          const badge = document.createElement("span");
          badge.className = "img-size-badge";
          badge.setAttribute("contenteditable", "false");
          badge.hidden = true;

          img.parentNode.insertBefore(wrap, img);
          wrap.appendChild(img);
          wrap.appendChild(toolbar);
          wrap.appendChild(handle);
          wrap.appendChild(badge);
        }
      }

      function insertImageIntoNote(url, alt, target) {
        const cleanAlt = (alt || "image").replace(/[\[\]]/g, "").trim() || "image";
        const cleanUrl = stripImageVersion(url);
        if (!target || target.mode === "cm") {
          const pos = target && target.pos ? target.pos : cm.getCursor();
          const md = `![${cleanAlt}](${cleanUrl})`;
          cm.replaceRange(md, pos, pos);
          cm.focus();
          return;
        }

        const pImg = document.createElement("p");
        const img = document.createElement("img");
        img.dataset.cleanSrc = cleanUrl;
        img.src = getVersionedSrc(cleanUrl);
        img.alt = cleanAlt;
        pImg.appendChild(img);

        const afterP = document.createElement("p");
        afterP.appendChild(document.createElement("br"));

        if (target.node && previewEl.contains(target.node)) {
          insertPreviewBlock(target.node, [pImg, afterP]);
        } else {
          previewEl.appendChild(pImg);
          previewEl.appendChild(afterP);
        }
        enhanceImages(previewEl);
        previewEl.focus();
        setCaret(afterP, 0);
        syncPreviewToEditor();
      }

      async function uploadAndInsertImageFile(file, altOverride, target) {
        if (!file) return;
        if (file.size > MAX_IMAGE_BYTES) {
          setStatus("Image exceeds 10 MB limit", true);
          return;
        }
        setStatus("Uploading image...");
        try {
          const dataUrl = await readFileAsDataUrl(file);
          const res = await wsRequest("upload_image", {
            data: dataUrl,
            username: DEFAULT_USER,
          });
          const image = res.image;
          if (image && image.v) {
            imageVersions.set(image.url, String(image.v));
          }
          const stem = (file.name || "").replace(/\.[^.]+$/, "").trim();
          const alt = (altOverride || "").trim() || stem || "image";
          insertImageIntoNote(image.url, alt, target);
          setStatus("Image uploaded");
        } catch (err) {
          setStatus(err.message || "Image upload failed", true);
        }
      }

      function closeImageUploadModal() {
        pendingImageInsert = null;
        imageUploadModalEl.hidden = true;
        imageFileInputEl.value = "";
        imageAltInputEl.value = "";
        imageUrlInputEl.value = "";
        imageDropzoneEl.classList.remove("dragover");
      }

      function openImageUploadModal(target) {
        if (activeId === null) return;
        pendingImageInsert = target;
        imageAltInputEl.value = "";
        imageUrlInputEl.value = "";
        imageFileInputEl.value = "";
        imageUploadModalEl.hidden = false;
        imageDropzoneEl.focus();
      }

      async function saveTransformedCanvas(imgEl, canvas) {
        const cleanSrc = stripImageVersion(imgEl.dataset.cleanSrc || imgEl.getAttribute("src") || "");
        const local = parseLocalImageUrl(cleanSrc);
        const ext = local ? local.ext : ".png";
        let dataUrl;
        try {
          dataUrl = canvasToDataUrl(canvas, ext);
        } catch {
          setStatus("Cannot edit cross-origin image directly", true);
          return false;
        }

        setStatus("Saving image...");
        try {
          const payload = local
            ? { data: dataUrl, username: local.username, replace: local.filename }
            : { data: dataUrl, username: DEFAULT_USER };
          const res = await wsRequest("upload_image", payload);
          const image = res.image;
          if (image.v) {
            imageVersions.set(image.url, String(image.v));
          }
          if (local) {
            refreshImagesForUrl(image.url);
          } else {
            imgEl.dataset.cleanSrc = image.url;
            imgEl.src = getVersionedSrc(image.url);
            syncPreviewToEditor();
          }
          setStatus("Image saved");
          return true;
        } catch (err) {
          setStatus(err.message || "Failed to save image", true);
          return false;
        }
      }

      function transformCanvas(srcCanvasOrImg, action) {
        const sw = srcCanvasOrImg.naturalWidth || srcCanvasOrImg.width;
        const sh = srcCanvasOrImg.naturalHeight || srcCanvasOrImg.height;
        const out = document.createElement("canvas");
        const ctx = out.getContext("2d");

        if (action === "rot-right" || action === "rot-left") {
          out.width = sh;
          out.height = sw;
          ctx.translate(out.width / 2, out.height / 2);
          ctx.rotate(action === "rot-right" ? Math.PI / 2 : -Math.PI / 2);
          ctx.drawImage(srcCanvasOrImg, -sw / 2, -sh / 2);
        } else if (action === "flip-h") {
          out.width = sw;
          out.height = sh;
          ctx.translate(sw, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(srcCanvasOrImg, 0, 0);
        } else if (action === "flip-v") {
          out.width = sw;
          out.height = sh;
          ctx.translate(0, sh);
          ctx.scale(1, -1);
          ctx.drawImage(srcCanvasOrImg, 0, 0);
        } else {
          out.width = sw;
          out.height = sh;
          ctx.drawImage(srcCanvasOrImg, 0, 0);
        }
        return out;
      }

      async function handleInlineImageAction(imgEl, action) {
        if (action === "edit") {
          openImageEditorModal(imgEl);
          return;
        }
        try {
          const loaded = await loadImageElement(imgEl.src);
          const out = transformCanvas(loaded, action);
          await saveTransformedCanvas(imgEl, out);
        } catch (err) {
          setStatus(err.message || "Image edit failed", true);
        }
      }

      function startInlineImageResize(e, wrap, imgEl) {
        const rect = imgEl.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const naturalW = imgEl.naturalWidth || rect.width;
        const naturalH = imgEl.naturalHeight || rect.height;
        const aspect = naturalW / naturalH;
        const badge = wrap.querySelector(".img-size-badge");

        activeImgResize = {
          wrap,
          imgEl,
          badge,
          startX: e.clientX,
          startW: rect.width,
          aspect,
          curW: Math.round(rect.width),
          curH: Math.round(rect.height),
        };
        wrap.classList.add("resizing");
        if (badge) {
          badge.textContent = `${activeImgResize.curW} × ${activeImgResize.curH}`;
          badge.hidden = false;
        }
      }

      document.addEventListener("mousemove", (e) => {
        if (!activeImgResize) return;
        const dx = e.clientX - activeImgResize.startX;
        const maxW = Math.max(200, previewEl.clientWidth - 48);
        const nextW = Math.max(32, Math.min(maxW, Math.round(activeImgResize.startW + dx)));
        const nextH = Math.max(32, Math.round(nextW / activeImgResize.aspect));
        activeImgResize.curW = nextW;
        activeImgResize.curH = nextH;
        activeImgResize.imgEl.style.width = `${nextW}px`;
        if (activeImgResize.badge) {
          activeImgResize.badge.textContent = `${nextW} × ${nextH}`;
        }
      });

      document.addEventListener("mouseup", async () => {
        if (!activeImgResize) return;
        const state = activeImgResize;
        activeImgResize = null;
        state.wrap.classList.remove("resizing");
        if (state.badge) state.badge.hidden = true;
        state.imgEl.style.width = "";

        if (Math.abs(state.curW - Math.round(state.startW)) < 2) return;
        try {
          const loaded = await loadImageElement(state.imgEl.src);
          const out = document.createElement("canvas");
          out.width = state.curW;
          out.height = state.curH;
          const ctx = out.getContext("2d");
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";
          ctx.drawImage(loaded, 0, 0, out.width, out.height);
          await saveTransformedCanvas(state.imgEl, out);
        } catch (err) {
          setStatus(err.message || "Resize failed", true);
        }
      });

      // Full Image Editor Modal (Resize, Flip, Rotate, Scribble)
      function renderImageEditorCanvas() {
        if (!imageEditorState) return;
        const { workCanvas, strokes } = imageEditorState;
        ieCanvasEl.width = workCanvas.width;
        ieCanvasEl.height = workCanvas.height;
        const ctx = ieCanvasEl.getContext("2d");
        ctx.clearRect(0, 0, ieCanvasEl.width, ieCanvasEl.height);
        ctx.drawImage(workCanvas, 0, 0);

        for (const stroke of strokes) {
          if (!stroke.points.length) continue;
          ctx.save();
          ctx.strokeStyle = stroke.color;
          ctx.fillStyle = stroke.color;
          ctx.lineWidth = stroke.size;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          if (stroke.points.length === 1) {
            const p = stroke.points[0];
            ctx.beginPath();
            ctx.arc(p.x, p.y, stroke.size / 2, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
            for (let i = 1; i < stroke.points.length; i++) {
              ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
            }
            ctx.stroke();
          }
          ctx.restore();
        }

        ieInfoEl.textContent = `Canvas: ${workCanvas.width} × ${workCanvas.height} px | Output: ${imageEditorState.targetW} × ${imageEditorState.targetH} px`;
      }

      function bakeStrokesIntoWorkCanvas() {
        if (!imageEditorState || imageEditorState.strokes.length === 0) return;
        renderImageEditorCanvas();
        const baked = document.createElement("canvas");
        baked.width = ieCanvasEl.width;
        baked.height = ieCanvasEl.height;
        baked.getContext("2d").drawImage(ieCanvasEl, 0, 0);
        imageEditorState.workCanvas = baked;
        imageEditorState.strokes = [];
      }

      function applyEditorTransform(action) {
        if (!imageEditorState) return;
        bakeStrokesIntoWorkCanvas();
        const prevW = imageEditorState.workCanvas.width;
        const prevH = imageEditorState.workCanvas.height;
        const nextCanvas = transformCanvas(imageEditorState.workCanvas, action);
        imageEditorState.workCanvas = nextCanvas;
        if (action === "rot-left" || action === "rot-right") {
          const oldTargetW = imageEditorState.targetW;
          imageEditorState.targetW = imageEditorState.targetH;
          imageEditorState.targetH = oldTargetW;
          ieWidthInputEl.value = String(imageEditorState.targetW);
          ieHeightInputEl.value = String(imageEditorState.targetH);
        } else if (prevW !== nextCanvas.width || prevH !== nextCanvas.height) {
          imageEditorState.targetW = nextCanvas.width;
          imageEditorState.targetH = nextCanvas.height;
          ieWidthInputEl.value = String(imageEditorState.targetW);
          ieHeightInputEl.value = String(imageEditorState.targetH);
        }
        renderImageEditorCanvas();
      }

      function closeImageEditorModal() {
        imageEditorState = null;
        imageEditorModalEl.hidden = true;
      }

      async function openImageEditorModal(imgEl) {
        try {
          const loaded = await loadImageElement(imgEl.src);
          const workCanvas = document.createElement("canvas");
          workCanvas.width = loaded.naturalWidth || loaded.width || 400;
          workCanvas.height = loaded.naturalHeight || loaded.height || 300;
          workCanvas.getContext("2d").drawImage(loaded, 0, 0);

          const activeSwatch = imageEditorModalEl.querySelector(".swatch-btn.active");
          imageEditorState = {
            imgEl,
            workCanvas,
            origW: workCanvas.width,
            origH: workCanvas.height,
            targetW: workCanvas.width,
            targetH: workCanvas.height,
            color: activeSwatch ? activeSwatch.dataset.color : "#ef4444",
            brushSize: Number(ieBrushSizeEl.value) || 6,
            strokes: [],
            drawingStroke: null,
          };
          ieWidthInputEl.value = String(workCanvas.width);
          ieHeightInputEl.value = String(workCanvas.height);
          imageEditorModalEl.hidden = false;
          renderImageEditorCanvas();
        } catch (err) {
          setStatus(err.message || "Could not open image editor", true);
        }
      }

      function canvasPointFromEvent(e) {
        const rect = ieCanvasEl.getBoundingClientRect();
        const scaleX = ieCanvasEl.width / (rect.width || 1);
        const scaleY = ieCanvasEl.height / (rect.height || 1);
        return {
          x: (e.clientX - rect.left) * scaleX,
          y: (e.clientY - rect.top) * scaleY,
        };
      }

      ieCanvasEl.addEventListener("pointerdown", (e) => {
        if (!imageEditorState || e.button !== 0) return;
        e.preventDefault();
        ieCanvasEl.setPointerCapture(e.pointerId);
        const pt = canvasPointFromEvent(e);
        const scaleFactor = Math.max(1, ieCanvasEl.width / (ieCanvasEl.getBoundingClientRect().width || 1));
        const stroke = {
          color: imageEditorState.color,
          size: Math.max(1, imageEditorState.brushSize * scaleFactor),
          points: [pt],
        };
        imageEditorState.strokes.push(stroke);
        imageEditorState.drawingStroke = stroke;
        renderImageEditorCanvas();
      });

      ieCanvasEl.addEventListener("pointermove", (e) => {
        if (!imageEditorState || !imageEditorState.drawingStroke) return;
        e.preventDefault();
        imageEditorState.drawingStroke.points.push(canvasPointFromEvent(e));
        renderImageEditorCanvas();
      });

      function endEditorStroke() {
        if (imageEditorState) {
          imageEditorState.drawingStroke = null;
        }
      }

      ieCanvasEl.addEventListener("pointerup", endEditorStroke);
      ieCanvasEl.addEventListener("pointercancel", endEditorStroke);

      // Upload modal bindings
      imageDropzoneEl.addEventListener("click", () => imageFileInputEl.click());
      imageDropzoneEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          imageFileInputEl.click();
        }
      });
      imageDropzoneEl.addEventListener("dragover", (e) => {
        e.preventDefault();
        imageDropzoneEl.classList.add("dragover");
      });
      imageDropzoneEl.addEventListener("dragleave", () => {
        imageDropzoneEl.classList.remove("dragover");
      });
      imageDropzoneEl.addEventListener("drop", (e) => {
        e.preventDefault();
        imageDropzoneEl.classList.remove("dragover");
        const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (file && file.type.startsWith("image/")) {
          const target = pendingImageInsert;
          const alt = imageAltInputEl.value.trim();
          closeImageUploadModal();
          uploadAndInsertImageFile(file, alt, target);
        }
      });

      imageFileInputEl.addEventListener("change", () => {
        const file = imageFileInputEl.files && imageFileInputEl.files[0];
        if (!file) return;
        const target = pendingImageInsert;
        const alt = imageAltInputEl.value.trim();
        closeImageUploadModal();
        uploadAndInsertImageFile(file, alt, target);
      });

      imageUrlInsertBtn.addEventListener("click", () => {
        const url = normalizeLinkUrl(imageUrlInputEl.value);
        if (!url) {
          imageUrlInputEl.focus();
          return;
        }
        const target = pendingImageInsert;
        const alt = imageAltInputEl.value.trim() || "image";
        closeImageUploadModal();
        insertImageIntoNote(url, alt, target);
      });

      imageUrlInputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          imageUrlInsertBtn.click();
        }
      });

      imageUploadCloseBtn.addEventListener("click", closeImageUploadModal);
      imageUploadCancelBtn.addEventListener("click", closeImageUploadModal);
      imageUploadModalEl.addEventListener("click", (e) => {
        if (e.target === imageUploadModalEl) closeImageUploadModal();
      });

      // Image editor modal bindings
      document.getElementById("ie-rot-left").addEventListener("click", () => applyEditorTransform("rot-left"));
      document.getElementById("ie-rot-right").addEventListener("click", () => applyEditorTransform("rot-right"));
      document.getElementById("ie-flip-h").addEventListener("click", () => applyEditorTransform("flip-h"));
      document.getElementById("ie-flip-v").addEventListener("click", () => applyEditorTransform("flip-v"));

      ieWidthInputEl.addEventListener("input", () => {
        if (!imageEditorState) return;
        const w = Math.max(32, Math.min(4096, Math.round(Number(ieWidthInputEl.value) || 0)));
        if (!w) return;
        const ratio = imageEditorState.workCanvas.height / (imageEditorState.workCanvas.width || 1);
        imageEditorState.targetW = w;
        imageEditorState.targetH = Math.max(32, Math.min(4096, Math.round(w * ratio)));
        ieHeightInputEl.value = String(imageEditorState.targetH);
        renderImageEditorCanvas();
      });

      ieHeightInputEl.addEventListener("input", () => {
        if (!imageEditorState) return;
        const h = Math.max(32, Math.min(4096, Math.round(Number(ieHeightInputEl.value) || 0)));
        if (!h) return;
        const ratio = imageEditorState.workCanvas.width / (imageEditorState.workCanvas.height || 1);
        imageEditorState.targetH = h;
        imageEditorState.targetW = Math.max(32, Math.min(4096, Math.round(h * ratio)));
        ieWidthInputEl.value = String(imageEditorState.targetW);
        renderImageEditorCanvas();
      });

      function setEditorScale(factor) {
        if (!imageEditorState) return;
        const cw = imageEditorState.workCanvas.width;
        const ch = imageEditorState.workCanvas.height;
        imageEditorState.targetW = Math.max(32, Math.min(4096, Math.round(cw * factor)));
        imageEditorState.targetH = Math.max(32, Math.min(4096, Math.round(ch * factor)));
        ieWidthInputEl.value = String(imageEditorState.targetW);
        ieHeightInputEl.value = String(imageEditorState.targetH);
        renderImageEditorCanvas();
      }

      document.getElementById("ie-scale-50").addEventListener("click", () => setEditorScale(0.5));
      document.getElementById("ie-scale-75").addEventListener("click", () => setEditorScale(0.75));
      document.getElementById("ie-scale-100").addEventListener("click", () => setEditorScale(1));

      imageEditorModalEl.querySelectorAll(".swatch-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          imageEditorModalEl.querySelectorAll(".swatch-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          if (imageEditorState) {
            imageEditorState.color = btn.dataset.color || "#ef4444";
          }
        });
      });

      ieBrushSizeEl.addEventListener("change", () => {
        if (imageEditorState) {
          imageEditorState.brushSize = Number(ieBrushSizeEl.value) || 6;
        }
      });

      document.getElementById("ie-undo-stroke").addEventListener("click", () => {
        if (!imageEditorState || !imageEditorState.strokes.length) return;
        imageEditorState.strokes.pop();
        renderImageEditorCanvas();
      });

      document.getElementById("ie-clear-strokes").addEventListener("click", () => {
        if (!imageEditorState) return;
        imageEditorState.strokes = [];
        renderImageEditorCanvas();
      });

      imageEditorSaveBtn.addEventListener("click", async () => {
        if (!imageEditorState) return;
        renderImageEditorCanvas();
        const out = document.createElement("canvas");
        out.width = Math.max(32, Math.min(4096, imageEditorState.targetW));
        out.height = Math.max(32, Math.min(4096, imageEditorState.targetH));
        const ctx = out.getContext("2d");
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(ieCanvasEl, 0, 0, out.width, out.height);

        const targetImg = imageEditorState.imgEl;
        imageEditorSaveBtn.disabled = true;
        const ok = await saveTransformedCanvas(targetImg, out);
        imageEditorSaveBtn.disabled = false;
        if (ok) closeImageEditorModal();
      });

      imageEditorCloseBtn.addEventListener("click", closeImageEditorModal);
      imageEditorCancelBtn.addEventListener("click", closeImageEditorModal);
      imageEditorModalEl.addEventListener("click", (e) => {
        if (e.target === imageEditorModalEl) closeImageEditorModal();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (!imageUploadModalEl.hidden) {
            closeImageUploadModal();
          } else if (!imageEditorModalEl.hidden) {
            closeImageEditorModal();
          }
        }
      });

      // Drag-and-drop image files directly onto editor or preview
      workspaceEl.addEventListener("dragover", (e) => {
        if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files")) {
          e.preventDefault();
        }
      });
      workspaceEl.addEventListener("drop", (e) => {
        const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (!file || !file.type.startsWith("image/") || activeId === null) return;
        e.preventDefault();
        const inPreview = previewEl.contains(e.target);
        uploadAndInsertImageFile(
          file,
          "",
          inPreview ? { mode: "preview", node: previewEl.lastChild } : { mode: "cm", pos: cm.getCursor() }
        );
      });

      // Event bindings
      searchEl.addEventListener("input", renderSidebar);
      foldAllBtn.addEventListener("click", toggleFoldAll);

      noteListEl.addEventListener("click", (e) => {
        if (e.target.closest(".note-rename-input")) return;

        const addInFolderBtn = e.target.closest(".folder-add-note-btn");
        if (addInFolderBtn) {
          e.stopPropagation();
          const group = addInFolderBtn.closest(".folder-group");
          const fid = group ? Number(group.dataset.folderId) : NaN;
          if (Number.isInteger(fid)) handleNewNote(fid);
          return;
        }

        const renameFolderBtn = e.target.closest(".folder-rename-btn");
        if (renameFolderBtn) {
          e.stopPropagation();
          const group = renameFolderBtn.closest(".folder-group");
          const fid = group ? Number(group.dataset.folderId) : NaN;
          if (Number.isInteger(fid)) startInlineFolderRename(fid);
          return;
        }

        const folderHeader = e.target.closest(".folder-header");
        if (folderHeader) {
          const group = folderHeader.closest(".folder-group");
          const fid = group ? Number(group.dataset.folderId) : NaN;
          if (Number.isInteger(fid)) toggleFolderFold(fid);
          return;
        }

        const renameBtn = e.target.closest(".note-rename-btn");
        if (renameBtn) {
          e.stopPropagation();
          const item = renameBtn.closest(".note-item");
          const id = item ? Number(item.dataset.id) : NaN;
          if (Number.isInteger(id)) startInlineRename(id);
          return;
        }

        const item = e.target.closest(".note-item");
        if (!item) return;
        const id = Number(item.dataset.id);
        if (Number.isInteger(id)) {
          selectNote(id);
        }
      });

      noteListEl.addEventListener("dblclick", (e) => {
        const folderNameEl = e.target.closest(".folder-name");
        if (folderNameEl) {
          e.stopPropagation();
          const group = folderNameEl.closest(".folder-group");
          const fid = group ? Number(group.dataset.folderId) : NaN;
          if (Number.isInteger(fid)) startInlineFolderRename(fid);
          return;
        }
        const nameEl = e.target.closest(".note-name");
        if (!nameEl) return;
        e.stopPropagation();
        const item = nameEl.closest(".note-item");
        const id = item ? Number(item.dataset.id) : NaN;
        if (Number.isInteger(id)) startInlineRename(id);
      });

      function clearSidebarDropHighlights() {
        noteListEl.classList.remove("drop-target-root");
        noteListEl.querySelectorAll(".folder-group.drop-target").forEach((el) => {
          el.classList.remove("drop-target");
        });
      }

      noteListEl.addEventListener("dragstart", (e) => {
        const item = e.target.closest(".note-item");
        if (!item || item.querySelector(".note-rename-input")) {
          e.preventDefault();
          return;
        }
        const id = Number(item.dataset.id);
        if (!Number.isInteger(id)) return;
        draggingNoteId = id;
        if (e.dataTransfer) {
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", String(id));
        }
      });

      noteListEl.addEventListener("dragover", (e) => {
        if (draggingNoteId === null) return;
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = "move";
        clearSidebarDropHighlights();
        const group = e.target.closest(".folder-group");
        if (group) {
          group.classList.add("drop-target");
        } else {
          noteListEl.classList.add("drop-target-root");
        }
      });

      noteListEl.addEventListener("dragleave", (e) => {
        if (draggingNoteId === null) return;
        if (!noteListEl.contains(e.relatedTarget)) {
          clearSidebarDropHighlights();
        }
      });

      noteListEl.addEventListener("drop", (e) => {
        if (draggingNoteId === null) return;
        e.preventDefault();
        const noteId = draggingNoteId;
        draggingNoteId = null;
        clearSidebarDropHighlights();
        const group = e.target.closest(".folder-group");
        if (group) {
          const fid = Number(group.dataset.folderId);
          if (Number.isInteger(fid)) {
            moveNoteToFolder(noteId, fid);
          }
        } else {
          moveNoteToFolder(noteId, null);
        }
      });

      noteListEl.addEventListener("dragend", () => {
        draggingNoteId = null;
        clearSidebarDropHighlights();
      });

      tabStripEl.addEventListener("click", (e) => {
        const closeBtn = e.target.closest(".tab-close");
        if (closeBtn) {
          e.stopPropagation();
          const tab = closeBtn.closest(".tab");
          const id = tab ? Number(tab.dataset.id) : NaN;
          if (Number.isInteger(id)) closeTab(id);
          return;
        }
        const tab = e.target.closest(".tab");
        if (!tab) return;
        const id = Number(tab.dataset.id);
        if (Number.isInteger(id)) selectNote(id);
      });

      tabStripEl.addEventListener("auxclick", (e) => {
        if (e.button !== 1) return;
        const tab = e.target.closest(".tab");
        if (!tab) return;
        e.preventDefault();
        const id = Number(tab.dataset.id);
        if (Number.isInteger(id)) closeTab(id);
      });

      tabStripEl.addEventListener("wheel", (e) => {
        if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
          tabStripEl.scrollLeft += e.deltaY;
        }
      }, { passive: true });

      newTabBtn.addEventListener("click", () => handleNewNote(null));

      sidebarToggleBtn.addEventListener("click", () => {
        sidebarVisible = !sidebarVisible;
        applyLayout();
      });

      editorToggleBtn.addEventListener("click", () => {
        wideEditorVisible = !wideEditorVisible;
        if (!wideEditorVisible && !widePreviewVisible) {
          widePreviewVisible = true;
        }
        applyLayout();
        if (wideEditorVisible && activeId !== null) cm.focus();
      });

      previewToggleBtn.addEventListener("click", () => {
        if (wideQuery.matches) {
          widePreviewVisible = !widePreviewVisible;
          if (!widePreviewVisible && !wideEditorVisible) {
            wideEditorVisible = true;
          }
          applyLayout();
        } else {
          narrowPreviewActive = !narrowPreviewActive;
          applyLayout();
          if (!narrowPreviewActive && activeId !== null) cm.focus();
        }
      });

      wideQuery.addEventListener("change", applyLayout);
      newNoteBtn.addEventListener("click", () => handleNewNote(null));
      newFolderBtn.addEventListener("click", handleNewFolder);
      exportBtn.addEventListener("click", handleExport);
      window.addEventListener("pagehide", flushOnUnload);

      // Initial load over WebSocket
      async function loadInitialNotes() {
        if (wsInitializing || wsInitialized) return;
        wsInitializing = true;
        try {
          const res = await wsRequest("list_notes");
          notes = Array.isArray(res.notes) ? res.notes : [];
          folders = Array.isArray(res.folders) ? res.folders : [];
          sortNotesNewestFirst();
          sortFoldersAlpha();

          if (notes.length === 0) {
            const first = await createNote("My Notes");
            notes = [first];
          }

          wsInitialized = true;
          const saved = restoreTabsState();
          if (saved && saved.ids.length > 0 && saved.active !== null) {
            openTabIds = saved.ids;
            renderSidebar();
            renderTabs();
            await selectNote(saved.active);
          } else {
            renderSidebar();
            await selectNote(notes[0].id);
          }
        } catch (err) {
          setStatus(err.message || "Failed to initialize", true);
        } finally {
          wsInitializing = false;
        }
      }

      function init() {
        applyLayout();
        setStatus("Connecting...");
        connectWebSocket();
      }

      init();
    })();
  </script>
</body>
</html>
