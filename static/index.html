<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes</title>
  <link rel="stylesheet" href="/static/vendor/codemirror/lib/codemirror.css">
  <link rel="stylesheet" href="/static/vendor/codemirror/addon/hint/show-hint.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #1f2328;
      background: #ffffff;
    }

    [hidden] {
      display: none !important;
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* Sidebar */
    .sidebar {
      flex: 0 0 270px;
      width: 270px;
      display: flex;
      flex-direction: column;
      background: #f6f7f9;
      border-right: 1px solid #d9dde3;
      min-width: 0;
    }

    .sidebar-search {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px;
      border-bottom: 1px solid #e5e8ec;
    }

    .sidebar-search input {
      flex: 1 1 auto;
      min-width: 0;
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #cfd6df;
      border-radius: 5px;
      background: #ffffff;
      font: inherit;
      font-size: 13px;
      color: #1f2328;
      outline: none;
    }

    .fold-all-btn {
      flex: 0 0 auto;
      padding: 6px 7px;
      border: 1px solid #cfd6df;
      border-radius: 5px;
      background: #ffffff;
      color: #4b5563;
      font: inherit;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      white-space: nowrap;
    }

    .fold-all-btn:hover {
      background: #f0f2f5;
      color: #111827;
    }

    .sidebar-search input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
    }

    .note-list {
      flex: 1 1 auto;
      overflow-y: auto;
      list-style: none;
      margin: 0;
      padding: 6px;
    }

    .note-item {
      padding: 9px 11px;
      border-radius: 5px;
      cursor: pointer;
      user-select: none;
      margin-bottom: 2px;
      border: 1px solid transparent;
    }

    .note-item:hover {
      background: #ebeff4;
    }

    .note-item.active {
      background: #dbeafe;
      border-color: #bfdbfe;
    }

    .note-name-row {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .note-name {
      flex: 1 1 auto;
      min-width: 0;
      font-weight: 600;
      font-size: 13.5px;
      color: #111827;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.35;
    }

    .note-rename-btn {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      padding: 0;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #6b7280;
      font-size: 12px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
    }

    .note-item:hover .note-rename-btn,
    .note-item:focus-within .note-rename-btn,
    .note-item.active .note-rename-btn {
      opacity: 1;
    }

    .note-rename-btn:hover {
      background: rgba(15, 23, 42, 0.08);
      color: #111827;
    }

    .note-rename-input {
      width: 100%;
      padding: 1px 5px;
      border: 1px solid #3b82f6;
      border-radius: 4px;
      background: #ffffff;
      font: inherit;
      font-weight: 600;
      font-size: 13.5px;
      line-height: 1.35;
      color: #111827;
      outline: none;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
    }

    .note-date {
      font-size: 11.5px;
      color: #6b7280;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note-empty {
      padding: 16px 10px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
    }

    /* Sidebar folders & folding */
    .folder-group {
      margin-bottom: 4px;
      border-radius: 6px;
      border: 1px solid transparent;
    }

    .folder-group.drop-target {
      background: #eff6ff;
      border-color: #60a5fa;
    }

    .note-list.drop-target-root {
      box-shadow: inset 0 0 0 2px #60a5fa;
      border-radius: 6px;
    }

    .folder-header {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px 8px;
      border-radius: 5px;
      cursor: pointer;
      user-select: none;
      color: #374151;
    }

    .folder-header:hover {
      background: #ebeff4;
    }

    .folder-chevron {
      flex: 0 0 14px;
      text-align: center;
      font-size: 11px;
      color: #6b7280;
      line-height: 1;
    }

    .folder-name {
      flex: 1 1 auto;
      min-width: 0;
      font-weight: 600;
      font-size: 13px;
      color: #1f2937;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .folder-count {
      flex: 0 0 auto;
      font-size: 11px;
      color: #6b7280;
      padding: 1px 5px;
      border-radius: 999px;
      background: #e5e7eb;
    }

    .folder-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 0 0 auto;
    }

    .folder-btn {
      width: 20px;
      height: 20px;
      padding: 0;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #6b7280;
      font-size: 13px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
    }

    .folder-header:hover .folder-btn,
    .folder-header:focus-within .folder-btn {
      opacity: 1;
    }

    .folder-btn:hover {
      background: rgba(15, 23, 42, 0.08);
      color: #111827;
    }

    .folder-children {
      list-style: none;
      margin: 2px 0 4px 12px;
      padding: 0 0 0 8px;
      border-left: 1px solid #d9dde3;
    }

    .folder-empty {
      padding: 6px 10px;
      font-size: 12px;
      color: #9ca3af;
      font-style: italic;
    }

    .sidebar-footer {
      display: flex;
      gap: 6px;
      padding: 10px;
      border-top: 1px solid #d9dde3;
      background: #f6f7f9;
    }

    .sidebar-footer .btn {
      padding: 7px 9px;
      font-size: 12.5px;
    }

    .btn {
      padding: 8px 12px;
      border-radius: 5px;
      border: 1px solid #cfd6df;
      background: #ffffff;
      color: #1f2328;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover {
      background: #f0f2f5;
    }

    .btn:active {
      background: #e5e9ef;
    }

    .btn-primary {
      flex: 1 1 auto;
      background: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #1d4ed8;
      border-color: #1d4ed8;
    }

    .btn-primary:active {
      background: #1e40af;
    }

    .btn-sm {
      padding: 4px 10px;
      font-size: 12.5px;
    }

    /* Main workspace */
    .main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: #ffffff;
    }

    .editor-header {
      height: 40px;
      flex: 0 0 40px;
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      background: #f6f7f9;
      border-bottom: 1px solid #d9dde3;
      padding-right: 12px;
      min-width: 0;
    }

    .tab-bar {
      flex: 1 1 auto;
      display: flex;
      align-items: stretch;
      min-width: 0;
      overflow: hidden;
    }

    .tab-strip {
      display: flex;
      align-items: stretch;
      overflow-x: auto;
      overflow-y: hidden;
      min-width: 0;
      scrollbar-width: none;
    }

    .tab-strip::-webkit-scrollbar {
      display: none;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px 0 12px;
      background: #eef1f5;
      border-right: 1px solid #d9dde3;
      border-top: 2px solid transparent;
      font-size: 13px;
      font-weight: 500;
      color: #4b5563;
      cursor: pointer;
      user-select: none;
      flex: 0 0 auto;
      max-width: 190px;
    }

    .tab:hover {
      background: #e5e9f0;
      color: #1f2328;
    }

    .tab.active {
      background: #ffffff;
      border-top-color: #2563eb;
      color: #111827;
      font-weight: 600;
      margin-bottom: -1px;
    }

    .tab-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .tab-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      padding: 0;
      border: none;
      border-radius: 3px;
      background: transparent;
      color: #6b7280;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .tab-close:hover {
      background: #d9dde3;
      color: #111827;
    }

    .tab.active .tab-close:hover {
      background: #e5e7eb;
    }

    .tab-add {
      flex: 0 0 34px;
      width: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-right: 1px solid transparent;
      background: transparent;
      color: #4b5563;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      user-select: none;
    }

    .tab-add:hover {
      background: #e5e9f0;
      color: #111827;
    }

    .header-actions {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding-left: 10px;
    }

    .save-status {
      display: flex;
      align-items: center;
      font-size: 12px;
      color: #6b7280;
      user-select: none;
      margin-right: 4px;
    }

    .save-status.error {
      color: #dc2626;
    }

    .empty-state {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7280;
      font-size: 14px;
      user-select: none;
    }

    /* Split editor + live preview */
    .workspace {
      flex: 1 1 auto;
      display: flex;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      background: #ffffff;
    }

    .editor-pane {
      flex: 1 1 50%;
      min-width: 0;
      height: 100%;
      overflow: hidden;
    }

    .CodeMirror {
      height: 100%;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 14px;
      line-height: 1.55;
      color: #1f2328;
      background: #ffffff;
    }

    .CodeMirror-gutters {
      background: #f8f9fb;
      border-right: 1px solid #e5e7eb;
    }

    .CodeMirror-linenumber {
      color: #8b949e;
      padding: 0 8px 0 6px;
    }

    .CodeMirror-lines {
      padding: 10px 0;
    }

    .CodeMirror pre.CodeMirror-line,
    .CodeMirror pre.CodeMirror-line-like {
      padding: 0 14px;
    }

    /* Slash menu popup */
    .CodeMirror-hints {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      padding: 4px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.12);
      min-width: 170px;
    }

    .CodeMirror-hint {
      padding: 5px 10px;
      border-radius: 4px;
      color: #1f2328;
      line-height: 1.4;
    }

    li.CodeMirror-hint-active {
      background: #dbeafe;
      color: #1e3a8a;
    }

    /* Live preview slash menu */
    .slash-menu {
      position: fixed;
      z-index: 1000;
      margin: 0;
      padding: 4px;
      list-style: none;
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.12);
      min-width: 180px;
      max-height: 260px;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
    }

    .slash-menu-item {
      padding: 5px 10px;
      border-radius: 4px;
      color: #1f2328;
      line-height: 1.4;
      cursor: pointer;
      user-select: none;
    }

    .slash-menu-item:hover {
      background: #f0f4f8;
    }

    .slash-menu-item.active {
      background: #dbeafe;
      color: #1e3a8a;
    }

    /* Markdown preview */
    .markdown {
      flex: 1 1 50%;
      min-width: 0;
      height: 100%;
      padding: 12px 24px 32px 24px;
      overflow: auto;
      line-height: 1.6;
      color: #1f2328;
      word-wrap: break-word;
      background: #ffffff;
      outline: none;
    }

    @media (min-width: 900px) {
      .markdown {
        border-left: 1px solid #e5e7eb;
      }
      .editor-pane[hidden] + .markdown {
        border-left: none;
      }
    }

    @media (max-width: 899px) {
      .sidebar {
        flex: 0 0 220px;
        width: 220px;
      }
    }

    @media (max-width: 640px) {
      .app {
        flex-direction: column;
      }
      .sidebar {
        flex: 0 0 auto;
        width: 100%;
        max-height: 34vh;
        border-right: none;
        border-bottom: 1px solid #d9dde3;
      }
    }

    .markdown > :first-child {
      margin-top: 0;
    }

    .markdown h1, .markdown h2, .markdown h3,
    .markdown h4, .markdown h5, .markdown h6 {
      margin: 1.2em 0 0.5em;
      font-weight: 600;
      line-height: 1.3;
    }

    .markdown h1 { font-size: 1.9em; padding-bottom: 0.25em; border-bottom: 1px solid #e5e7eb; }
    .markdown h2 { font-size: 1.5em; padding-bottom: 0.2em; border-bottom: 1px solid #e5e7eb; }
    .markdown h3 { font-size: 1.25em; }
    .markdown h4 { font-size: 1.05em; }
    .markdown h5 { font-size: 0.92em; }
    .markdown h6 { font-size: 0.85em; color: #57606a; }

    .markdown p {
      margin: 0 0 0.9em;
    }

    .markdown a {
      color: #2563eb;
      text-decoration: underline;
    }

    .markdown ul, .markdown ol {
      margin: 0 0 0.9em;
      padding-left: 1.75em;
    }

    .markdown li {
      margin: 0.25em 0;
    }

    .markdown li > input[type="checkbox"] {
      margin: 0 0.45em 0.15em -1.35em;
      vertical-align: middle;
      cursor: pointer;
    }

    .markdown code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 0.9em;
      background: #f3f4f6;
      padding: 0.15em 0.35em;
      border-radius: 4px;
    }

    .markdown pre {
      background: #f3f4f6;
      padding: 12px 14px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 0 0 1em;
      line-height: 1.45;
    }

    .markdown pre code {
      background: transparent;
      padding: 0;
      border-radius: 0;
      font-size: 13.5px;
    }

    .markdown blockquote {
      margin: 0 0 1em;
      padding: 2px 14px;
      border-left: 4px solid #d0d7de;
      color: #57606a;
    }

    .markdown blockquote > :last-child {
      margin-bottom: 0;
    }

    .markdown hr {
      border: none;
      border-top: 1px solid #d0d7de;
      margin: 1.25em 0;
    }

    .markdown table {
      border-collapse: collapse;
      margin: 0 0 1em;
      max-width: 100%;
    }

    .markdown th, .markdown td {
      border: 1px solid #d0d7de;
      padding: 6px 12px;
      text-align: left;
      min-width: 80px;
    }

    .markdown th[align="right"], .markdown td[align="right"] {
      text-align: right;
    }

    .markdown th {
      background: #f6f8fa;
      font-weight: 600;
      position: relative;
      padding-right: 36px;
    }

    .markdown td[data-col-type="checkbox"] {
      text-align: center;
    }

    .markdown td input[type="checkbox"] {
      cursor: pointer;
      margin: 0;
      vertical-align: middle;
    }

    .markdown td .cell-date {
      font: inherit;
      font-size: 13px;
      color: #1f2328;
      border: none;
      background: transparent;
      outline: none;
      cursor: pointer;
      padding: 0;
    }

    .table-wrap {
      display: inline-flex;
      flex-direction: column;
      margin: 0 0 1em;
      max-width: 100%;
    }

    .table-row-top {
      display: flex;
      align-items: stretch;
      max-width: 100%;
      overflow-x: auto;
    }

    .table-wrap table {
      margin: 0;
    }

    .table-add-col, .table-add-row {
      border: 1px dashed #cfd6df;
      border-radius: 4px;
      background: #f8f9fb;
      color: #6b7280;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      line-height: 1;
      padding: 0;
      user-select: none;
    }

    .table-add-col {
      width: 24px;
      flex: 0 0 24px;
      margin-left: 4px;
    }

    .table-add-row {
      height: 22px;
      margin-top: 4px;
      margin-right: 28px;
    }

    .table-add-col:hover, .table-add-row:hover {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #2563eb;
    }

    .col-type-btn {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      padding: 1px 5px;
      border: 1px solid #d0d7de;
      border-radius: 3px;
      background: #ffffff;
      color: #57606a;
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1.4;
      cursor: pointer;
      user-select: none;
    }

    .col-type-btn:hover {
      background: #dbeafe;
      border-color: #93c5fd;
      color: #1d4ed8;
    }

    .col-type-menu .slash-menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .col-type-badge {
      display: inline-block;
      width: 22px;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: #57606a;
    }

    .markdown a {
      color: #2563eb;
      text-decoration: underline;
      cursor: pointer;
    }

    .markdown a:hover {
      color: #1d4ed8;
    }

    .markdown img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* Interactive image wrapper in live preview */
    .img-wrap {
      position: relative;
      display: inline-block;
      max-width: 100%;
      margin: 0.25em 0;
      border-radius: 4px;
      vertical-align: middle;
      user-select: none;
    }

    .img-wrap:hover,
    .img-wrap.resizing {
      outline: 2px solid rgba(59, 130, 246, 0.55);
      outline-offset: 2px;
    }

    .img-toolbar {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 3px 4px;
      background: rgba(17, 24, 39, 0.86);
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
      z-index: 5;
    }

    .img-wrap:hover .img-toolbar,
    .img-wrap:focus-within .img-toolbar {
      opacity: 1;
      pointer-events: auto;
    }

    .img-tool-btn {
      border: none;
      background: transparent;
      color: #f9fafb;
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
      padding: 4px 6px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    .img-tool-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .img-resize-handle {
      position: absolute;
      right: -5px;
      bottom: -5px;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      background: #2563eb;
      border: 2px solid #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      cursor: nwse-resize;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
      z-index: 5;
    }

    .img-wrap:hover .img-resize-handle,
    .img-wrap.resizing .img-resize-handle {
      opacity: 1;
      pointer-events: auto;
    }

    .img-size-badge {
      position: absolute;
      left: 6px;
      bottom: 6px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(17, 24, 39, 0.85);
      color: #ffffff;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.3;
      pointer-events: none;
      z-index: 5;
    }

    /* Modals (Insert Image & Image Editor) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(15, 23, 42, 0.5);
      display: flex;
      align-items: center;

<body>

  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script src="/static/vendor/turndown.min.js"></script>
  <script src="/static/vendor/turndown-plugin-gfm.min.js"></script>
  <script src="/static/vendor/codemirror/lib/codemirror.js"></script>
  <script src="/static/vendor/codemirror/mode/xml/xml.js"></script>
  <script src="/static/vendor/codemirror/mode/meta.js"></script>
  <script src="/static/vendor/codemirror/mode/markdown/markdown.js"></script>
  <script src="/static/vendor/codemirror/addon/edit/continuelist.js"></script>
  <script src="/static/vendor/codemirror/addon/edit/closebrackets.js"></script>
  <script src="/static/vendor/codemirror/addon/hint/show-hint.js"></script>
  <script>
    (() => {
      const AUTOSAVE_DELAY_MS = 350;
      const AUTOSAVE_MAX_WAIT_MS = 1000;
      const PREVIEW_DELAY_MS = 150;
      const LARGE_NOTE_BYTES = 200 * 1024;
      const LARGE_PREVIEW_DELAY_MS = 500;
      const TABS_STORAGE_KEY = "notes.openTabs";
      const FOLDED_STORAGE_KEY = "notes.foldedFolders";
      const WS_RECONNECT_BASE_MS = 500;
      const WS_RECONNECT_MAX_MS = 5000;
      const WS_REQUEST_TIMEOUT_MS = 15000;
      const DEFAULT_USER = "user1";
      const MAX_IMAGE_BYTES = 10 * 1024 * 1024;

      const sidebarEl = document.getElementById("sidebar");
      const searchEl = document.getElementById("search");
      const foldAllBtn = document.getElementById("fold-all-btn");
      const noteListEl = document.getElementById("note-list");
      const newNoteBtn = document.getElementById("new-note-btn");
      const newFolderBtn = document.getElementById("new-folder-btn");
      const exportBtn = document.getElementById("export-btn");
      const tabStripEl = document.getElementById("tab-strip");
      const newTabBtn = document.getElementById("new-tab-btn");
      const saveStatusEl = document.getElementById("save-status");
      const sidebarToggleBtn = document.getElementById("sidebar-toggle-btn");
      const editorToggleBtn = document.getElementById("editor-toggle-btn");
      const previewToggleBtn = document.getElementById("preview-toggle-btn");
      const workspaceEl = document.getElementById("workspace");
      const emptyStateEl = document.getElementById("empty-state");
      const editorPaneEl = document.getElementById("editor-pane");
      const previewEl = document.getElementById("preview");
      const previewSlashMenuEl = document.getElementById("preview-slash-menu");
      const colTypeMenuEl = document.getElementById("col-type-menu");
      const imageUploadModalEl = document.getElementById("image-upload-modal");
      const imageUploadCloseBtn = document.getElementById("image-upload-close");
      const imageUploadCancelBtn = document.getElementById("image-upload-cancel");
      const imageDropzoneEl = document.getElementById("image-dropzone");
      const imageFileInputEl = document.getElementById("image-file-input");
      const imageAltInputEl = document.getElementById("image-alt-input");
      const imageUrlInputEl = document.getElementById("image-url-input");
      const imageUrlInsertBtn = document.getElementById("image-url-insert-btn");
      const imageEditorModalEl = document.getElementById("image-editor-modal");
      const imageEditorCloseBtn = document.getElementById("image-editor-close");
      const imageEditorCancelBtn = document.getElementById("image-editor-cancel");
      const imageEditorSaveBtn = document.getElementById("image-editor-save");
      const ieCanvasEl = document.getElementById("img-editor-canvas");
      const ieWidthInputEl = document.getElementById("ie-width");
      const ieHeightInputEl = document.getElementById("ie-height");
      const ieBrushSizeEl = document.getElementById("ie-brush-size");
      const ieInfoEl = document.getElementById("ie-info");

      const wideQuery = window.matchMedia("(min-width: 900px)");

      let notes = [];
      let folders = [];
      const foldedFolderIds = new Set();
      try {
        const savedFolded = JSON.parse(localStorage.getItem(FOLDED_STORAGE_KEY) || "[]");
        if (Array.isArray(savedFolded)) {
          for (const fid of savedFolded) {
            if (Number.isInteger(fid)) foldedFolderIds.add(fid);
          }
        }
      } catch {}
      let openTabIds = [];
      const tabDocs = new Map();
      let activeId = null;
      let dirty = false;
      let sidebarVisible = true;
      let wideEditorVisible = false;
      let widePreviewVisible = true;
      let narrowPreviewActive = true;
      let saveTimer = null;
      let saveFirstDirtyAt = null;
      let previewTimer = null;
      let previewSyncTimer = null;
      let saveInFlight = null;
      let loadSeq = 0;
      let previewSlash = null;
      let colTypeTarget = null;
      let activeTypedCell = null;
      let renamingNoteId = null;
      let renamingFolderId = null;
      let draggingNoteId = null;

      const imageVersions = new Map();
      let pendingImageInsert = null;
      let imageEditorState = null;
      let activeImgResize = null;

      let ws = null;
      let wsInitialized = false;
      let wsInitializing = false;
      let wsReqSeq = 0;
      const wsPending = new Map();
      let wsReconnectTimer = null;
      let wsReconnectDelay = WS_RECONNECT_BASE_MS;

      // Markdown + DOMPurify + Turndown setup
      marked.use({ gfm: true, breaks: true });

      DOMPurify.addHook("afterSanitizeAttributes", (node) => {
        if (node.tagName === "A") {
          node.setAttribute("target", "_blank");
          node.setAttribute("rel", "noopener noreferrer");
        }
        if (node.tagName === "INPUT") {
          if (node.getAttribute("type") !== "checkbox" || !node.hasAttribute("disabled")) {
            node.remove();
          } else {
            // Allow toggling GFM task-list checkboxes directly in the editable preview
            node.removeAttribute("disabled");
            node.setAttribute("contenteditable", "false");
          }
        }
      });

      const turndown = new TurndownService({
        headingStyle: "atx",
        hr: "---",
        bulletListMarker: "-",
        codeBlockStyle: "fenced",
        emDelimiter: "*",
        strongDelimiter: "**",
        br: "",
      });
      turndown.use(turndownPluginGfm.gfm);
      turndown.addRule("strikethrough", {
        filter: ["del", "s", "strike"],
        replacement: (content) => `~~${content}~~`,
      });
      function stripImageVersion(src) {
        if (!src) return "";
        if (src.startsWith("/images/")) {
          return src.split("?")[0];
        }
        return src;
      }

      turndown.addRule("imgUiIgnore", {
        filter: (node) =>
          node.nodeType === Node.ELEMENT_NODE &&
          (node.classList.contains("img-toolbar") ||
            node.classList.contains("img-resize-handle") ||
            node.classList.contains("img-size-badge")),
        replacement: () => "",
      });
      turndown.addRule("imgUiUnwrap", {
        filter: (node) =>
          node.nodeType === Node.ELEMENT_NODE && node.classList.contains("img-wrap"),
        replacement: (content) => content,
      });
      turndown.addRule("cleanImage", {
        filter: "img",
        replacement: (_content, node) => {
          const alt = (node.getAttribute("alt") || "").replace(/[\[\]]/g, "");
          const rawSrc = node.dataset.cleanSrc || node.getAttribute("src") || "";
          const src = stripImageVersion(rawSrc);
          const title = node.getAttribute("title") || "";
          if (!src) return "";
          const titlePart = title ? ` "${title.replace(/"/g, '\\"')}"` : "";
          return `![${alt}](${src}${titlePart})`;
        },
      });
      turndown.addRule("tableUiIgnore", {
        filter: (node) =>
          node.nodeType === Node.ELEMENT_NODE &&
          (node.classList.contains("col-type-btn") ||
            node.classList.contains("table-add-col") ||
            node.classList.contains("table-add-row")),
        replacement: () => "",
      });
      turndown.addRule("tableUiUnwrap", {
        filter: (node) =>
          node.nodeType === Node.ELEMENT_NODE &&
          (node.classList.contains("table-wrap") || node.classList.contains("table-row-top")),
        replacement: (content) => content,
      });
      turndown.addRule("tableCell", {
        filter: ["th", "td"],
        replacement: (content, node) => {
          const index = Array.prototype.indexOf.call(node.parentNode.childNodes, node);
          const prefix = index === 0 ? "| " : " ";
          const cb = node.querySelector('input[type="checkbox"]');
          if (cb) {
            return prefix + (cb.checked ? "[x]" : "[ ]") + " |";
          }
          const dateInput = node.querySelector('input[type="date"]');
          if (dateInput) {
            return prefix + (dateInput.value || "") + " |";
          }
          const clean = content.trim().replace(/\n+/g, " ");
          return prefix + clean + " |";
        },
      });

      function extractCodeText(node) {
        let out = "";
        const children = node.childNodes;
        for (let i = 0; i < children.length; i++) {
          const child = children[i];
          if (child.nodeType === Node.TEXT_NODE) {
            out += child.nodeValue;
          } else if (child.nodeName === "BR") {
            out += "\n";
          } else if (child.nodeType === Node.ELEMENT_NODE) {
            const isBlock = child.nodeName === "DIV" || child.nodeName === "P";
            if (isBlock && out.length > 0 && !out.endsWith("\n")) {
              out += "\n";
            }
            out += extractCodeText(child);
            if (isBlock && i < children.length - 1 && !out.endsWith("\n")) {
              out += "\n";
            }
          }
        }
        return out;
      }

      turndown.addRule("fencedCodeBlock", {
        filter: (node, options) =>
          options.codeBlockStyle === "fenced" && node.nodeName === "PRE",
        replacement: (_content, node, options) => {
          const codeEl = node.querySelector("code");
          const className = codeEl ? codeEl.getAttribute("class") || "" : "";
          const language = (className.match(/language-(\S+)/) || [null, ""])[1];
          const rawCode = extractCodeText(node).replace(/\r\n?/g, "\n");
          const code = rawCode.replace(/\n$/, "");
          const fenceChar = options.fence.charAt(0);
          let fenceSize = 3;
          const fenceRe = new RegExp("^" + fenceChar + "{3,}", "gm");
          let match;
          while ((match = fenceRe.exec(code))) {
            if (match[0].length >= fenceSize) {
              fenceSize = match[0].length + 1;
            }
          }
          const fence = fenceChar.repeat(fenceSize);
          return "\n\n" + fence + language + "\n" + code + "\n" + fence + "\n\n";
        },
      });

      turndown.addRule("listItem", {
        filter: "li",
        replacement: (content, node, options) => {
          content = content
            .replace(/^\n+/, "")
            .replace(/\n+$/, "\n")
            .replace(/^(\[[ x]\])\s+/, "$1 ")
            .replace(/\n/gm, "\n  ");
          let prefix = options.bulletListMarker + " ";
          const parent = node.parentNode;
          if (parent.nodeName === "OL") {
            const start = parent.getAttribute("start");
            const index = Array.prototype.indexOf.call(parent.children, node);
            prefix = (start ? Number(start) + index : index + 1) + ". ";
          }
          return prefix + content + (node.nextSibling && !/\n$/.test(content) ? "\n" : "");
        },
      });

      function previewToMarkdown(root) {
        let md = turndown.turndown(root);
        let trailingBlocks = 0;
        let node = root.lastChild;
        while (node) {
          if (node.nodeType === Node.TEXT_NODE && !node.nodeValue.trim()) {
            node = node.previousSibling;
            continue;
          }
          if (node.nodeName === "BR") {
            trailingBlocks += 1;
            node = node.previousSibling;
            continue;
          }
          if (
            (node.nodeName === "P" || node.nodeName === "DIV") &&
            node.textContent.trim() === "" &&
            !node.querySelector("img, hr, input, table, pre")
          ) {
            trailingBlocks += 1;
            node = node.previousSibling;
            continue;
          }
          break;
        }
        if (trailingBlocks > 0 && md.length > 0) {
          md += "\n".repeat(trailingBlocks + 1);
        } else if (
          node &&
          (node.nodeName === "P" || node.nodeName === "DIV") &&
          node.lastChild &&
          node.lastChild.nodeName === "BR"
        ) {
          md += "\n";
        }
        return md;
      }

      function renderPreview(text) {
        if (previewSyncTimer !== null) {
          clearTimeout(previewSyncTimer);
          previewSyncTimer = null;
        }
        if (typeof closePreviewSlashMenu === "function") {
          closePreviewSlashMenu();
        }
        if (typeof closeColTypeMenu === "function") {
          closeColTypeMenu();
        }
        activeTypedCell = null;
        const prevScroll = previewEl.scrollTop;
        previewEl.innerHTML = DOMPurify.sanitize(marked.parse(text), {
          ADD_TAGS: ["input"],
          ADD_ATTR: ["type", "checked", "disabled", "align"],
        });
        if (typeof enhanceTables === "function") {
          enhanceTables(previewEl);
        }
        if (typeof enhanceImages === "function") {
          enhanceImages(previewEl);
        }
        previewEl.scrollTop = prevScroll;
      }

      // Formatting shortcut helpers
      function wrap(cm, mark) {
        const sel = cm.getSelection();
        if (sel.length >= mark.length * 2 && sel.startsWith(mark) && sel.endsWith(mark)) {
          cm.replaceSelection(sel.slice(mark.length, -mark.length), "around");
        } else if (sel) {
          cm.replaceSelection(mark + sel + mark, "around");
        } else {
          const c = cm.getCursor();
          cm.replaceSelection(mark + mark);
          cm.setCursor({ line: c.line, ch: c.ch + mark.length });
        }
      }

      function insertLink(cm) {
        const sel = cm.getSelection() || "text";
        const from = cm.getCursor("from");
        cm.replaceSelection("[" + sel + "](url)");
        const start = { line: from.line, ch: from.ch + sel.length + 3 };
        cm.setSelection(start, { line: start.line, ch: start.ch + 3 });
      }

      // Slash menu (shared by CodeMirror editor and live preview)
      const SLASH_ITEMS = [
        { id: "h1", name: "Heading 1", keywords: "h1 header title", insert: "# {c}" },
        { id: "h2", name: "Heading 2", keywords: "h2 header subtitle", insert: "## {c}" },
        { id: "h3", name: "Heading 3", keywords: "h3 header", insert: "### {c}" },
        { id: "ul", name: "Bullet list", keywords: "list ul unordered", insert: "- {c}" },
        { id: "ol", name: "Numbered list", keywords: "list ol ordered", insert: "1. {c}" },
        { id: "task", name: "Task list", keywords: "todo checklist checkbox", insert: "- [ ] {c}" },
        { id: "quote", name: "Quote", keywords: "blockquote callout", insert: "> {c}" },
        { id: "code", name: "Code block", keywords: "block pre fence snippet", insert: "```\n{c}\n```" },
        { id: "table", name: "Table", keywords: "grid columns rows", insert: "| {c}Column | Column | Column |\n| --- | --- | --- |\n|  |  |  |" },
        { id: "divider", name: "Divider", keywords: "hr line rule separator", insert: "---\n{c}" },
        { id: "link", name: "Link", keywords: "links url href anchor", insert: "[{c}text](url)", select: "text" },
        { id: "image", name: "Image", keywords: "images img picture photo upload", insert: "![{c}alt](url)", select: "alt" },
      ];

      function filterSlashItems(query) {
        const q = query.toLowerCase();
        if (!q) return SLASH_ITEMS;
        return SLASH_ITEMS.filter(
          (item) => item.name.toLowerCase().includes(q) || item.keywords.includes(q)
        );
      }

      function slashHint(cm) {
        const cur = cm.getCursor();
        const before = cm.getLine(cur.line).slice(0, cur.ch);
        const match = before.match(/(^|\s)\/(\w*)$/);
        if (!match) return null;
        const query = match[2];
        const from = { line: cur.line, ch: cur.ch - query.length - 1 };
        return {
          from,
          to: cur,
          list: filterSlashItems(query).map((item) => ({
            text: item.insert,
            displayText: item.name,
            hint: (editor, data) => {
              if (item.id === "image") {
                editor.replaceRange("", data.from, data.to);
                openImageUploadModal({ mode: "cm", pos: editor.getCursor() });
                return;
              }
              const at = item.insert.indexOf("{c}");
              const text = item.insert.replace("{c}", "");
              const baseIndex = editor.indexFromPos(data.from);
              editor.replaceRange(text, data.from, data.to);
              const startPos = editor.posFromIndex(baseIndex + at);
              if (item.select) {
                const endPos = editor.posFromIndex(baseIndex + at + item.select.length);
                editor.setSelection(startPos, endPos);
              } else {
                editor.setCursor(startPos);
              }
            },
          })),
        };
      }

      // CodeMirror 5 editor
      const cm = CodeMirror(editorPaneEl, {
        mode: "markdown",
        lineNumbers: true,
        lineWrapping: true,
        indentUnit: 2,
        tabSize: 2,
        autoCloseBrackets: { pairs: "()[]{}``", closeBefore: ")]}:;>", triples: "" },
        extraKeys: {
          Enter: "newlineAndIndentContinueMarkdownList",
          Tab: (editor) => {
            const line = editor.getLine(editor.getCursor().line);
            if (editor.somethingSelected() || /^\s*([*+-]|\d+[.)])\s/.test(line)) {
              editor.indentSelection("add");
            } else {
              editor.replaceSelection("  ", "end");
            }
          },
          "Shift-Tab": (editor) => editor.indentSelection("subtract"),
          "Ctrl-B": (editor) => wrap(editor, "**"),
          "Cmd-B": (editor) => wrap(editor, "**"),
          "Ctrl-I": (editor) => wrap(editor, "*"),
          "Cmd-I": (editor) => wrap(editor, "*"),
          "Ctrl-K": insertLink,
          "Cmd-K": insertLink,
        },
      });

      // Open slash menu on '/' at start of line or after whitespace
      cm.on("inputRead", (editor, change) => {
        if (change.origin === "+input" && change.text[0] === "/") {
          const cur = editor.getCursor();
          const before = editor.getLine(cur.line).slice(0, cur.ch);
          if (/(^|\s)\/$/.test(before)) {
            editor.showHint({ hint: slashHint, completeSingle: false });
          }
        }
      });

      // Paste image file or URL over selected text -> ![alt](url) or [selected text](url)
      cm.on("paste", (editor, event) => {
        const clipboard = event.clipboardData || window.clipboardData;
        const imgFile = extractClipboardImage(clipboard);
        if (imgFile) {
          event.preventDefault();
          const pos = editor.getCursor();
          uploadAndInsertImageFile(imgFile, "", { mode: "cm", pos });
          return;
        }
        if (!editor.somethingSelected()) return;
        const pasted = clipboard?.getData("text")?.trim();
        if (pasted && /^https?:\/\/\S+$/.test(pasted)) {
          event.preventDefault();
          const sel = editor.getSelection();
          editor.replaceSelection(`[${sel}](${pasted})`, "end");
        }
      });

      // One-way scroll sync: editor -> preview (skipped while user is editing preview)
      cm.on("scroll", () => {
        if (previewEl.hidden || previewEl.contains(document.activeElement)) return;
        const info = cm.getScrollInfo();
        const maxEditorScroll = info.height - info.clientHeight;
        if (maxEditorScroll <= 0) return;
        const ratio = info.top / maxEditorScroll;
        const maxPreviewScroll = previewEl.scrollHeight - previewEl.clientHeight;
        if (maxPreviewScroll > 0) {
          previewEl.scrollTop = ratio * maxPreviewScroll;
        }
      });

      function syncPreviewToEditor() {
        if (previewSyncTimer !== null) {
          clearTimeout(previewSyncTimer);
          previewSyncTimer = null;
        }
        if (activeId === null || previewEl.contentEditable === "false") return;
        const md = previewToMarkdown(previewEl);
        if (md === cm.getValue()) return;
        const scrollInfo = cm.getScrollInfo();
        const lastLine = cm.lastLine();
        cm.replaceRange(
          md,
          { line: 0, ch: 0 },
          { line: lastLine, ch: cm.getLine(lastLine).length },
          "preview"
        );
        cm.scrollTo(scrollInfo.left, scrollInfo.top);
      }

      function flushPreviewSync() {
        if (previewSyncTimer !== null) {
          syncPreviewToEditor();
        }
      }

      function schedulePreviewToEditor() {
        if (activeId === null) return;
        if (previewSyncTimer !== null) {
          clearTimeout(previewSyncTimer);
        }
        const delay = previewEl.innerHTML.length > LARGE_NOTE_BYTES ? LARGE_PREVIEW_DELAY_MS : PREVIEW_DELAY_MS;
        previewSyncTimer = setTimeout(syncPreviewToEditor, delay);
      }

      function applyLayout() {
        flushPreviewSync();
        const wasPreviewHidden = previewEl.hidden;

        sidebarEl.hidden = !sidebarVisible;
        sidebarToggleBtn.textContent = sidebarVisible ? "Hide sidebar" : "Show sidebar";

        const isWide = wideQuery.matches;
        if (isWide) {
          editorToggleBtn.hidden = false;
          editorPaneEl.hidden = !wideEditorVisible;
          previewEl.hidden = !widePreviewVisible;
          editorToggleBtn.textContent = wideEditorVisible ? "Hide editor" : "Show editor";
          previewToggleBtn.textContent = widePreviewVisible ? "Hide preview" : "Show preview";
        } else {
          editorToggleBtn.hidden = true;
          editorPaneEl.hidden = narrowPreviewActive;
          previewEl.hidden = !narrowPreviewActive;
          previewToggleBtn.textContent = narrowPreviewActive ? "Edit" : "Preview";
        }

        if (wasPreviewHidden && !previewEl.hidden) {
          renderPreview(cm.getValue());
        }
        if (!editorPaneEl.hidden) cm.refresh();
      }

      function schedulePreview() {
        if (previewEl.hidden) return;
        if (previewTimer !== null) {
          clearTimeout(previewTimer);
        }
        const text = cm.getValue();
        const delay = text.length > LARGE_NOTE_BYTES ? LARGE_PREVIEW_DELAY_MS : PREVIEW_DELAY_MS;
        previewTimer = setTimeout(() => {
          previewTimer = null;
          if (!previewEl.hidden) {
            renderPreview(cm.getValue());
          }
        }, delay);
      }

      cm.on("change", (_editor, change) => {
        if (change.origin === "setValue" || change.origin === "remote") {
          if (previewTimer !== null) {
            clearTimeout(previewTimer);
            previewTimer = null;
          }
          if (change.origin === "remote") {
            closePreviewSlashMenu();
            closeColTypeMenu();
          }
          if (!previewEl.hidden) {
            renderPreview(cm.getValue());
          }
          return;
        }
        if (activeId === null) return;
        dirty = true;
        setStatus("Unsaved...");
        if (change.origin !== "preview") {
          schedulePreview();
        }
        scheduleAutosave();
      });

      function formatDate(iso) {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return iso || "";
        const datePart = d.toLocaleDateString("en-US", {
          month: "short",
          day: "numeric",
          year: "numeric",
        });
        const timePart = d.toLocaleTimeString("en-US", {
          hour: "numeric",
          minute: "2-digit",
          hour12: true,
        });
        return `${datePart} ${timePart}`;
      }

      function setStatus(text, isError = false) {
        saveStatusEl.textContent = text;
        saveStatusEl.classList.toggle("error", isError);
      }

      function sortNotesNewestFirst() {
        notes.sort((a, b) => {
          if (a.updated_at !== b.updated_at) {
            return a.updated_at < b.updated_at ? 1 : -1;
          }
          return b.id - a.id;
        });
      }

      function sortFoldersAlpha() {
        folders.sort((a, b) => {
          const cmp = a.name.toLowerCase().localeCompare(b.name.toLowerCase());
          return cmp !== 0 ? cmp : a.id - b.id;
        });
      }

      function saveFoldedFolders() {
        try {
          localStorage.setItem(FOLDED_STORAGE_KEY, JSON.stringify(Array.from(foldedFolderIds)));
        } catch {}
      }

      function updateFoldAllButton() {
        if (folders.length === 0) {
          foldAllBtn.hidden = true;
          return;
        }
        foldAllBtn.hidden = false;
        const allFolded = folders.every((f) => foldedFolderIds.has(f.id));
        foldAllBtn.textContent = allFolded ? "\u25BE" : "\u25B8";
        foldAllBtn.title = allFolded ? "Unfold all folders" : "Fold all folders";
        foldAllBtn.setAttribute("aria-label", foldAllBtn.title);
      }

      function toggleFolderFold(folderId) {
        if (foldedFolderIds.has(folderId)) {
          foldedFolderIds.delete(folderId);
        } else {
          foldedFolderIds.add(folderId);
        }
        saveFoldedFolders();
        renderSidebar();
      }

      function toggleFoldAll() {
        if (folders.length === 0) return;
        const allFolded = folders.every((f) => foldedFolderIds.has(f.id));
        if (allFolded) {
          foldedFolderIds.clear();
        } else {
          for (const f of folders) foldedFolderIds.add(f.id);
        }
        saveFoldedFolders();
        renderSidebar();
      }

      function buildNoteItemEl(note) {
        const li = document.createElement("li");
        li.className = "note-item" + (note.id === activeId ? " active" : "");
        li.dataset.id = String(note.id);
        li.draggable = true;
        li.setAttribute("role", "option");
        li.setAttribute("aria-selected", note.id === activeId ? "true" : "false");

        const nameRow = document.createElement("div");
        nameRow.className = "note-name-row";

        const nameEl = document.createElement("div");
        nameEl.className = "note-name";
        nameEl.textContent = note.filename;
        nameEl.title = note.filename;

        const renameBtn = document.createElement("button");
        renameBtn.className = "note-rename-btn";
        renameBtn.type = "button";
        renameBtn.title = "Rename note";
        renameBtn.setAttribute("aria-label", `Rename ${note.filename}`);
        renameBtn.textContent = "\u270E";

        nameRow.appendChild(nameEl);
        nameRow.appendChild(renameBtn);

        const dateEl = document.createElement("div");
        dateEl.className = "note-date";
        dateEl.textContent = formatDate(note.updated_at);

        li.appendChild(nameRow);
        li.appendChild(dateEl);
        return li;
      }

      function renderSidebar() {
        if (
          (renamingNoteId !== null || renamingFolderId !== null) &&
          noteListEl.querySelector(".note-rename-input")
        ) {
          return;
        }
        updateFoldAllButton();

        const query = searchEl.value.trim().toLowerCase();
        const validFolderIds = new Set(folders.map((f) => f.id));
        const notesByFolder = new Map();
        const rootNotes = [];

        for (const note of notes) {
          const matchesQuery = !query || note.filename.toLowerCase().includes(query);
          if (note.folder_id != null && validFolderIds.has(note.folder_id)) {
            if (!matchesQuery) continue;
            let list = notesByFolder.get(note.folder_id);
            if (!list) {
              list = [];
              notesByFolder.set(note.folder_id, list);
            }
            list.push(note);
          } else if (matchesQuery) {
            rootNotes.push(note);
          }
        }

        noteListEl.innerHTML = "";
        const fragment = document.createDocumentFragment();
        let renderedCount = 0;

        for (const folder of folders) {
          const folderNotes = notesByFolder.get(folder.id) || [];
          const folderNameMatches = query && folder.name.toLowerCase().includes(query);
          if (query && folderNotes.length === 0 && !folderNameMatches) {
            continue;
          }
          const displayNotes =
            folderNameMatches && folderNotes.length === 0
              ? notes.filter((n) => n.folder_id === folder.id)
              : folderNotes;
          const isFolded = !query && foldedFolderIds.has(folder.id);

          const group = document.createElement("li");
          group.className = "folder-group";
          group.dataset.folderId = String(folder.id);

          const header = document.createElement("div");
          header.className = "folder-header";
          header.setAttribute("role", "button");
          header.setAttribute("aria-expanded", isFolded ? "false" : "true");

          const chevron = document.createElement("span");
          chevron.className = "folder-chevron";
          chevron.textContent = isFolded ? "\u25B8" : "\u25BE";

          const nameEl = document.createElement("span");
          nameEl.className = "folder-name";
          nameEl.textContent = folder.name;
          nameEl.title = folder.name;

          const totalInFolder = notes.filter((n) => n.folder_id === folder.id).length;
          const countEl = document.createElement("span");
          countEl.className = "folder-count";
          countEl.textContent = String(query ? displayNotes.length : totalInFolder);

          const actions = document.createElement("span");
          actions.className = "folder-actions";

          const addBtn = document.createElement("button");
          addBtn.type = "button";
          addBtn.className = "folder-btn folder-add-note-btn";
          addBtn.title = `New note in ${folder.name}`;
          addBtn.setAttribute("aria-label", `New note in ${folder.name}`);
          addBtn.textContent = "+";

          const renameBtn = document.createElement("button");
          renameBtn.type = "button";
          renameBtn.className = "folder-btn folder-rename-btn";
          renameBtn.title = `Rename ${folder.name}`;
          renameBtn.setAttribute("aria-label", `Rename ${folder.name}`);
          renameBtn.textContent = "\u270E";

          actions.appendChild(addBtn);
          actions.appendChild(renameBtn);

          header.appendChild(chevron);
          header.appendChild(nameEl);
          header.appendChild(countEl);
          header.appendChild(actions);
          group.appendChild(header);

          const childrenUl = document.createElement("ul");
          childrenUl.className = "folder-children";
          childrenUl.hidden = isFolded;

          if (displayNotes.length === 0) {
            const emptyChild = document.createElement("li");
            emptyChild.className = "folder-empty";
            emptyChild.textContent = "Empty folder";
            childrenUl.appendChild(emptyChild);
          } else {
            for (const note of displayNotes) {
              childrenUl.appendChild(buildNoteItemEl(note));
            }
          }

          group.appendChild(childrenUl);
          fragment.appendChild(group);
          renderedCount++;
        }

        for (const note of rootNotes) {
          fragment.appendChild(buildNoteItemEl(note));
          renderedCount++;
        }

        if (renderedCount === 0) {
          const empty = document.createElement("li");
          empty.className = "note-empty";
          empty.textContent = query ? "No matching notes" : "No notes";
          noteListEl.appendChild(empty);
          return;
        }

        noteListEl.appendChild(fragment);
      }

      function applyFolderCreated(folder) {
        if (!folder || !Number.isInteger(folder.id)) return;
        if (folders.some((f) => f.id === folder.id)) return;
        folders.push({
          id: folder.id,
          name: folder.name,
          created_at: folder.created_at,
        });
        sortFoldersAlpha();
        renderSidebar();
      }

      function applyFolderRenamed(folder) {
        if (!folder || !Number.isInteger(folder.id)) return;
        const existing = folders.find((f) => f.id === folder.id);
        if (existing) {
          existing.name = folder.name;
        } else {
          folders.push({
            id: folder.id,
            name: folder.name,
            created_at: folder.created_at,
          });
        }
        sortFoldersAlpha();
        renderSidebar();
      }

      function applyNoteMoved(note) {
        if (!note || !Number.isInteger(note.id)) return;
        const existing = notes.find((n) => n.id === note.id);
        if (existing) {
          existing.folder_id = note.folder_id ?? null;
        }
        renderSidebar();
      }

      async function moveNoteToFolder(noteId, folderId) {
        const existing = notes.find((n) => n.id === noteId);
        if (!existing) return;
        const currentFolderId = existing.folder_id ?? null;
        const nextFolderId = folderId ?? null;
        if (currentFolderId === nextFolderId) return;
        try {
          const res = await wsRequest("move_note", { id: noteId, folder_id: nextFolderId });
          if (nextFolderId !== null) {
            foldedFolderIds.delete(nextFolderId);
            saveFoldedFolders();
          }
          applyNoteMoved(res.note);
          if (!dirty) setStatus("Moved");
        } catch (err) {
          setStatus(err.message || "Move failed", true);
        }
      }

      async function handleNewFolder() {
        const raw = prompt("Folder name:");
        if (raw === null) return;
        const name = raw.trim();
        if (!name) return;
        try {
          const res = await wsRequest("create_folder", { name });
          applyFolderCreated(res.folder);
          if (!dirty) setStatus("Folder created");
        } catch (err) {
          setStatus(err.message || "Failed to create folder", true);
        }
      }

      function startInlineFolderRename(folderId) {
        const folder = folders.find((f) => f.id === folderId);
        if (!folder) return;
        if (renamingFolderId === folderId) return;
        if (renamingNoteId !== null || renamingFolderId !== null) {
          renamingNoteId = null;
          renamingFolderId = null;
          renderSidebar();
        }

        const group = noteListEl.querySelector(`.folder-group[data-folder-id="${folderId}"]`);
        if (!group) return;
        const header = group.querySelector(".folder-header");
        const nameEl = header ? header.querySelector(".folder-name") : null;
        if (!header || !nameEl) return;

        renamingFolderId = folderId;
        const originalName = folder.name;

        const input = document.createElement("input");
        input.type = "text";
        input.className = "note-rename-input";
        input.value = originalName;
        input.maxLength = 255;
        input.setAttribute("aria-label", "Folder name");

        nameEl.replaceWith(input);

        let settled = false;

        async function finish(commit) {
          if (settled) return;
          settled = true;
          const nextName = input.value.trim();
          renamingFolderId = null;

          if (!commit || !nextName || nextName === originalName) {
            renderSidebar();
            return;
          }

          try {
            const res = await wsRequest("rename_folder", { id: folderId, name: nextName });
            applyFolderRenamed(res.folder);
            if (!dirty) setStatus("Folder renamed");
          } catch (err) {
            renderSidebar();
            setStatus(err.message || "Rename failed", true);
          }
        }

        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            e.stopPropagation();
            finish(true);
          } else if (e.key === "Escape") {
            e.preventDefault();
            e.stopPropagation();
            finish(false);
          }
        });

        input.addEventListener("blur", () => finish(true));
        input.addEventListener("click", (e) => e.stopPropagation());

        input.focus();
        input.select();
      }

      function applyNoteRename(note) {
        if (!note || !Number.isInteger(note.id)) return;
        const existing = notes.find((n) => n.id === note.id);
        if (existing) {
          existing.filename = note.filename;
          if (note.updated_at) existing.updated_at = note.updated_at;
        } else {
          notes.push({
            id: note.id,
            filename: note.filename,
            updated_at: note.updated_at,
          });
          sortNotesNewestFirst();
        }
        renderSidebar();
        if (openTabIds.includes(note.id)) {
          renderTabs();
        }
        if (note.id === activeId) {
          document.title = `${note.filename} — Notes`;
        }
      }

      function startInlineRename(noteId) {
        const note = notes.find((n) => n.id === noteId);
        if (!note) return;
        if (renamingNoteId === noteId) return;
        if (renamingNoteId !== null) {
          renamingNoteId = null;
          renderSidebar();
        }

        const item = noteListEl.querySelector(`.note-item[data-id="${noteId}"]`);
        if (!item) return;
        const nameRow = item.querySelector(".note-name-row");
        if (!nameRow) return;

        renamingNoteId = noteId;
        const originalName = note.filename;

        const input = document.createElement("input");
        input.type = "text";
        input.className = "note-rename-input";
        input.value = originalName;
        input.maxLength = 255;
        input.setAttribute("aria-label", "Note name");

        nameRow.innerHTML = "";
        nameRow.appendChild(input);

        let settled = false;

        async function finish(commit) {
          if (settled) return;
          settled = true;
          const nextName = input.value.trim();
          renamingNoteId = null;

          if (!commit || !nextName || nextName === originalName) {
            renderSidebar();
            return;
          }

          try {
            const res = await wsRequest("rename_note", { id: noteId, filename: nextName });
            applyNoteRename(res.note);
            if (!dirty) setStatus("Renamed");
          } catch (err) {
            renderSidebar();
            setStatus(err.message || "Rename failed", true);
          }
        }

        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            e.stopPropagation();
            finish(true);
          } else if (e.key === "Escape") {
            e.preventDefault();
            e.stopPropagation();
            finish(false);
          }
        });

        input.addEventListener("blur", () => {
          finish(true);
        });

        input.addEventListener("click", (e) => {
          e.stopPropagation();
        });

        input.focus();
        input.select();
      }

      function applyRemoteContentToDoc(doc, newContent, isActive) {
        const oldContent = doc.getValue();
        if (oldContent === newContent) return false;
        let start = 0;
        const minLen = Math.min(oldContent.length, newContent.length);
        while (start < minLen && oldContent.charCodeAt(start) === newContent.charCodeAt(start)) {
          start++;
        }
        let oldEnd = oldContent.length;
        let newEnd = newContent.length;
        while (
          oldEnd > start &&
          newEnd > start &&
          oldContent.charCodeAt(oldEnd - 1) === newContent.charCodeAt(newEnd - 1)
        ) {
          oldEnd--;
          newEnd--;
        }
        const from = doc.posFromIndex(start);
        const to = doc.posFromIndex(oldEnd);
        const inserted = newContent.slice(start, newEnd);
        const scrollInfo = isActive ? cm.getScrollInfo() : null;
        doc.replaceRange(inserted, from, to, "remote");
        if (isActive && scrollInfo) {
          cm.scrollTo(scrollInfo.left, scrollInfo.top);
        }
        return true;
      }

      function rejectPendingRequests(reason) {
        for (const [reqId, pending] of wsPending.entries()) {
          clearTimeout(pending.timer);
          pending.reject(new Error(reason));
          wsPending.delete(reqId);
        }
      }

      function wsRequest(type, payload = {}) {
        return new Promise((resolve, reject) => {
          if (!ws || ws.readyState !== WebSocket.OPEN) {
            reject(new Error("Disconnected"));
            return;
          }
          const reqId = String(++wsReqSeq);
          const timer = setTimeout(() => {
            if (wsPending.delete(reqId)) {
              reject(new Error("Request timed out"));
            }
          }, WS_REQUEST_TIMEOUT_MS);

          wsPending.set(reqId, { resolve, reject, timer });
          try {
            ws.send(JSON.stringify({ type, req_id: reqId, ...payload }));
          } catch (err) {
            clearTimeout(timer);
            wsPending.delete(reqId);
            reject(err);
          }
        });
      }

      function handleRemoteNoteCreated(note) {
        if (!note || !Number.isInteger(note.id)) return;
        if (notes.some((n) => n.id === note.id)) return;
        notes.push({
          id: note.id,
          filename: note.filename,
          updated_at: note.updated_at,
          folder_id: note.folder_id ?? null,
        });
        sortNotesNewestFirst();
        renderSidebar();
      }

      function handleRemoteNoteUpdated(note) {
        if (!note || !Number.isInteger(note.id)) return;
        const existing = notes.find((n) => n.id === note.id);
        let filenameChanged = false;
        if (existing) {
          if (note.updated_at && existing.updated_at && note.updated_at < existing.updated_at) {
            return;
          }
          filenameChanged = existing.filename !== note.filename;
          existing.filename = note.filename;
          existing.updated_at = note.updated_at;
          if ("folder_id" in note) {
            existing.folder_id = note.folder_id ?? null;
          }
        } else {
          notes.push({
            id: note.id,
            filename: note.filename,
            updated_at: note.updated_at,
            folder_id: note.folder_id ?? null,
          });
        }
        sortNotesNewestFirst();
        renderSidebar();
        if (filenameChanged && openTabIds.includes(note.id)) {
          renderTabs();
          if (note.id === activeId) {
            document.title = `${note.filename} — Notes`;
          }
        }

        const cached = tabDocs.get(note.id);
        const remoteContent = typeof note.content === "string" ? note.content : "";

        if (note.id !== activeId) {
          if (cached) {
            if (!cached.updatedAt || !note.updated_at || note.updated_at >= cached.updatedAt) {
              cached.updatedAt = note.updated_at;
              applyRemoteContentToDoc(cached.doc, remoteContent, false);
            }
          }
          return;
        }

        if (cached && cached.updatedAt && note.updated_at && note.updated_at < cached.updatedAt) {
          return;
        }

        if (!dirty && previewSyncTimer === null && !saveInFlight) {
          if (cached) {
            cached.updatedAt = note.updated_at;
          }
          const changed = applyRemoteContentToDoc(cm.getDoc(), remoteContent, true);
          if (changed) {
            setStatus("Updated");
          }
        }
      }

      async function resyncAfterReconnect() {
        try {
          const listRes = await wsRequest("list_notes");
          notes = Array.isArray(listRes.notes) ? listRes.notes : [];
          folders = Array.isArray(listRes.folders) ? listRes.folders : [];
          sortNotesNewestFirst();
          sortFoldersAlpha();

          const byId = new Map(notes.map((n) => [n.id, n]));
          for (const [id, entry] of Array.from(tabDocs.entries())) {
            if (id === activeId) continue;
            const latest = byId.get(id);
            if (!latest || (entry.updatedAt && latest.updated_at !== entry.updatedAt)) {
              tabDocs.delete(id);
            }
          }

          renderSidebar();
          renderTabs();
          if (activeId !== null) {
            const activeMeta = byId.get(activeId);
            if (activeMeta) {
              document.title = `${activeMeta.filename} — Notes`;
            }
          }

          if (activeId !== null) {
            if (dirty) {
              await saveCurrentNote();
            } else {
              const noteId = activeId;
              const noteRes = await wsRequest("get_note", { id: noteId });
              const data = noteRes.note;
              if (activeId === noteId && data && !dirty && previewSyncTimer === null) {
                const cached = tabDocs.get(noteId);
                if (cached) {
                  cached.updatedAt = data.updated_at;
                }
                applyRemoteContentToDoc(cm.getDoc(), data.content || "", true);
                setStatus("Connected");
              }
            }
          } else {
            setStatus("Connected");
          }
        } catch (err) {
          setStatus(err.message || "Sync failed", true);
        }
      }

      function scheduleReconnect() {
        if (wsReconnectTimer !== null) return;
        const delay = wsReconnectDelay;
        wsReconnectDelay = Math.min(wsReconnectDelay * 2, WS_RECONNECT_MAX_MS);
        wsReconnectTimer = setTimeout(() => {
          wsReconnectTimer = null;
          connectWebSocket();
        }, delay);
      }

      function connectWebSocket() {
        if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
          return;
        }
        const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
        const socket = new WebSocket(`${proto}//${window.location.host}/ws`);
        ws = socket;

        socket.addEventListener("open", () => {
          if (ws !== socket) return;
          wsReconnectDelay = WS_RECONNECT_BASE_MS;
          if (!wsInitialized) {
            loadInitialNotes();
          } else {
            setStatus("Reconnected");
            resyncAfterReconnect();
          }
        });

        socket.addEventListener("message", (event) => {
          if (ws !== socket) return;
          let msg;
          try {
            msg = JSON.parse(event.data);
          } catch {
            return;
          }
          if (!msg || typeof msg !== "object") return;

          if (msg.req_id !== undefined && msg.req_id !== null) {
            const key = String(msg.req_id);
            const pending = wsPending.get(key);
            if (pending) {
              clearTimeout(pending.timer);
              wsPending.delete(key);
              if (msg.type === "error") {
                pending.reject(new Error(msg.error || "Request failed"));
              } else {
                pending.resolve(msg);
              }
              return;
            }
          }

          if (msg.type === "note_created" && msg.note) {
            handleRemoteNoteCreated(msg.note);
          } else if (msg.type === "note_updated" && msg.note) {
            handleRemoteNoteUpdated(msg.note);
          } else if (msg.type === "note_renamed" && msg.note) {
            applyNoteRename(msg.note);
          } else if (msg.type === "note_moved" && msg.note) {
            applyNoteMoved(msg.note);
          } else if (msg.type === "folder_created" && msg.folder) {
            applyFolderCreated(msg.folder);
          } else if (msg.type === "folder_renamed" && msg.folder) {
            applyFolderRenamed(msg.folder);
          } else if (msg.type === "image_updated" && msg.image) {
            handleRemoteImageUpdated(msg.image);
          }
        });

        socket.addEventListener("close", () => {
          if (ws !== socket) return;
          ws = null;
          rejectPendingRequests("Disconnected");
          setStatus("Reconnecting...", true);
          scheduleReconnect();
        });

        socket.addEventListener("error", () => {
          // Close event follows and triggers reconnect.
        });
      }

      async function saveCurrentNote() {
        flushPreviewSync();
        if (saveTimer !== null) {
          clearTimeout(saveTimer);
          saveTimer = null;
        }
        saveFirstDirtyAt = null;
        if (saveInFlight) {
          await saveInFlight;
        }
        if (activeId === null || !dirty) return true;

        const noteId = activeId;
        const content = cm.getValue();
        dirty = false;
        setStatus("Saving...");

        const run = (async () => {
          try {
            const res = await wsRequest("update_note", { id: noteId, content });
            const updated = res.note;
            const existing = notes.find((n) => n.id === noteId);
            if (existing && updated) {
              existing.updated_at = updated.updated_at;
              sortNotesNewestFirst();
              renderSidebar();
            }
            const cached = tabDocs.get(noteId);
            if (cached && updated) {
              cached.updatedAt = updated.updated_at;
            }
            if (!dirty && activeId === noteId) {
              setStatus("Saved");
            }
            return true;
          } catch (err) {
            if (activeId === noteId) {
              dirty = true;
              setStatus(err.message || "Save failed", true);
            }
            return false;
          }
        })();

        saveInFlight = run;
        try {
          return await run;
        } finally {
          if (saveInFlight === run) saveInFlight = null;
        }
      }

      function scheduleAutosave() {
        const now = Date.now();
        if (saveFirstDirtyAt === null) {
          saveFirstDirtyAt = now;
        }
        if (saveTimer !== null) {
          clearTimeout(saveTimer);
        }
        const elapsed = now - saveFirstDirtyAt;
        const remaining = Math.max(0, AUTOSAVE_MAX_WAIT_MS - elapsed);
        const delay = Math.min(AUTOSAVE_DELAY_MS, remaining);
        saveTimer = setTimeout(() => {
          saveTimer = null;
          saveFirstDirtyAt = null;
          saveCurrentNote();
        }, delay);
      }

      function saveTabsState() {
        try {
          localStorage.setItem(
            TABS_STORAGE_KEY,
            JSON.stringify({ openTabIds, activeId })
          );
        } catch {}
      }

      function restoreTabsState() {
        try {
          const raw = localStorage.getItem(TABS_STORAGE_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          if (!parsed || !Array.isArray(parsed.openTabIds)) return null;
          const validIds = new Set(notes.map((n) => n.id));
          const ids = parsed.openTabIds.filter((id) => validIds.has(id));
          const active = validIds.has(parsed.activeId) ? parsed.activeId : ids[0] ?? null;
          return { ids, active };
        } catch {
          return null;
        }
      }

      function saveActiveTabScroll() {
        if (activeId === null) return;
        const entry = tabDocs.get(activeId);
        if (!entry) return;
        const info = cm.getScrollInfo();
        entry.editorScroll = { left: info.left, top: info.top };
        entry.previewScroll = previewEl.scrollTop;
      }

      function renderTabs() {
        tabStripEl.innerHTML = "";
        const fragment = document.createDocumentFragment();
        let activeTabEl = null;

        for (const id of openTabIds) {
          const meta = notes.find((n) => n.id === id);
          if (!meta) continue;

          const isActive = id === activeId;
          const tab = document.createElement("div");
          tab.className = "tab" + (isActive ? " active" : "");
          tab.dataset.id = String(id);
          tab.setAttribute("role", "tab");
          tab.setAttribute("aria-selected", isActive ? "true" : "false");

          const label = document.createElement("span");
          label.className = "tab-label";
          label.textContent = meta.filename;
          label.title = meta.filename;

          const closeBtn = document.createElement("button");
          closeBtn.className = "tab-close";
          closeBtn.type = "button";
          closeBtn.title = "Close tab";
          closeBtn.setAttribute("aria-label", `Close ${meta.filename}`);
          closeBtn.innerHTML = "&times;";

          tab.appendChild(label);
          tab.appendChild(closeBtn);
          fragment.appendChild(tab);
          if (isActive) activeTabEl = tab;
        }

        tabStripEl.appendChild(fragment);
        if (activeTabEl) {
          activeTabEl.scrollIntoView({ block: "nearest", inline: "nearest" });
        }
      }

      async function selectNote(noteId) {
        if (noteId === activeId && openTabIds.includes(noteId)) {
          renderTabs();
          if (!editorPaneEl.hidden) cm.focus();
          return;
        }

        saveActiveTabScroll();
        flushPreviewSync();
        await saveCurrentNote();

        if (!openTabIds.includes(noteId)) {
          openTabIds.push(noteId);
        }

        const seq = ++loadSeq;
        activeId = noteId;
        dirty = false;

        workspaceEl.hidden = false;
        emptyStateEl.hidden = true;

        const meta = notes.find((n) => n.id === noteId);
        document.title = meta ? `${meta.filename} — Notes` : "Notes";
        renderSidebar();
        renderTabs();
        saveTabsState();
        setStatus("");

        // Instant switch if tab is already open in memory
        const cached = tabDocs.get(noteId);
        if (cached) {
          cm.swapDoc(cached.doc);
          cm.setOption("readOnly", false);
          previewEl.contentEditable = "true";
          if (!previewEl.hidden) {
            renderPreview(cm.getValue());
            previewEl.scrollTop = cached.previewScroll;
          }
          cm.scrollTo(cached.editorScroll.left, cached.editorScroll.top);
          if (!editorPaneEl.hidden) {
            cm.refresh();
            cm.focus();
          }
          return;
        }

        cm.setOption("readOnly", "nocursor");
        previewEl.contentEditable = "false";
        try {
          const res = await wsRequest("get_note", { id: noteId });
          const data = res.note;
          if (seq !== loadSeq) return;

          document.title = `${data.filename} — Notes`;
          const doc = new CodeMirror.Doc(data.content || "", "markdown");
          tabDocs.set(noteId, {
            doc,
            updatedAt: data.updated_at,
            editorScroll: { left: 0, top: 0 },
            previewScroll: 0,
          });
          cm.swapDoc(doc);
          cm.scrollTo(0, 0);
          if (!previewEl.hidden) {
            renderPreview(data.content || "");
            previewEl.scrollTop = 0;
          }
          cm.setOption("readOnly", false);
          previewEl.contentEditable = "true";
          if (!editorPaneEl.hidden) {
            cm.refresh();
            cm.focus();
          }
        } catch (err) {
          if (seq !== loadSeq) return;
          cm.setOption("readOnly", false);
          previewEl.contentEditable = "true";
          setStatus(err.message || "Failed to load note", true);
        }
      }

      async function closeTab(noteId) {
        const idx = openTabIds.indexOf(noteId);
        if (idx === -1) return;

        if (noteId === activeId) {
          flushPreviewSync();
          await saveCurrentNote();
        }

        openTabIds.splice(idx, 1);
        tabDocs.delete(noteId);

        if (noteId !== activeId) {
          renderTabs();
          saveTabsState();
          return;
        }

        if (openTabIds.length > 0) {
          const nextId = openTabIds[Math.min(idx, openTabIds.length - 1)];
          activeId = null;
          dirty = false;
          await selectNote(nextId);
          return;
        }

        // No open tabs left
        loadSeq++;
        activeId = null;
        dirty = false;
        cm.swapDoc(new CodeMirror.Doc("", "markdown"));
        cm.setOption("readOnly", "nocursor");
        previewEl.contentEditable = "false";
        previewEl.innerHTML = "";
        workspaceEl.hidden = true;
        emptyStateEl.hidden = false;
        document.title = "Notes";
        setStatus("");
        renderTabs();
        renderSidebar();
        saveTabsState();
      }

      async function createNote(filename, folderId = null) {
        const payload = { filename };
        if (folderId !== null && folderId !== undefined) {
          payload.folder_id = folderId;
        }
        const res = await wsRequest("create_note", payload);
        return res.note;
      }

      async function handleNewNote(folderId = null) {
        const targetFolderId = Number.isInteger(folderId) ? folderId : null;
        const folderMeta =
          targetFolderId !== null ? folders.find((f) => f.id === targetFolderId) : null;
        const raw = prompt(folderMeta ? `Note name in "${folderMeta.name}":` : "Note name:");
        if (raw === null) return;
        const name = raw.trim();
        if (!name) return;

        saveActiveTabScroll();
        await saveCurrentNote();

        try {
          const created = await createNote(name, targetFolderId);
          if (targetFolderId !== null) {
            foldedFolderIds.delete(targetFolderId);
            saveFoldedFolders();
          }
          if (!notes.some((n) => n.id === created.id)) {
            notes.unshift(created);
          }
          sortNotesNewestFirst();

          const query = searchEl.value.trim().toLowerCase();
          if (query && !created.filename.toLowerCase().includes(query)) {
            searchEl.value = "";
          }

          loadSeq++;

          if (!openTabIds.includes(created.id)) {
            openTabIds.push(created.id);
          }
          const doc = new CodeMirror.Doc("", "markdown");
          tabDocs.set(created.id, {
            doc,
            updatedAt: created.updated_at,
            editorScroll: { left: 0, top: 0 },
            previewScroll: 0,
          });

          activeId = created.id;
          dirty = false;
          workspaceEl.hidden = false;
          emptyStateEl.hidden = true;
          document.title = `${created.filename} — Notes`;
          cm.swapDoc(doc);
          cm.setOption("readOnly", false);
          previewEl.contentEditable = "true";
          cm.scrollTo(0, 0);
          if (!previewEl.hidden) {
            renderPreview("");
            previewEl.scrollTop = 0;
          }
          renderSidebar();
          renderTabs();
          saveTabsState();
          setStatus("");
          if (!editorPaneEl.hidden) {
            cm.refresh();
            cm.focus();
          }
        } catch (err) {
