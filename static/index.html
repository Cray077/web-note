<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes</title>
  <link rel="stylesheet" href="/static/vendor/codemirror/lib/codemirror.css">
  <link rel="stylesheet" href="/static/vendor/codemirror/addon/hint/show-hint.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #1f2328;
      background: #ffffff;
    }

    [hidden] {
      display: none !important;
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* Sidebar */
    .sidebar {
      flex: 0 0 270px;
      width: 270px;
      display: flex;
      flex-direction: column;
      background: #f6f7f9;
      border-right: 1px solid #d9dde3;
      min-width: 0;
    }

    .sidebar-search {
      padding: 10px;
      border-bottom: 1px solid #e5e8ec;
    }

    .sidebar-search input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #cfd6df;
      border-radius: 5px;
      background: #ffffff;
      font: inherit;
      font-size: 13px;
      color: #1f2328;
      outline: none;
    }

    .sidebar-search input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
    }

    .note-list {
      flex: 1 1 auto;
      overflow-y: auto;
      list-style: none;
      margin: 0;
      padding: 6px;
    }

    .note-item {
      padding: 9px 11px;
      border-radius: 5px;
      cursor: pointer;
      user-select: none;
      margin-bottom: 2px;
      border: 1px solid transparent;
    }

    .note-item:hover {
      background: #ebeff4;
    }

    .note-item.active {
      background: #dbeafe;
      border-color: #bfdbfe;
    }

    .note-name-row {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .note-name {
      flex: 1 1 auto;
      min-width: 0;
      font-weight: 600;
      font-size: 13.5px;
      color: #111827;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.35;
    }

    .note-rename-btn {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      padding: 0;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #6b7280;
      font-size: 12px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
    }

    .note-item:hover .note-rename-btn,
    .note-item:focus-within .note-rename-btn,
    .note-item.active .note-rename-btn {
      opacity: 1;
    }

    .note-rename-btn:hover {
      background: rgba(15, 23, 42, 0.08);
      color: #111827;
    }

    .note-rename-input {
      width: 100%;
      padding: 1px 5px;
      border: 1px solid #3b82f6;
      border-radius: 4px;
      background: #ffffff;
      font: inherit;
      font-weight: 600;
      font-size: 13.5px;
      line-height: 1.35;
      color: #111827;
      outline: none;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
    }

    .note-date {
      font-size: 11.5px;
      color: #6b7280;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note-empty {
      padding: 16px 10px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
    }

    .sidebar-footer {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #d9dde3;
      background: #f6f7f9;
    }

    .btn {
      padding: 8px 12px;
      border-radius: 5px;
      border: 1px solid #cfd6df;
      background: #ffffff;
      color: #1f2328;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover {
      background: #f0f2f5;
    }

    .btn:active {
      background: #e5e9ef;
    }

    .btn-primary {
      flex: 1 1 auto;
      background: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #1d4ed8;
      border-color: #1d4ed8;
    }

    .btn-primary:active {
      background: #1e40af;
    }

    .btn-sm {
      padding: 4px 10px;
      font-size: 12.5px;
    }

    /* Main workspace */
    .main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: #ffffff;
    }

    .editor-header {
      height: 40px;
      flex: 0 0 40px;
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      background: #f6f7f9;
      border-bottom: 1px solid #d9dde3;
      padding-right: 12px;
      min-width: 0;
    }

    .tab-bar {
      flex: 1 1 auto;
      display: flex;
      align-items: stretch;
      min-width: 0;
      overflow: hidden;
    }

    .tab-strip {
      display: flex;
      align-items: stretch;
      overflow-x: auto;
      overflow-y: hidden;
      min-width: 0;
      scrollbar-width: none;
    }

    .tab-strip::-webkit-scrollbar {
      display: none;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px 0 12px;
      background: #eef1f5;
      border-right: 1px solid #d9dde3;
      border-top: 2px solid transparent;
      font-size: 13px;
      font-weight: 500;
      color: #4b5563;
      cursor: pointer;
      user-select: none;
      flex: 0 0 auto;
      max-width: 190px;
    }

    .tab:hover {
      background: #e5e9f0;
      color: #1f2328;
    }

    .tab.active {
      background: #ffffff;
      border-top-color: #2563eb;
      color: #111827;
      font-weight: 600;
      margin-bottom: -1px;
    }

    .tab-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .tab-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      padding: 0;
      border: none;
      border-radius: 3px;
      background: transparent;
      color: #6b7280;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .tab-close:hover {
      background: #d9dde3;
      color: #111827;
    }

    .tab.active .tab-close:hover {
      background: #e5e7eb;
    }

    .tab-add {
      flex: 0 0 34px;
      width: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-right: 1px solid transparent;
      background: transparent;
      color: #4b5563;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      user-select: none;
    }

    .tab-add:hover {
      background: #e5e9f0;
      color: #111827;
    }

    .header-actions {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding-left: 10px;
    }

    .save-status {
      display: flex;
      align-items: center;
      font-size: 12px;
      color: #6b7280;
      user-select: none;
      margin-right: 4px;
    }

    .save-status.error {
      color: #dc2626;
    }

    .empty-state {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7280;
      font-size: 14px;
      user-select: none;
    }

    /* Split editor + live preview */
    .workspace {
      flex: 1 1 auto;
      display: flex;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      background: #ffffff;
    }

    .editor-pane {
      flex: 1 1 50%;
      min-width: 0;
      height: 100%;
      overflow: hidden;
    }

    .CodeMirror {
      height: 100%;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 14px;
      line-height: 1.55;
      color: #1f2328;
      background: #ffffff;
    }

    .CodeMirror-gutters {
      background: #f8f9fb;
      border-right: 1px solid #e5e7eb;
    }

    .CodeMirror-linenumber {
      color: #8b949e;
      padding: 0 8px 0 6px;
    }

    .CodeMirror-lines {
      padding: 10px 0;
    }

    .CodeMirror pre.CodeMirror-line,
    .CodeMirror pre.CodeMirror-line-like {
      padding: 0 14px;
    }

    /* Slash menu popup */
    .CodeMirror-hints {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      padding: 4px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.12);
      min-width: 170px;
    }

    .CodeMirror-hint {
      padding: 5px 10px;
      border-radius: 4px;
      color: #1f2328;
      line-height: 1.4;
    }

    li.CodeMirror-hint-active {
      background: #dbeafe;
      color: #1e3a8a;
    }

    /* Live preview slash menu */
    .slash-menu {
      position: fixed;
      z-index: 1000;
      margin: 0;
      padding: 4px;
      list-style: none;
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.12);
      min-width: 180px;
      max-height: 260px;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
    }

    .slash-menu-item {
      padding: 5px 10px;
      border-radius: 4px;
      color: #1f2328;
      line-height: 1.4;
      cursor: pointer;
      user-select: none;
    }

    .slash-menu-item:hover {
      background: #f0f4f8;
    }

    .slash-menu-item.active {
      background: #dbeafe;
      color: #1e3a8a;
    }

    /* Markdown preview */
    .markdown {
      flex: 1 1 50%;
      min-width: 0;
      height: 100%;
      padding: 12px 24px 32px 24px;
      overflow: auto;
      line-height: 1.6;
      color: #1f2328;
      word-wrap: break-word;
      background: #ffffff;
      outline: none;
    }

    @media (min-width: 900px) {
      .markdown {
        border-left: 1px solid #e5e7eb;
      }
      .editor-pane[hidden] + .markdown {
        border-left: none;
      }
    }

    @media (max-width: 899px) {
      .sidebar {
        flex: 0 0 220px;
        width: 220px;
      }
    }

    @media (max-width: 640px) {
      .app {
        flex-direction: column;
      }
      .sidebar {
        flex: 0 0 auto;
        width: 100%;
        max-height: 34vh;
        border-right: none;
        border-bottom: 1px solid #d9dde3;
      }
    }

    .markdown > :first-child {
      margin-top: 0;
    }

    .markdown h1, .markdown h2, .markdown h3,
    .markdown h4, .markdown h5, .markdown h6 {
      margin: 1.2em 0 0.5em;
      font-weight: 600;
      line-height: 1.3;
    }

    .markdown h1 { font-size: 1.9em; padding-bottom: 0.25em; border-bottom: 1px solid #e5e7eb; }
    .markdown h2 { font-size: 1.5em; padding-bottom: 0.2em; border-bottom: 1px solid #e5e7eb; }
    .markdown h3 { font-size: 1.25em; }
    .markdown h4 { font-size: 1.05em; }
    .markdown h5 { font-size: 0.92em; }
    .markdown h6 { font-size: 0.85em; color: #57606a; }

    .markdown p {
      margin: 0 0 0.9em;
    }

    .markdown a {
      color: #2563eb;
      text-decoration: underline;
    }

    .markdown ul, .markdown ol {
      margin: 0 0 0.9em;
      padding-left: 1.75em;
    }

    .markdown li {
      margin: 0.25em 0;
    }

    .markdown li > input[type="checkbox"] {
      margin: 0 0.45em 0.15em -1.35em;
      vertical-align: middle;
      cursor: pointer;
    }

    .markdown code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 0.9em;
      background: #f3f4f6;
      padding: 0.15em 0.35em;
      border-radius: 4px;
    }

    .markdown pre {
      background: #f3f4f6;
      padding: 12px 14px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 0 0 1em;
      line-height: 1.45;
    }

    .markdown pre code {
      background: transparent;
      padding: 0;
      border-radius: 0;
      font-size: 13.5px;
    }

    .markdown blockquote {
      margin: 0 0 1em;
      padding: 2px 14px;
      border-left: 4px solid #d0d7de;
      color: #57606a;
    }

    .markdown blockquote > :last-child {
      margin-bottom: 0;
    }

    .markdown hr {
      border: none;
      border-top: 1px solid #d0d7de;
      margin: 1.25em 0;
    }

    .markdown table {
      border-collapse: collapse;
      margin: 0 0 1em;
      max-width: 100%;
    }

    .markdown th, .markdown td {
      border: 1px solid #d0d7de;
      padding: 6px 12px;
      text-align: left;
      min-width: 80px;
    }

    .markdown th[align="right"], .markdown td[align="right"] {
      text-align: right;
    }

    .markdown th {
      background: #f6f8fa;
      font-weight: 600;
      position: relative;
      padding-right: 36px;
    }

    .markdown td[data-col-type="checkbox"] {
      text-align: center;
    }

    .markdown td input[type="checkbox"] {
      cursor: pointer;
      margin: 0;
      vertical-align: middle;
    }

    .markdown td .cell-date {
      font: inherit;
      font-size: 13px;
      color: #1f2328;
      border: none;
      background: transparent;
      outline: none;
      cursor: pointer;
      padding: 0;
    }

    .table-wrap {
      display: inline-flex;
      flex-direction: column;
      margin: 0 0 1em;
      max-width: 100%;
    }

    .table-row-top {
      display: flex;
      align-items: stretch;
      max-width: 100%;
      overflow-x: auto;
    }

    .table-wrap table {
      margin: 0;
    }

    .table-add-col, .table-add-row {
      border: 1px dashed #cfd6df;
      border-radius: 4px;
      background: #f8f9fb;
      color: #6b7280;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      line-height: 1;
      padding: 0;
      user-select: none;
    }

    .table-add-col {
      width: 24px;
      flex: 0 0 24px;
      margin-left: 4px;
    }

    .table-add-row {
      height: 22px;
      margin-top: 4px;
      margin-right: 28px;
    }

    .table-add-col:hover, .table-add-row:hover {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #2563eb;
    }

    .col-type-btn {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      padding: 1px 5px;
      border: 1px solid #d0d7de;
      border-radius: 3px;
      background: #ffffff;
      color: #57606a;
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1.4;
      cursor: pointer;
      user-select: none;
    }

    .col-type-btn:hover {
      background: #dbeafe;
      border-color: #93c5fd;
      color: #1d4ed8;
    }

    .col-type-menu .slash-menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .col-type-badge {
      display: inline-block;
      width: 22px;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: #57606a;
    }

    .markdown img {
      max-width: 100%;
    }
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-search">
        <input id="search" type="search" placeholder="Search notes..." autocomplete="off" aria-label="Search notes">
      </div>
      <ul id="note-list" class="note-list" role="listbox" aria-label="Notes"></ul>
      <div class="sidebar-footer">
        <button id="new-note-btn" class="btn btn-primary" type="button">+ New Note</button>
        <button id="export-btn" class="btn" type="button">Export</button>
      </div>
    </aside>

    <main class="main">
      <header class="editor-header">
        <div class="tab-bar">
          <div id="tab-strip" class="tab-strip" role="tablist" aria-label="Open notes"></div>
          <button id="new-tab-btn" class="tab-add" type="button" title="New note" aria-label="New note">+</button>
        </div>
        <div class="header-actions">
          <div id="save-status" class="save-status" aria-live="polite"></div>
          <button id="sidebar-toggle-btn" class="btn btn-sm" type="button">Hide sidebar</button>
          <button id="editor-toggle-btn" class="btn btn-sm" type="button">Hide editor</button>
          <button id="preview-toggle-btn" class="btn btn-sm" type="button">Hide preview</button>
        </div>
      </header>
      <div id="workspace" class="workspace">
        <div id="editor-pane" class="editor-pane"></div>
        <div id="preview" class="markdown" contenteditable="true" spellcheck="true" aria-label="Markdown preview editor"></div>
      </div>
      <div id="empty-state" class="empty-state" hidden>No open tabs — select a note from the sidebar or click +</div>
    </main>
  </div>
  <ul id="preview-slash-menu" class="slash-menu" role="listbox" aria-label="Insert block" hidden></ul>
  <ul id="col-type-menu" class="slash-menu col-type-menu" role="menu" aria-label="Column type" hidden></ul>

  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script src="/static/vendor/turndown.min.js"></script>
  <script src="/static/vendor/turndown-plugin-gfm.min.js"></script>
  <script src="/static/vendor/codemirror/lib/codemirror.js"></script>
  <script src="/static/vendor/codemirror/mode/xml/xml.js"></script>
  <script src="/static/vendor/codemirror/mode/meta.js"></script>
  <script src="/static/vendor/codemirror/mode/markdown/markdown.js"></script>
  <script src="/static/vendor/codemirror/addon/edit/continuelist.js"></script>
  <script src="/static/vendor/codemirror/addon/edit/closebrackets.js"></script>
  <script src="/static/vendor/codemirror/addon/hint/show-hint.js"></script>
  <script>
    (() => {
      const AUTOSAVE_DELAY_MS = 350;
      const AUTOSAVE_MAX_WAIT_MS = 1000;
      const PREVIEW_DELAY_MS = 150;
      const LARGE_NOTE_BYTES = 200 * 1024;
      const LARGE_PREVIEW_DELAY_MS = 500;
      const TABS_STORAGE_KEY = "notes.openTabs";
      const WS_RECONNECT_BASE_MS = 500;
      const WS_RECONNECT_MAX_MS = 5000;
      const WS_REQUEST_TIMEOUT_MS = 15000;

      const sidebarEl = document.getElementById("sidebar");
      const searchEl = document.getElementById("search");
      const noteListEl = document.getElementById("note-list");
      const newNoteBtn = document.getElementById("new-note-btn");
      const exportBtn = document.getElementById("export-btn");
      const tabStripEl = document.getElementById("tab-strip");
      const newTabBtn = document.getElementById("new-tab-btn");
      const saveStatusEl = document.getElementById("save-status");
      const sidebarToggleBtn = document.getElementById("sidebar-toggle-btn");
      const editorToggleBtn = document.getElementById("editor-toggle-btn");
      const previewToggleBtn = document.getElementById("preview-toggle-btn");
      const workspaceEl = document.getElementById("workspace");
      const emptyStateEl = document.getElementById("empty-state");
      const editorPaneEl = document.getElementById("editor-pane");
      const previewEl = document.getElementById("preview");
      const previewSlashMenuEl = document.getElementById("preview-slash-menu");
      const colTypeMenuEl = document.getElementById("col-type-menu");

      const wideQuery = window.matchMedia("(min-width: 900px)");

      let notes = [];
      let openTabIds = [];
      const tabDocs = new Map();
      let activeId = null;
      let dirty = false;
      let sidebarVisible = true;
      let wideEditorVisible = true;
      let widePreviewVisible = true;
      let narrowPreviewActive = false;
      let saveTimer = null;
      let saveFirstDirtyAt = null;
      let previewTimer = null;
      let previewSyncTimer = null;
      let saveInFlight = null;
      let loadSeq = 0;
      let previewSlash = null;
      let colTypeTarget = null;
      let activeTypedCell = null;
      let renamingNoteId = null;

      let ws = null;
      let wsInitialized = false;
      let wsInitializing = false;
      let wsReqSeq = 0;
      const wsPending = new Map();
      let wsReconnectTimer = null;
      let wsReconnectDelay = WS_RECONNECT_BASE_MS;

      // Markdown + DOMPurify + Turndown setup
      marked.use({ gfm: true, breaks: true });

      DOMPurify.addHook("afterSanitizeAttributes", (node) => {
        if (node.tagName === "A") {
          node.setAttribute("target", "_blank");
          node.setAttribute("rel", "noopener noreferrer");
        }
        if (node.tagName === "INPUT") {
          if (node.getAttribute("type") !== "checkbox" || !node.hasAttribute("disabled")) {
            node.remove();
          } else {
            // Allow toggling GFM task-list checkboxes directly in the editable preview
            node.removeAttribute("disabled");
            node.setAttribute("contenteditable", "false");
          }
        }
      });

      const turndown = new TurndownService({
        headingStyle: "atx",
        hr: "---",
        bulletListMarker: "-",
        codeBlockStyle: "fenced",
        emDelimiter: "*",
        strongDelimiter: "**",
        br: "",
      });
      turndown.use(turndownPluginGfm.gfm);
      turndown.addRule("strikethrough", {
        filter: ["del", "s", "strike"],
        replacement: (content) => `~~${content}~~`,
      });
      turndown.addRule("tableUiIgnore", {
        filter: (node) =>
          node.nodeType === Node.ELEMENT_NODE &&
          (node.classList.contains("col-type-btn") ||
            node.classList.contains("table-add-col") ||
            node.classList.contains("table-add-row")),
        replacement: () => "",
      });
      turndown.addRule("tableUiUnwrap", {
        filter: (node) =>
          node.nodeType === Node.ELEMENT_NODE &&
          (node.classList.contains("table-wrap") || node.classList.contains("table-row-top")),
        replacement: (content) => content,
      });
      turndown.addRule("tableCell", {
        filter: ["th", "td"],
        replacement: (content, node) => {
          const index = Array.prototype.indexOf.call(node.parentNode.childNodes, node);
          const prefix = index === 0 ? "| " : " ";
          const cb = node.querySelector('input[type="checkbox"]');
          if (cb) {
            return prefix + (cb.checked ? "[x]" : "[ ]") + " |";
          }
          const dateInput = node.querySelector('input[type="date"]');
          if (dateInput) {
            return prefix + (dateInput.value || "") + " |";
          }
          const clean = content.trim().replace(/\n+/g, " ");
          return prefix + clean + " |";
        },
      });

      function extractCodeText(node) {
        let out = "";
        const children = node.childNodes;
        for (let i = 0; i < children.length; i++) {
          const child = children[i];
          if (child.nodeType === Node.TEXT_NODE) {
            out += child.nodeValue;
          } else if (child.nodeName === "BR") {
            out += "\n";
          } else if (child.nodeType === Node.ELEMENT_NODE) {
            const isBlock = child.nodeName === "DIV" || child.nodeName === "P";
            if (isBlock && out.length > 0 && !out.endsWith("\n")) {
              out += "\n";
            }
            out += extractCodeText(child);
            if (isBlock && i < children.length - 1 && !out.endsWith("\n")) {
              out += "\n";
            }
          }
        }
        return out;
      }

      turndown.addRule("fencedCodeBlock", {
        filter: (node, options) =>
          options.codeBlockStyle === "fenced" && node.nodeName === "PRE",
        replacement: (_content, node, options) => {
          const codeEl = node.querySelector("code");
          const className = codeEl ? codeEl.getAttribute("class") || "" : "";
          const language = (className.match(/language-(\S+)/) || [null, ""])[1];
          const rawCode = extractCodeText(node).replace(/\r\n?/g, "\n");
          const code = rawCode.replace(/\n$/, "");
          const fenceChar = options.fence.charAt(0);
          let fenceSize = 3;
          const fenceRe = new RegExp("^" + fenceChar + "{3,}", "gm");
          let match;
          while ((match = fenceRe.exec(code))) {
            if (match[0].length >= fenceSize) {
              fenceSize = match[0].length + 1;
            }
          }
          const fence = fenceChar.repeat(fenceSize);
          return "\n\n" + fence + language + "\n" + code + "\n" + fence + "\n\n";
        },
      });

      turndown.addRule("listItem", {
        filter: "li",
        replacement: (content, node, options) => {
          content = content
            .replace(/^\n+/, "")
            .replace(/\n+$/, "\n")
            .replace(/^(\[[ x]\])\s+/, "$1 ")
            .replace(/\n/gm, "\n  ");
          let prefix = options.bulletListMarker + " ";
          const parent = node.parentNode;
          if (parent.nodeName === "OL") {
            const start = parent.getAttribute("start");
            const index = Array.prototype.indexOf.call(parent.children, node);
            prefix = (start ? Number(start) + index : index + 1) + ". ";
          }
          return prefix + content + (node.nextSibling && !/\n$/.test(content) ? "\n" : "");
        },
      });

      function previewToMarkdown(root) {
        let md = turndown.turndown(root);
        let trailingBlocks = 0;
        let node = root.lastChild;
        while (node) {
          if (node.nodeType === Node.TEXT_NODE && !node.nodeValue.trim()) {
            node = node.previousSibling;
            continue;
          }
          if (node.nodeName === "BR") {
            trailingBlocks += 1;
            node = node.previousSibling;
            continue;
          }
          if (
            (node.nodeName === "P" || node.nodeName === "DIV") &&
            node.textContent.trim() === "" &&
            !node.querySelector("img, hr, input, table, pre")
          ) {
            trailingBlocks += 1;
            node = node.previousSibling;
            continue;
          }
          break;
        }
        if (trailingBlocks > 0 && md.length > 0) {
          md += "\n".repeat(trailingBlocks + 1);
        } else if (
          node &&
          (node.nodeName === "P" || node.nodeName === "DIV") &&
          node.lastChild &&
          node.lastChild.nodeName === "BR"
        ) {
          md += "\n";
        }
        return md;
      }

      function renderPreview(text) {
        if (previewSyncTimer !== null) {
          clearTimeout(previewSyncTimer);
          previewSyncTimer = null;
        }
        if (typeof closePreviewSlashMenu === "function") {
          closePreviewSlashMenu();
        }
        if (typeof closeColTypeMenu === "function") {
          closeColTypeMenu();
        }
        activeTypedCell = null;
        const prevScroll = previewEl.scrollTop;
        previewEl.innerHTML = DOMPurify.sanitize(marked.parse(text), {
          ADD_TAGS: ["input"],
          ADD_ATTR: ["type", "checked", "disabled", "align"],
        });
        if (typeof enhanceTables === "function") {
          enhanceTables(previewEl);
        }
        previewEl.scrollTop = prevScroll;
      }

      // Formatting shortcut helpers
      function wrap(cm, mark) {
        const sel = cm.getSelection();
        if (sel.length >= mark.length * 2 && sel.startsWith(mark) && sel.endsWith(mark)) {
          cm.replaceSelection(sel.slice(mark.length, -mark.length), "around");
        } else if (sel) {
          cm.replaceSelection(mark + sel + mark, "around");
        } else {
          const c = cm.getCursor();
          cm.replaceSelection(mark + mark);
          cm.setCursor({ line: c.line, ch: c.ch + mark.length });
        }
      }

      function insertLink(cm) {
        const sel = cm.getSelection() || "text";
        const from = cm.getCursor("from");
        cm.replaceSelection("[" + sel + "](url)");
        const start = { line: from.line, ch: from.ch + sel.length + 3 };
        cm.setSelection(start, { line: start.line, ch: start.ch + 3 });
      }

      // Slash menu (shared by CodeMirror editor and live preview)
      const SLASH_ITEMS = [
        { id: "h1", name: "Heading 1", keywords: "h1 header title", insert: "# {c}" },
        { id: "h2", name: "Heading 2", keywords: "h2 header subtitle", insert: "## {c}" },
        { id: "h3", name: "Heading 3", keywords: "h3 header", insert: "### {c}" },
        { id: "ul", name: "Bullet list", keywords: "list ul unordered", insert: "- {c}" },
        { id: "ol", name: "Numbered list", keywords: "list ol ordered", insert: "1. {c}" },
        { id: "task", name: "Task list", keywords: "todo checklist checkbox", insert: "- [ ] {c}" },
        { id: "quote", name: "Quote", keywords: "blockquote callout", insert: "> {c}" },
        { id: "code", name: "Code block", keywords: "block pre fence snippet", insert: "```\n{c}\n```" },
        { id: "table", name: "Table", keywords: "grid columns rows", insert: "| {c}Column | Column | Column |\n| --- | --- | --- |\n|  |  |  |" },
        { id: "divider", name: "Divider", keywords: "hr line rule separator", insert: "---\n{c}" },
        { id: "link", name: "Link", keywords: "url href anchor", insert: "[{c}text](url)", select: "text" },
        { id: "image", name: "Image", keywords: "img picture photo", insert: "![{c}alt](url)", select: "alt" },
      ];

      function filterSlashItems(query) {
        const q = query.toLowerCase();
        if (!q) return SLASH_ITEMS;
        return SLASH_ITEMS.filter(
          (item) => item.name.toLowerCase().includes(q) || item.keywords.includes(q)
        );
      }

      function slashHint(cm) {
        const cur = cm.getCursor();
        const before = cm.getLine(cur.line).slice(0, cur.ch);
        const match = before.match(/(^|\s)\/(\w*)$/);
        if (!match) return null;
        const query = match[2];
        const from = { line: cur.line, ch: cur.ch - query.length - 1 };
        return {
          from,
          to: cur,
          list: filterSlashItems(query).map((item) => ({
            text: item.insert,
            displayText: item.name,
            hint: (editor, data) => {
              const at = item.insert.indexOf("{c}");
              const text = item.insert.replace("{c}", "");
              const baseIndex = editor.indexFromPos(data.from);
              editor.replaceRange(text, data.from, data.to);
              const startPos = editor.posFromIndex(baseIndex + at);
              if (item.select) {
                const endPos = editor.posFromIndex(baseIndex + at + item.select.length);
                editor.setSelection(startPos, endPos);
              } else {
                editor.setCursor(startPos);
              }
            },
          })),
        };
      }

      // CodeMirror 5 editor
      const cm = CodeMirror(editorPaneEl, {
        mode: "markdown",
        lineNumbers: true,
        lineWrapping: true,
        indentUnit: 2,
        tabSize: 2,
        autoCloseBrackets: { pairs: "()[]{}``", closeBefore: ")]}:;>", triples: "" },
        extraKeys: {
          Enter: "newlineAndIndentContinueMarkdownList",
          Tab: (editor) => {
            const line = editor.getLine(editor.getCursor().line);
            if (editor.somethingSelected() || /^\s*([*+-]|\d+[.)])\s/.test(line)) {
              editor.indentSelection("add");
            } else {
              editor.replaceSelection("  ", "end");
            }
          },
          "Shift-Tab": (editor) => editor.indentSelection("subtract"),
          "Ctrl-B": (editor) => wrap(editor, "**"),
          "Cmd-B": (editor) => wrap(editor, "**"),
          "Ctrl-I": (editor) => wrap(editor, "*"),
          "Cmd-I": (editor) => wrap(editor, "*"),
          "Ctrl-K": insertLink,
          "Cmd-K": insertLink,
        },
      });

      // Open slash menu on '/' at start of line or after whitespace
      cm.on("inputRead", (editor, change) => {
        if (change.origin === "+input" && change.text[0] === "/") {
          const cur = editor.getCursor();
          const before = editor.getLine(cur.line).slice(0, cur.ch);
          if (/(^|\s)\/$/.test(before)) {
            editor.showHint({ hint: slashHint, completeSingle: false });
          }
        }
      });

      // Paste URL over selected text -> [selected text](url)
      cm.on("paste", (editor, event) => {
        if (!editor.somethingSelected()) return;
        const pasted = (event.clipboardData || window.clipboardData)?.getData("text")?.trim();
        if (pasted && /^https?:\/\/\S+$/.test(pasted)) {
          event.preventDefault();
          const sel = editor.getSelection();
          editor.replaceSelection(`[${sel}](${pasted})`, "end");
        }
      });

      // One-way scroll sync: editor -> preview (skipped while user is editing preview)
      cm.on("scroll", () => {
        if (previewEl.hidden || previewEl.contains(document.activeElement)) return;
        const info = cm.getScrollInfo();
        const maxEditorScroll = info.height - info.clientHeight;
        if (maxEditorScroll <= 0) return;
        const ratio = info.top / maxEditorScroll;
        const maxPreviewScroll = previewEl.scrollHeight - previewEl.clientHeight;
        if (maxPreviewScroll > 0) {
          previewEl.scrollTop = ratio * maxPreviewScroll;
        }
      });

      function syncPreviewToEditor() {
        if (previewSyncTimer !== null) {
          clearTimeout(previewSyncTimer);
          previewSyncTimer = null;
        }
        if (activeId === null || previewEl.contentEditable === "false") return;
        const md = previewToMarkdown(previewEl);
        if (md === cm.getValue()) return;
        const scrollInfo = cm.getScrollInfo();
        const lastLine = cm.lastLine();
        cm.replaceRange(
          md,
          { line: 0, ch: 0 },
          { line: lastLine, ch: cm.getLine(lastLine).length },
          "preview"
        );
        cm.scrollTo(scrollInfo.left, scrollInfo.top);
      }

      function flushPreviewSync() {
        if (previewSyncTimer !== null) {
          syncPreviewToEditor();
        }
      }

      function schedulePreviewToEditor() {
        if (activeId === null) return;
        if (previewSyncTimer !== null) {
          clearTimeout(previewSyncTimer);
        }
        const delay = previewEl.innerHTML.length > LARGE_NOTE_BYTES ? LARGE_PREVIEW_DELAY_MS : PREVIEW_DELAY_MS;
        previewSyncTimer = setTimeout(syncPreviewToEditor, delay);
      }

      function applyLayout() {
        flushPreviewSync();
        const wasPreviewHidden = previewEl.hidden;

        sidebarEl.hidden = !sidebarVisible;
        sidebarToggleBtn.textContent = sidebarVisible ? "Hide sidebar" : "Show sidebar";

        const isWide = wideQuery.matches;
        if (isWide) {
          editorToggleBtn.hidden = false;
          editorPaneEl.hidden = !wideEditorVisible;
          previewEl.hidden = !widePreviewVisible;
          editorToggleBtn.textContent = wideEditorVisible ? "Hide editor" : "Show editor";
          previewToggleBtn.textContent = widePreviewVisible ? "Hide preview" : "Show preview";
        } else {
          editorToggleBtn.hidden = true;
          editorPaneEl.hidden = narrowPreviewActive;
          previewEl.hidden = !narrowPreviewActive;
          previewToggleBtn.textContent = narrowPreviewActive ? "Edit" : "Preview";
        }

        if (wasPreviewHidden && !previewEl.hidden) {
          renderPreview(cm.getValue());
        }
        if (!editorPaneEl.hidden) cm.refresh();
      }

      function schedulePreview() {
        if (previewEl.hidden) return;
        if (previewTimer !== null) {
          clearTimeout(previewTimer);
        }
        const text = cm.getValue();
        const delay = text.length > LARGE_NOTE_BYTES ? LARGE_PREVIEW_DELAY_MS : PREVIEW_DELAY_MS;
        previewTimer = setTimeout(() => {
          previewTimer = null;
          if (!previewEl.hidden) {
            renderPreview(cm.getValue());
          }
        }, delay);
      }

      cm.on("change", (_editor, change) => {
        if (change.origin === "setValue" || change.origin === "remote") {
          if (previewTimer !== null) {
            clearTimeout(previewTimer);
            previewTimer = null;
          }
          if (change.origin === "remote") {
            closePreviewSlashMenu();
            closeColTypeMenu();
          }
          if (!previewEl.hidden) {
            renderPreview(cm.getValue());
          }
          return;
        }
        if (activeId === null) return;
        dirty = true;
        setStatus("Unsaved...");
        if (change.origin !== "preview") {
          schedulePreview();
        }
        scheduleAutosave();
      });

      function formatDate(iso) {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return iso || "";
        const datePart = d.toLocaleDateString("en-US", {
          month: "short",
          day: "numeric",
          year: "numeric",
        });
        const timePart = d.toLocaleTimeString("en-US", {
          hour: "numeric",
          minute: "2-digit",
          hour12: true,
        });
        return `${datePart} ${timePart}`;
      }

      function setStatus(text, isError = false) {
        saveStatusEl.textContent = text;
        saveStatusEl.classList.toggle("error", isError);
      }

      function sortNotesNewestFirst() {
        notes.sort((a, b) => {
          if (a.updated_at !== b.updated_at) {
            return a.updated_at < b.updated_at ? 1 : -1;
          }
          return b.id - a.id;
        });
      }

      function renderSidebar() {
        if (renamingNoteId !== null && noteListEl.querySelector(".note-rename-input")) {
          return;
        }
        const query = searchEl.value.trim().toLowerCase();
        const filtered = query
          ? notes.filter((n) => n.filename.toLowerCase().includes(query))
          : notes;

        noteListEl.innerHTML = "";

        if (filtered.length === 0) {
          const empty = document.createElement("li");
          empty.className = "note-empty";
          empty.textContent = query ? "No matching notes" : "No notes";
          noteListEl.appendChild(empty);
          return;
        }

        const fragment = document.createDocumentFragment();
        for (const note of filtered) {
          const li = document.createElement("li");
          li.className = "note-item" + (note.id === activeId ? " active" : "");
          li.dataset.id = String(note.id);
          li.setAttribute("role", "option");
          li.setAttribute("aria-selected", note.id === activeId ? "true" : "false");

          const nameRow = document.createElement("div");
          nameRow.className = "note-name-row";

          const nameEl = document.createElement("div");
          nameEl.className = "note-name";
          nameEl.textContent = note.filename;
          nameEl.title = note.filename;

          const renameBtn = document.createElement("button");
          renameBtn.className = "note-rename-btn";
          renameBtn.type = "button";
          renameBtn.title = "Rename note";
          renameBtn.setAttribute("aria-label", `Rename ${note.filename}`);
          renameBtn.textContent = "\u270E";

          nameRow.appendChild(nameEl);
          nameRow.appendChild(renameBtn);

          const dateEl = document.createElement("div");
          dateEl.className = "note-date";
          dateEl.textContent = formatDate(note.updated_at);

          li.appendChild(nameRow);
          li.appendChild(dateEl);
          fragment.appendChild(li);
        }
        noteListEl.appendChild(fragment);
      }

      function applyNoteRename(note) {
        if (!note || !Number.isInteger(note.id)) return;
        const existing = notes.find((n) => n.id === note.id);
        if (existing) {
          existing.filename = note.filename;
          if (note.updated_at) existing.updated_at = note.updated_at;
        } else {
          notes.push({
            id: note.id,
            filename: note.filename,
            updated_at: note.updated_at,
          });
          sortNotesNewestFirst();
        }
        renderSidebar();
        if (openTabIds.includes(note.id)) {
          renderTabs();
        }
        if (note.id === activeId) {
          document.title = `${note.filename} — Notes`;
        }
      }

      function startInlineRename(noteId) {
        const note = notes.find((n) => n.id === noteId);
        if (!note) return;
        if (renamingNoteId === noteId) return;
        if (renamingNoteId !== null) {
          renamingNoteId = null;
          renderSidebar();
        }

        const item = noteListEl.querySelector(`.note-item[data-id="${noteId}"]`);
        if (!item) return;
        const nameRow = item.querySelector(".note-name-row");
        if (!nameRow) return;

        renamingNoteId = noteId;
        const originalName = note.filename;

        const input = document.createElement("input");
        input.type = "text";
        input.className = "note-rename-input";
        input.value = originalName;
        input.maxLength = 255;
        input.setAttribute("aria-label", "Note name");

        nameRow.innerHTML = "";
        nameRow.appendChild(input);

        let settled = false;

        async function finish(commit) {
          if (settled) return;
          settled = true;
          const nextName = input.value.trim();
          renamingNoteId = null;

          if (!commit || !nextName || nextName === originalName) {
            renderSidebar();
            return;
          }

          try {
            const res = await wsRequest("rename_note", { id: noteId, filename: nextName });
            applyNoteRename(res.note);
            if (!dirty) setStatus("Renamed");
          } catch (err) {
            renderSidebar();
            setStatus(err.message || "Rename failed", true);
          }
        }

        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            e.stopPropagation();
            finish(true);
          } else if (e.key === "Escape") {
            e.preventDefault();
            e.stopPropagation();
            finish(false);
          }
        });

        input.addEventListener("blur", () => {
          finish(true);
        });

        input.addEventListener("click", (e) => {
          e.stopPropagation();
        });

        input.focus();
        input.select();
      }

      function applyRemoteContentToDoc(doc, newContent, isActive) {
        const oldContent = doc.getValue();
        if (oldContent === newContent) return false;
        let start = 0;
        const minLen = Math.min(oldContent.length, newContent.length);
        while (start < minLen && oldContent.charCodeAt(start) === newContent.charCodeAt(start)) {
          start++;
        }
        let oldEnd = oldContent.length;
        let newEnd = newContent.length;
        while (
          oldEnd > start &&
          newEnd > start &&
          oldContent.charCodeAt(oldEnd - 1) === newContent.charCodeAt(newEnd - 1)
        ) {
          oldEnd--;
          newEnd--;
        }
        const from = doc.posFromIndex(start);
        const to = doc.posFromIndex(oldEnd);
        const inserted = newContent.slice(start, newEnd);
        const scrollInfo = isActive ? cm.getScrollInfo() : null;
        doc.replaceRange(inserted, from, to, "remote");
        if (isActive && scrollInfo) {
          cm.scrollTo(scrollInfo.left, scrollInfo.top);
        }
        return true;
      }

      function rejectPendingRequests(reason) {
        for (const [reqId, pending] of wsPending.entries()) {
          clearTimeout(pending.timer);
          pending.reject(new Error(reason));
          wsPending.delete(reqId);
        }
      }

      function wsRequest(type, payload = {}) {
        return new Promise((resolve, reject) => {
          if (!ws || ws.readyState !== WebSocket.OPEN) {
            reject(new Error("Disconnected"));
            return;
          }
          const reqId = String(++wsReqSeq);
          const timer = setTimeout(() => {
            if (wsPending.delete(reqId)) {
              reject(new Error("Request timed out"));
            }
          }, WS_REQUEST_TIMEOUT_MS);

          wsPending.set(reqId, { resolve, reject, timer });
          try {
            ws.send(JSON.stringify({ type, req_id: reqId, ...payload }));
          } catch (err) {
            clearTimeout(timer);
            wsPending.delete(reqId);
            reject(err);
          }
        });
      }

      function handleRemoteNoteCreated(note) {
        if (!note || !Number.isInteger(note.id)) return;
        if (notes.some((n) => n.id === note.id)) return;
        notes.push({
          id: note.id,
          filename: note.filename,
          updated_at: note.updated_at,
        });
        sortNotesNewestFirst();
        renderSidebar();
      }

      function handleRemoteNoteUpdated(note) {
        if (!note || !Number.isInteger(note.id)) return;
        const existing = notes.find((n) => n.id === note.id);
        let filenameChanged = false;
        if (existing) {
          if (note.updated_at && existing.updated_at && note.updated_at < existing.updated_at) {
            return;
          }
          filenameChanged = existing.filename !== note.filename;
          existing.filename = note.filename;
          existing.updated_at = note.updated_at;
        } else {
          notes.push({
            id: note.id,
            filename: note.filename,
            updated_at: note.updated_at,
          });
        }
        sortNotesNewestFirst();
        renderSidebar();
        if (filenameChanged && openTabIds.includes(note.id)) {
          renderTabs();
          if (note.id === activeId) {
            document.title = `${note.filename} — Notes`;
          }
        }

        const cached = tabDocs.get(note.id);
        const remoteContent = typeof note.content === "string" ? note.content : "";

        if (note.id !== activeId) {
          if (cached) {
            if (!cached.updatedAt || !note.updated_at || note.updated_at >= cached.updatedAt) {
              cached.updatedAt = note.updated_at;
              applyRemoteContentToDoc(cached.doc, remoteContent, false);
            }
          }
          return;
        }

        if (cached && cached.updatedAt && note.updated_at && note.updated_at < cached.updatedAt) {
          return;
        }

        if (!dirty && previewSyncTimer === null && !saveInFlight) {
          if (cached) {
            cached.updatedAt = note.updated_at;
          }
          const changed = applyRemoteContentToDoc(cm.getDoc(), remoteContent, true);
          if (changed) {
            setStatus("Updated");
          }
        }
      }

      async function resyncAfterReconnect() {
        try {
          const listRes = await wsRequest("list_notes");
          notes = Array.isArray(listRes.notes) ? listRes.notes : [];
          sortNotesNewestFirst();

          const byId = new Map(notes.map((n) => [n.id, n]));
          for (const [id, entry] of Array.from(tabDocs.entries())) {
            if (id === activeId) continue;
            const latest = byId.get(id);
            if (!latest || (entry.updatedAt && latest.updated_at !== entry.updatedAt)) {
              tabDocs.delete(id);
            }
          }

          renderSidebar();
          renderTabs();
          if (activeId !== null) {
            const activeMeta = byId.get(activeId);
            if (activeMeta) {
              document.title = `${activeMeta.filename} — Notes`;
            }
          }

          if (activeId !== null) {
            if (dirty) {
              await saveCurrentNote();
            } else {
              const noteId = activeId;
              const noteRes = await wsRequest("get_note", { id: noteId });
              const data = noteRes.note;
              if (activeId === noteId && data && !dirty && previewSyncTimer === null) {
                const cached = tabDocs.get(noteId);
                if (cached) {
                  cached.updatedAt = data.updated_at;
                }
                applyRemoteContentToDoc(cm.getDoc(), data.content || "", true);
                setStatus("Connected");
              }
            }
          } else {
            setStatus("Connected");
          }
        } catch (err) {
          setStatus(err.message || "Sync failed", true);
        }
      }

      function scheduleReconnect() {
        if (wsReconnectTimer !== null) return;
        const delay = wsReconnectDelay;
        wsReconnectDelay = Math.min(wsReconnectDelay * 2, WS_RECONNECT_MAX_MS);
        wsReconnectTimer = setTimeout(() => {
          wsReconnectTimer = null;
          connectWebSocket();
        }, delay);
      }

      function connectWebSocket() {
        if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
          return;
        }
        const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
        const socket = new WebSocket(`${proto}//${window.location.host}/ws`);
        ws = socket;

        socket.addEventListener("open", () => {
          if (ws !== socket) return;
          wsReconnectDelay = WS_RECONNECT_BASE_MS;
          if (!wsInitialized) {
            loadInitialNotes();
          } else {
            setStatus("Reconnected");
            resyncAfterReconnect();
          }
        });

        socket.addEventListener("message", (event) => {
          if (ws !== socket) return;
          let msg;
          try {
            msg = JSON.parse(event.data);
          } catch {
            return;
          }
          if (!msg || typeof msg !== "object") return;

          if (msg.req_id !== undefined && msg.req_id !== null) {
            const key = String(msg.req_id);
            const pending = wsPending.get(key);
            if (pending) {
              clearTimeout(pending.timer);
              wsPending.delete(key);
              if (msg.type === "error") {
                pending.reject(new Error(msg.error || "Request failed"));
              } else {
                pending.resolve(msg);
              }
              return;
            }
          }

          if (msg.type === "note_created" && msg.note) {
            handleRemoteNoteCreated(msg.note);
          } else if (msg.type === "note_updated" && msg.note) {
            handleRemoteNoteUpdated(msg.note);
          } else if (msg.type === "note_renamed" && msg.note) {
            applyNoteRename(msg.note);
          }
        });

        socket.addEventListener("close", () => {
          if (ws !== socket) return;
          ws = null;
          rejectPendingRequests("Disconnected");
          setStatus("Reconnecting...", true);
          scheduleReconnect();
        });

        socket.addEventListener("error", () => {
          // Close event follows and triggers reconnect.
        });
      }

      async function saveCurrentNote() {
        flushPreviewSync();
        if (saveTimer !== null) {
          clearTimeout(saveTimer);
          saveTimer = null;
        }
        saveFirstDirtyAt = null;
        if (saveInFlight) {
          await saveInFlight;
        }
        if (activeId === null || !dirty) return true;

        const noteId = activeId;
        const content = cm.getValue();
        dirty = false;
        setStatus("Saving...");

        const run = (async () => {
          try {
            const res = await wsRequest("update_note", { id: noteId, content });
            const updated = res.note;
            const existing = notes.find((n) => n.id === noteId);
            if (existing && updated) {
              existing.updated_at = updated.updated_at;
              sortNotesNewestFirst();
              renderSidebar();
            }
            const cached = tabDocs.get(noteId);
            if (cached && updated) {
              cached.updatedAt = updated.updated_at;
            }
            if (!dirty && activeId === noteId) {
              setStatus("Saved");
            }
            return true;
          } catch (err) {
            if (activeId === noteId) {
              dirty = true;
              setStatus(err.message || "Save failed", true);
            }
            return false;
          }
        })();

        saveInFlight = run;
        try {
          return await run;
        } finally {
          if (saveInFlight === run) saveInFlight = null;
        }
      }

      function scheduleAutosave() {
        const now = Date.now();
        if (saveFirstDirtyAt === null) {
          saveFirstDirtyAt = now;
        }
        if (saveTimer !== null) {
          clearTimeout(saveTimer);
        }
        const elapsed = now - saveFirstDirtyAt;
        const remaining = Math.max(0, AUTOSAVE_MAX_WAIT_MS - elapsed);
        const delay = Math.min(AUTOSAVE_DELAY_MS, remaining);
        saveTimer = setTimeout(() => {
          saveTimer = null;
          saveFirstDirtyAt = null;
          saveCurrentNote();
        }, delay);
      }

      function saveTabsState() {
        try {
          localStorage.setItem(
            TABS_STORAGE_KEY,
            JSON.stringify({ openTabIds, activeId })
          );
        } catch {}
      }

      function restoreTabsState() {
        try {
          const raw = localStorage.getItem(TABS_STORAGE_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          if (!parsed || !Array.isArray(parsed.openTabIds)) return null;
          const validIds = new Set(notes.map((n) => n.id));
          const ids = parsed.openTabIds.filter((id) => validIds.has(id));
          const active = validIds.has(parsed.activeId) ? parsed.activeId : ids[0] ?? null;
          return { ids, active };
        } catch {
          return null;
        }
      }

      function saveActiveTabScroll() {
        if (activeId === null) return;
        const entry = tabDocs.get(activeId);
        if (!entry) return;
        const info = cm.getScrollInfo();
        entry.editorScroll = { left: info.left, top: info.top };
        entry.previewScroll = previewEl.scrollTop;
      }

      function renderTabs() {
        tabStripEl.innerHTML = "";
        const fragment = document.createDocumentFragment();
        let activeTabEl = null;

        for (const id of openTabIds) {
          const meta = notes.find((n) => n.id === id);
          if (!meta) continue;

          const isActive = id === activeId;
          const tab = document.createElement("div");
          tab.className = "tab" + (isActive ? " active" : "");
          tab.dataset.id = String(id);
          tab.setAttribute("role", "tab");
          tab.setAttribute("aria-selected", isActive ? "true" : "false");

          const label = document.createElement("span");
          label.className = "tab-label";
          label.textContent = meta.filename;
          label.title = meta.filename;

          const closeBtn = document.createElement("button");
          closeBtn.className = "tab-close";
          closeBtn.type = "button";
          closeBtn.title = "Close tab";
          closeBtn.setAttribute("aria-label", `Close ${meta.filename}`);
          closeBtn.innerHTML = "&times;";

          tab.appendChild(label);
          tab.appendChild(closeBtn);
          fragment.appendChild(tab);
          if (isActive) activeTabEl = tab;
        }

        tabStripEl.appendChild(fragment);
        if (activeTabEl) {
          activeTabEl.scrollIntoView({ block: "nearest", inline: "nearest" });
        }
      }

      async function selectNote(noteId) {
        if (noteId === activeId && openTabIds.includes(noteId)) {
          renderTabs();
          if (!editorPaneEl.hidden) cm.focus();
          return;
        }

        saveActiveTabScroll();
        flushPreviewSync();
        if (!wideQuery.matches && narrowPreviewActive) {
          narrowPreviewActive = false;
          applyLayout();
        }
        await saveCurrentNote();

        if (!openTabIds.includes(noteId)) {
          openTabIds.push(noteId);
        }

        const seq = ++loadSeq;
        activeId = noteId;
        dirty = false;

        workspaceEl.hidden = false;
        emptyStateEl.hidden = true;

        const meta = notes.find((n) => n.id === noteId);
        document.title = meta ? `${meta.filename} — Notes` : "Notes";
        renderSidebar();
        renderTabs();
        saveTabsState();
        setStatus("");

        // Instant switch if tab is already open in memory
        const cached = tabDocs.get(noteId);
        if (cached) {
          cm.swapDoc(cached.doc);
          cm.setOption("readOnly", false);
          previewEl.contentEditable = "true";
          if (!previewEl.hidden) {
            renderPreview(cm.getValue());
            previewEl.scrollTop = cached.previewScroll;
          }
          cm.scrollTo(cached.editorScroll.left, cached.editorScroll.top);
          if (!editorPaneEl.hidden) {
            cm.refresh();
            cm.focus();
          }
          return;
        }

        cm.setOption("readOnly", "nocursor");
        previewEl.contentEditable = "false";
        try {
          const res = await wsRequest("get_note", { id: noteId });
          const data = res.note;
          if (seq !== loadSeq) return;

          document.title = `${data.filename} — Notes`;
          const doc = new CodeMirror.Doc(data.content || "", "markdown");
          tabDocs.set(noteId, {
            doc,
            updatedAt: data.updated_at,
            editorScroll: { left: 0, top: 0 },
            previewScroll: 0,
          });
          cm.swapDoc(doc);
          cm.scrollTo(0, 0);
          if (!previewEl.hidden) {
            renderPreview(data.content || "");
            previewEl.scrollTop = 0;
          }
          cm.setOption("readOnly", false);
          previewEl.contentEditable = "true";
          if (!editorPaneEl.hidden) {
            cm.refresh();
            cm.focus();
          }
        } catch (err) {
          if (seq !== loadSeq) return;
          cm.setOption("readOnly", false);
          previewEl.contentEditable = "true";
          setStatus(err.message || "Failed to load note", true);
        }
      }

      async function closeTab(noteId) {
        const idx = openTabIds.indexOf(noteId);
        if (idx === -1) return;

        if (noteId === activeId) {
          flushPreviewSync();
          await saveCurrentNote();
        }

        openTabIds.splice(idx, 1);
        tabDocs.delete(noteId);

        if (noteId !== activeId) {
          renderTabs();
          saveTabsState();
          return;
        }

        if (openTabIds.length > 0) {
          const nextId = openTabIds[Math.min(idx, openTabIds.length - 1)];
          activeId = null;
          dirty = false;
          await selectNote(nextId);
          return;
        }

        // No open tabs left
        loadSeq++;
        activeId = null;
        dirty = false;
        cm.swapDoc(new CodeMirror.Doc("", "markdown"));
        cm.setOption("readOnly", "nocursor");
        previewEl.contentEditable = "false";
        previewEl.innerHTML = "";
        workspaceEl.hidden = true;
        emptyStateEl.hidden = false;
        document.title = "Notes";
        setStatus("");
        renderTabs();
        renderSidebar();
        saveTabsState();
      }

      async function createNote(filename) {
        const res = await wsRequest("create_note", { filename });
        return res.note;
      }

      async function handleNewNote() {
        const raw = prompt("Note name:");
        if (raw === null) return;
        const name = raw.trim();
        if (!name) return;

        saveActiveTabScroll();
        await saveCurrentNote();

        try {
          const created = await createNote(name);
          if (!notes.some((n) => n.id === created.id)) {
            notes.unshift(created);
          }
          sortNotesNewestFirst();

          const query = searchEl.value.trim().toLowerCase();
          if (query && !created.filename.toLowerCase().includes(query)) {
            searchEl.value = "";
          }

          loadSeq++;
          if (!wideQuery.matches && narrowPreviewActive) {
            narrowPreviewActive = false;
            applyLayout();
          }

          if (!openTabIds.includes(created.id)) {
            openTabIds.push(created.id);
          }
          const doc = new CodeMirror.Doc("", "markdown");
          tabDocs.set(created.id, {
            doc,
            updatedAt: created.updated_at,
            editorScroll: { left: 0, top: 0 },
            previewScroll: 0,
          });

          activeId = created.id;
          dirty = false;
          workspaceEl.hidden = false;
          emptyStateEl.hidden = true;
          document.title = `${created.filename} — Notes`;
          cm.swapDoc(doc);
          cm.setOption("readOnly", false);
          previewEl.contentEditable = "true";
          cm.scrollTo(0, 0);
          if (!previewEl.hidden) {
            renderPreview("");
            previewEl.scrollTop = 0;
          }
          renderSidebar();
          renderTabs();
          saveTabsState();
          setStatus("");
          if (!editorPaneEl.hidden) {
            cm.refresh();
            cm.focus();
          }
        } catch (err) {
          setStatus(err.message || "Failed to create note", true);
        }
      }

      async function handleExport() {
        await saveCurrentNote();
        window.location.href = "/api/export";
      }

      function flushOnUnload() {
        flushPreviewSync();
        if (activeId === null || !dirty) return;
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        dirty = false;
        try {
          ws.send(
            JSON.stringify({
              type: "update_note",
              id: activeId,
              content: cm.getValue(),
            })
          );
        } catch {}
      }

      // Live preview slash command menu
      function closePreviewSlashMenu() {
        previewSlash = null;
        previewSlashMenuEl.hidden = true;
        previewSlashMenuEl.innerHTML = "";
      }

      function setCaret(node, offset) {
        const sel = window.getSelection();
        if (!sel) return;
        const range = document.createRange();
        range.setStart(node, offset);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
      }

      function selectNodeContents(node) {
        const sel = window.getSelection();
        if (!sel) return;
        const range = document.createRange();
        range.selectNodeContents(node);
        sel.removeAllRanges();
        sel.addRange(range);
      }

      function insertPreviewBlock(targetNode, nodesToInsert) {
        let top = targetNode;
        while (top && top.parentNode !== previewEl) {
          top = top.parentNode;
        }
        const frag = document.createDocumentFragment();
        for (const n of nodesToInsert) frag.appendChild(n);

        if (!top) {
          previewEl.appendChild(frag);
          return;
        }
        const isEmptyBlock =
          (top.nodeType === Node.TEXT_NODE && top.nodeValue.trim() === "") ||
          ((top.nodeName === "P" || top.nodeName === "DIV") &&
            top.textContent.trim() === "" &&
            !top.querySelector("img, hr, input, table, pre"));

        if (isEmptyBlock) {
          top.replaceWith(frag);
        } else {
          top.after(frag);
        }
      }

      function applyPreviewSlashItem(item) {
        if (!previewSlash) return;
        const { node, startOffset, endOffset } = previewSlash;
        closePreviewSlashMenu();

        if (!previewEl.contains(node)) return;

        // Remove the typed /query
        const delRange = document.createRange();
        delRange.setStart(node, startOffset);
        delRange.setEnd(node, endOffset);
        delRange.deleteContents();

        const makeEmptyP = () => {
          const p = document.createElement("p");
          p.appendChild(document.createElement("br"));
          return p;
        };

        if (item.id === "link") {
          const rawUrl = prompt("Link URL:", "https://");
          const url = rawUrl ? rawUrl.trim() : "";
          if (!url || !/^(https?:\/\/|\/)/i.test(url)) {
            syncPreviewToEditor();
            return;
          }
          const a = document.createElement("a");
          a.href = url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = "text";
          delRange.insertNode(a);
          previewEl.focus();
          selectNodeContents(a);
          syncPreviewToEditor();
          return;
        }

        if (item.id === "image") {
          const rawUrl = prompt("Image URL:", "https://");
          const url = rawUrl ? rawUrl.trim() : "";
          if (!url || !/^(https?:\/\/|\/)/i.test(url)) {
            syncPreviewToEditor();
            return;
          }
          const alt = (prompt("Image alt text:", "image") || "").trim();
          const pImg = document.createElement("p");
          const img = document.createElement("img");
          img.src = url;
          img.alt = alt;
          pImg.appendChild(img);
          const afterP = makeEmptyP();
          insertPreviewBlock(node, [pImg, afterP]);
          previewEl.focus();
          setCaret(afterP, 0);
          syncPreviewToEditor();
          return;
        }

        if (item.id === "h1" || item.id === "h2" || item.id === "h3") {
          const h = document.createElement(item.id);
          h.appendChild(document.createElement("br"));
          insertPreviewBlock(node, [h]);
          previewEl.focus();
          setCaret(h, 0);
        } else if (item.id === "ul" || item.id === "ol") {
          const list = document.createElement(item.id);
          const li = document.createElement("li");
          li.appendChild(document.createElement("br"));
          list.appendChild(li);
          insertPreviewBlock(node, [list]);
          previewEl.focus();
          setCaret(li, 0);
        } else if (item.id === "task") {
          const ul = document.createElement("ul");
          const li = document.createElement("li");
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.setAttribute("contenteditable", "false");
          const sp = document.createTextNode(" ");
          li.appendChild(cb);
          li.appendChild(sp);
          ul.appendChild(li);
          insertPreviewBlock(node, [ul]);
          previewEl.focus();
          setCaret(sp, 1);
        } else if (item.id === "quote") {
          const bq = document.createElement("blockquote");
          const p = makeEmptyP();
          bq.appendChild(p);
          insertPreviewBlock(node, [bq]);
          previewEl.focus();
          setCaret(p, 0);
        } else if (item.id === "code") {
          const pre = document.createElement("pre");
          const code = document.createElement("code");
          code.appendChild(document.createElement("br"));
          pre.appendChild(code);
          insertPreviewBlock(node, [pre, makeEmptyP()]);
          previewEl.focus();
          setCaret(code, 0);
        } else if (item.id === "table") {
          const table = document.createElement("table");
          const thead = document.createElement("thead");
          const headRow = document.createElement("tr");
          for (let i = 0; i < 3; i++) {
            const th = document.createElement("th");
            th.textContent = "Column";
            headRow.appendChild(th);
          }
          thead.appendChild(headRow);
          const tbody = document.createElement("tbody");
          const bodyRow = document.createElement("tr");
          for (let i = 0; i < 3; i++) {
            const td = document.createElement("td");
            td.appendChild(document.createElement("br"));
            bodyRow.appendChild(td);
          }
          tbody.appendChild(bodyRow);
          table.appendChild(thead);
          table.appendChild(tbody);
          insertPreviewBlock(node, [table, makeEmptyP()]);
          enhanceTable(table);
          const firstTitle = table.querySelector("thead th .col-title") || table.querySelector("thead th");
          previewEl.focus();
          if (firstTitle) selectNodeContents(firstTitle);
        } else if (item.id === "divider") {
          const hr = document.createElement("hr");
          const afterP = makeEmptyP();
          insertPreviewBlock(node, [hr, afterP]);
          previewEl.focus();
          setCaret(afterP, 0);
        }

        syncPreviewToEditor();
      }

      function renderPreviewSlashMenu() {
        if (!previewSlash) return;
        const { items, index, rect } = previewSlash;
        previewSlashMenuEl.innerHTML = "";
        const frag = document.createDocumentFragment();
        items.forEach((item, i) => {
          const li = document.createElement("li");
          li.className = "slash-menu-item" + (i === index ? " active" : "");
          li.dataset.index = String(i);
          li.setAttribute("role", "option");
          li.setAttribute("aria-selected", i === index ? "true" : "false");
          li.textContent = item.name;
          frag.appendChild(li);
        });
        previewSlashMenuEl.appendChild(frag);
        previewSlashMenuEl.hidden = false;

        const menuRect = previewSlashMenuEl.getBoundingClientRect();
        let left = rect.left;
        let top = rect.bottom + 4;
        if (left + menuRect.width > window.innerWidth - 8) {
          left = Math.max(8, window.innerWidth - menuRect.width - 8);
        }
        if (top + menuRect.height > window.innerHeight - 8) {
          top = Math.max(8, rect.top - menuRect.height - 4);
        }
        previewSlashMenuEl.style.left = `${left}px`;
        previewSlashMenuEl.style.top = `${top}px`;

        const activeEl = previewSlashMenuEl.querySelector(".slash-menu-item.active");
        if (activeEl) activeEl.scrollIntoView({ block: "nearest" });
      }

      function updatePreviewSlashMenu() {
        if (activeId === null || previewEl.hidden) {
          closePreviewSlashMenu();
          return;
        }
        const sel = window.getSelection();
        if (!sel || !sel.isCollapsed || !sel.anchorNode) {
          closePreviewSlashMenu();
          return;
        }
        const node = sel.anchorNode;
        if (node.nodeType !== Node.TEXT_NODE || !previewEl.contains(node)) {
          closePreviewSlashMenu();
          return;
        }
        const parentEl = node.parentElement;
        if (parentEl && parentEl.closest("pre, code")) {
          closePreviewSlashMenu();
          return;
        }
        const before = node.nodeValue.slice(0, sel.anchorOffset);
        const match = before.match(/(^|\s)\/(\w*)$/);
        if (!match) {
          closePreviewSlashMenu();
          return;
        }
        const query = match[2];
        const items = filterSlashItems(query);
        if (items.length === 0) {
          closePreviewSlashMenu();
          return;
        }

        const startOffset = sel.anchorOffset - query.length - 1;
        const range = document.createRange();
        range.setStart(node, startOffset);
        range.setEnd(node, sel.anchorOffset);
        const rect = range.getBoundingClientRect();
        if (rect.width === 0 && rect.height === 0) {
          closePreviewSlashMenu();
          return;
        }

        previewSlash = {
          node,
          startOffset,
          endOffset: sel.anchorOffset,
          items,
          index: 0,
          rect,
        };
        renderPreviewSlashMenu();
      }

      previewSlashMenuEl.addEventListener("mousedown", (e) => {
        const li = e.target.closest(".slash-menu-item");
        if (!li || !previewSlash) return;
        e.preventDefault();
        const idx = Number(li.dataset.index);
        const item = previewSlash.items[idx];
        if (item) applyPreviewSlashItem(item);
      });

      // Interactive tables: + row, + column, and column types
      const COL_TYPES = [
        { id: "text", badge: "Aa", label: "Text" },
        { id: "number", badge: "#", label: "Number" },
        { id: "currency", badge: "$", label: "Currency" },
        { id: "checkbox", badge: "☑", label: "Checkbox" },
        { id: "date", badge: "Date", label: "Date" },
      ];

      const currencyFormatter = new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD",
      });

      function colTypeMeta(typeId) {
        return COL_TYPES.find((t) => t.id === typeId) || COL_TYPES[0];
      }

      function parseNumeric(raw) {
        const cleaned = String(raw || "").replace(/[$,\s]/g, "");
        if (!cleaned || !/^-?\d+(\.\d+)?$/.test(cleaned)) return null;
        const num = Number(cleaned);
        return Number.isFinite(num) ? num : null;
      }

      function getCellRawText(td) {
        const cb = td.querySelector('input[type="checkbox"]');
        if (cb) return cb.checked ? "[x]" : "[ ]";
        const dateInput = td.querySelector('input[type="date"]');
        if (dateInput) return dateInput.value || "";
        return td.textContent.trim();
      }

      function applyCellType(td, type, rawValue) {
        const raw = rawValue !== undefined ? rawValue : getCellRawText(td);
        td.dataset.colType = type;

        if (type === "number" || type === "currency") {
          td.setAttribute("align", "right");
        } else {
          td.removeAttribute("align");
        }

        if (type === "checkbox") {
          const checked = /^(\[x\]|x|yes|true|1|✓)$/i.test(raw);
          td.innerHTML = "";
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = checked;
          cb.setAttribute("contenteditable", "false");
          td.appendChild(cb);
          return;
        }

        if (type === "date") {
          const val = /^\d{4}-\d{2}-\d{2}$/.test(raw) ? raw : "";
          td.innerHTML = "";
          const input = document.createElement("input");
          input.type = "date";
          input.className = "cell-date";
          input.value = val;
          input.setAttribute("contenteditable", "false");
          td.appendChild(input);
          return;
        }

        let display = raw;
        if (type === "currency") {
          const num = parseNumeric(raw);
          display = num !== null ? currencyFormatter.format(num) : raw === "[ ]" || raw === "[x]" ? "" : raw;
        } else if (type === "number") {
          const num = parseNumeric(raw);
          display = num !== null ? String(num) : raw === "[ ]" || raw === "[x]" ? "" : raw;
        } else {
          if (raw === "[x]") display = "Yes";
          else if (raw === "[ ]") display = "";
        }

        td.innerHTML = "";
        if (display) {
          td.textContent = display;
        } else {
          td.appendChild(document.createElement("br"));
        }
      }

      function inferColumnType(table, colIndex) {
        const th = table.querySelector(`thead tr th:nth-child(${colIndex + 1})`);
        if (th && th.dataset.colType) return th.dataset.colType;
        const rows = Array.from(table.querySelectorAll("tbody tr"));
        const values = [];
        for (const row of rows) {
          const td = row.cells[colIndex];
          if (!td) continue;
          const v = getCellRawText(td);
          if (v !== "") values.push(v);
        }
        if (values.length === 0) {
          return th && th.getAttribute("align") === "right" ? "number" : "text";
        }
        if (values.every((v) => /^\[[ xX]\]$/.test(v))) return "checkbox";
        if (values.every((v) => /^-?\$[\d,]+(\.\d+)?$/.test(v))) return "currency";
        if (values.every((v) => /^\d{4}-\d{2}-\d{2}$/.test(v))) return "date";
        if (
          values.every((v) => /^-?[\d,]+(\.\d+)?$/.test(v)) &&
          th &&
          th.getAttribute("align") === "right"
        ) {
          return "number";
        }
        return "text";
      }

      function ensureHeaderControl(th, type) {
        const meta = colTypeMeta(type);
        th.dataset.colType = meta.id;
        if (meta.id === "number" || meta.id === "currency") {
          th.setAttribute("align", "right");
        } else {
          th.removeAttribute("align");
        }

        let titleEl = th.querySelector(":scope > .col-title");
        let btn = th.querySelector(":scope > .col-type-btn");
        if (!titleEl) {
          const existingText = Array.from(th.childNodes)
            .filter((n) => !(n.nodeType === Node.ELEMENT_NODE && n.classList.contains("col-type-btn")))
            .map((n) => n.textContent)
            .join("")
            .trim();
          th.innerHTML = "";
          titleEl = document.createElement("span");
          titleEl.className = "col-title";
          titleEl.textContent = existingText || "Column";
          th.appendChild(titleEl);
          btn = null;
        }
        if (!btn) {
          btn = document.createElement("button");
          btn.type = "button";
          btn.className = "col-type-btn";
          btn.setAttribute("contenteditable", "false");
          th.appendChild(btn);
        }
        btn.textContent = meta.badge;
        btn.title = `Column type: ${meta.label} (click to change)`;
      }

      function setColumnType(table, colIndex, type) {
        const headRow = table.querySelector("thead tr");
        if (!headRow) return;
        const th = headRow.cells[colIndex];
        if (!th) return;

        ensureHeaderControl(th, type);
        const rows = table.querySelectorAll("tbody tr");
        for (const row of rows) {
          const td = row.cells[colIndex];
          if (td) applyCellType(td, type);
        }
        syncPreviewToEditor();
      }

      function enhanceTable(table) {
        if (!table.parentElement || !table.parentElement.classList.contains("table-row-top")) {
          const wrap = document.createElement("div");
          wrap.className = "table-wrap";
          const rowTop = document.createElement("div");
          rowTop.className = "table-row-top";

          const addColBtn = document.createElement("button");
          addColBtn.type = "button";
          addColBtn.className = "table-add-col";
          addColBtn.setAttribute("contenteditable", "false");
          addColBtn.title = "Add column";
          addColBtn.setAttribute("aria-label", "Add column");
          addColBtn.textContent = "+";

          const addRowBtn = document.createElement("button");
          addRowBtn.type = "button";
          addRowBtn.className = "table-add-row";
          addRowBtn.setAttribute("contenteditable", "false");
          addRowBtn.title = "Add row";
          addRowBtn.setAttribute("aria-label", "Add row");
          addRowBtn.textContent = "+";

          table.parentNode.insertBefore(wrap, table);
          rowTop.appendChild(table);
          rowTop.appendChild(addColBtn);
          wrap.appendChild(rowTop);
          wrap.appendChild(addRowBtn);
        }

        const headRow = table.querySelector("thead tr");
        if (!headRow) return;
        const colCount = headRow.cells.length;
        for (let col = 0; col < colCount; col++) {
          const th = headRow.cells[col];
          const type = inferColumnType(table, col);
          ensureHeaderControl(th, type);
          const rows = table.querySelectorAll("tbody tr");
          for (const row of rows) {
            const td = row.cells[col];
            if (td) applyCellType(td, type);
          }
        }
      }

      function enhanceTables(root) {
        const tables = root.querySelectorAll("table");
        for (const table of tables) {
          enhanceTable(table);
        }
      }
