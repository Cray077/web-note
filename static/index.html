      function focusTableCell(cell) {
        if (!cell) return;
        const input = cell.querySelector("input");
        if (input) {
          input.focus();
          return;
        }
        const title = cell.querySelector(":scope > .col-title");
        previewEl.focus();
        if (title) {
          selectNodeContents(title);
        } else {
          setCaret(cell, cell.childNodes.length ? 0 : 0);
        }
      }

      function addTableRow(table) {
        const headRow = table.querySelector("thead tr");
        if (!headRow) return;
        let tbody = table.querySelector("tbody");
        if (!tbody) {
          tbody = document.createElement("tbody");
          table.appendChild(tbody);
        }
        const tr = document.createElement("tr");
        let firstEditable = null;
        for (let col = 0; col < headRow.cells.length; col++) {
          const th = headRow.cells[col];
          const type = th.dataset.colType || "text";
          const td = document.createElement("td");
          applyCellType(td, type, "");
          tr.appendChild(td);
          if (!firstEditable && type !== "checkbox") firstEditable = td;
        }
        tbody.appendChild(tr);
        syncPreviewToEditor();
        focusTableCell(firstEditable || tr.cells[0]);
      }

      function addTableColumn(table) {
        const headRow = table.querySelector("thead tr");
        if (!headRow) return;
        const th = document.createElement("th");
        th.textContent = "Column";
        headRow.appendChild(th);
        ensureHeaderControl(th, "text");

        const rows = table.querySelectorAll("tbody tr");
        for (const row of rows) {
          const td = document.createElement("td");
          applyCellType(td, "text", "");
          row.appendChild(td);
        }
        syncPreviewToEditor();
        focusTableCell(th);
      }

      function closeColTypeMenu() {
        colTypeTarget = null;
        colTypeMenuEl.hidden = true;
        colTypeMenuEl.innerHTML = "";
      }

      function openColTypeMenu(btn, table, colIndex) {
        if (colTypeTarget && colTypeTarget.btn === btn) {
          closeColTypeMenu();
          return;
        }
        closePreviewSlashMenu();
        const th = table.querySelector(`thead tr th:nth-child(${colIndex + 1})`);
        const currentType = (th && th.dataset.colType) || "text";
        colTypeTarget = { btn, table, colIndex };

        colTypeMenuEl.innerHTML = "";
        const frag = document.createDocumentFragment();
        for (const t of COL_TYPES) {
          const li = document.createElement("li");
          li.className = "slash-menu-item" + (t.id === currentType ? " active" : "");
          li.dataset.type = t.id;
          li.setAttribute("role", "menuitem");

          const badge = document.createElement("span");
          badge.className = "col-type-badge";
          badge.textContent = t.badge;

          const label = document.createElement("span");
          label.textContent = t.label;

          li.appendChild(badge);
          li.appendChild(label);
          frag.appendChild(li);
        }
        colTypeMenuEl.appendChild(frag);
        colTypeMenuEl.hidden = false;

        const rect = btn.getBoundingClientRect();
        const menuRect = colTypeMenuEl.getBoundingClientRect();
        let left = rect.left;
        let top = rect.bottom + 4;
        if (left + menuRect.width > window.innerWidth - 8) {
          left = Math.max(8, window.innerWidth - menuRect.width - 8);
        }
        if (top + menuRect.height > window.innerHeight - 8) {
          top = Math.max(8, rect.top - menuRect.height - 4);
        }
        colTypeMenuEl.style.left = `${left}px`;
        colTypeMenuEl.style.top = `${top}px`;
      }

      colTypeMenuEl.addEventListener("mousedown", (e) => {
        const li = e.target.closest(".slash-menu-item");
        if (!li || !colTypeTarget) return;
        e.preventDefault();
        const { table, colIndex } = colTypeTarget;
        const type = li.dataset.type;
        closeColTypeMenu();
        setColumnType(table, colIndex, type);
      });

      document.addEventListener("mousedown", (e) => {
        if (
          colTypeTarget &&
          !colTypeMenuEl.contains(e.target) &&
          !e.target.closest(".col-type-btn")
        ) {
          closeColTypeMenu();
        }
      });

      // Preview editing events (two-way sync back to CodeMirror)
      previewEl.addEventListener("input", () => {
        if (activeId === null) return;
        dirty = true;
        setStatus("Unsaved...");
        schedulePreviewToEditor();
        updatePreviewSlashMenu();
      });

      previewEl.addEventListener("change", (e) => {
        if (e.target && e.target.matches('input[type="checkbox"], input[type="date"]')) {
          syncPreviewToEditor();
        }
      });

      function flushTypedCell(nextCell = null) {
        if (
          activeTypedCell &&
          activeTypedCell !== nextCell &&
          previewEl.contains(activeTypedCell) &&
          (activeTypedCell.dataset.colType === "currency" ||
            activeTypedCell.dataset.colType === "number")
        ) {
          const before = activeTypedCell.textContent;
          applyCellType(activeTypedCell, activeTypedCell.dataset.colType);
          if (activeTypedCell.textContent !== before) {
            syncPreviewToEditor();
          }
        }
        activeTypedCell =
          nextCell &&
          (nextCell.dataset.colType === "currency" || nextCell.dataset.colType === "number")
            ? nextCell
            : null;
      }

      document.addEventListener("selectionchange", () => {
        if (previewEl.hidden) return;
        const sel = window.getSelection();
        const anchor = sel && sel.anchorNode;
        const el =
          anchor && previewEl.contains(anchor)
            ? anchor.nodeType === Node.ELEMENT_NODE
              ? anchor
              : anchor.parentElement
            : null;
        const td = el ? el.closest("td[data-col-type]") : null;
        if (td !== activeTypedCell) {
          flushTypedCell(td);
        }
      });

      previewEl.addEventListener("blur", () => {
        closePreviewSlashMenu();
        flushTypedCell(null);
        flushPreviewSync();
      });

      previewEl.addEventListener("scroll", () => {
        closePreviewSlashMenu();
        closeColTypeMenu();
      }, { passive: true });

      previewEl.addEventListener("paste", (e) => {
        e.preventDefault();
        closePreviewSlashMenu();
        const text = (e.clipboardData || window.clipboardData)?.getData("text/plain") || "";
        if (!text) return;
        document.execCommand("insertText", false, text);
      });

      previewEl.addEventListener("mousedown", (e) => {
        const addRowBtn = e.target.closest(".table-add-row");
        if (addRowBtn) {
          e.preventDefault();
          closeColTypeMenu();
          const table = addRowBtn.closest(".table-wrap")?.querySelector("table");
          if (table) addTableRow(table);
          return;
        }
        const addColBtn = e.target.closest(".table-add-col");
        if (addColBtn) {
          e.preventDefault();
          closeColTypeMenu();
          const table = addColBtn.closest(".table-wrap")?.querySelector("table");
          if (table) addTableColumn(table);
          return;
        }
        const typeBtn = e.target.closest(".col-type-btn");
        if (typeBtn) {
          e.preventDefault();
          const th = typeBtn.closest("th");
          const table = typeBtn.closest("table");
          if (th && table) {
            openColTypeMenu(typeBtn, table, th.cellIndex);
          }
        }
      });

      previewEl.addEventListener("click", (e) => {
        closePreviewSlashMenu();
        const link = e.target.closest("a[href]");
        if (link && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          window.open(link.href, "_blank", "noopener,noreferrer");
        }
      });

      previewEl.addEventListener("keydown", (e) => {
        if (colTypeTarget && e.key === "Escape") {
          e.preventDefault();
          closeColTypeMenu();
          return;
        }
        if (previewSlash) {
          if (e.key === "ArrowDown") {
            e.preventDefault();
            previewSlash.index = (previewSlash.index + 1) % previewSlash.items.length;
            renderPreviewSlashMenu();
            return;
          }
          if (e.key === "ArrowUp") {
            e.preventDefault();
            previewSlash.index =
              (previewSlash.index - 1 + previewSlash.items.length) % previewSlash.items.length;
            renderPreviewSlashMenu();
            return;
          }
          if (e.key === "Enter" || e.key === "Tab") {
            e.preventDefault();
            const item = previewSlash.items[previewSlash.index];
            if (item) applyPreviewSlashItem(item);
            return;
          }
          if (e.key === "Escape") {
            e.preventDefault();
            closePreviewSlashMenu();
            return;
          }
        }

        const mod = e.ctrlKey || e.metaKey;
        if (mod && !e.altKey) {
          const key = e.key.toLowerCase();
          if (key === "b") {
            e.preventDefault();
            document.execCommand("bold");
          } else if (key === "i") {
            e.preventDefault();
            document.execCommand("italic");
          } else if (key === "k") {
            e.preventDefault();
            const url = prompt("Link URL:", "https://");
            if (url && /^https?:\/\//i.test(url.trim())) {
              document.execCommand("createLink", false, url.trim());
              syncPreviewToEditor();
            }
          }
        } else if (e.key === "Enter" && !e.altKey) {
          const sel = window.getSelection();
          const anchor = sel && sel.anchorNode;
          const el = anchor && (anchor.nodeType === Node.ELEMENT_NODE ? anchor : anchor.parentElement);
          if (el && el.closest("pre")) {
            e.preventDefault();
            document.execCommand("insertLineBreak");
            return;
          }
          const cell = el && el.closest("th, td");
          if (cell) {
            e.preventDefault();
            const table = cell.closest("table");
            const colIndex = cell.cellIndex;
            const row = cell.parentElement;
            const rows = Array.from(table.querySelectorAll("tr"));
            const rowIdx = rows.indexOf(row);
            flushTypedCell(null);
            if (rowIdx >= 0 && rowIdx < rows.length - 1) {
              const target = rows[rowIdx + 1].cells[colIndex];
              if (target) focusTableCell(target);
            } else {
              addTableRow(table);
              const newRow = table.querySelector("tbody tr:last-child");
              if (newRow && newRow.cells[colIndex]) {
                focusTableCell(newRow.cells[colIndex]);
              }
            }
          }
        } else if (e.key === "Tab") {
          const sel = window.getSelection();
          const anchor = sel && sel.anchorNode;
          const el = anchor && (anchor.nodeType === Node.ELEMENT_NODE ? anchor : anchor.parentElement);
          const cell = el && el.closest("th, td");
          if (cell) {
            e.preventDefault();
            const table = cell.closest("table");
            if (cell.tagName === "TD" && (cell.dataset.colType === "currency" || cell.dataset.colType === "number")) {
              applyCellType(cell, cell.dataset.colType);
              syncPreviewToEditor();
            }
            const cells = Array.from(table.querySelectorAll("th, td"));
            const idx = cells.indexOf(cell);
            const nextIdx = idx + (e.shiftKey ? -1 : 1);
            if (nextIdx >= 0 && nextIdx < cells.length) {
              focusTableCell(cells[nextIdx]);
            } else if (!e.shiftKey && nextIdx === cells.length) {
              addTableRow(table);
            }
            return;
          }
          e.preventDefault();
          document.execCommand(e.shiftKey ? "outdent" : "indent");
        }
      });

      // Event bindings
      searchEl.addEventListener("input", renderSidebar);

      noteListEl.addEventListener("click", (e) => {
        if (e.target.closest(".note-rename-input")) return;
        const renameBtn = e.target.closest(".note-rename-btn");
        if (renameBtn) {
          e.stopPropagation();
          const item = renameBtn.closest(".note-item");
          const id = item ? Number(item.dataset.id) : NaN;
          if (Number.isInteger(id)) startInlineRename(id);
          return;
        }
        const item = e.target.closest(".note-item");
        if (!item) return;
        const id = Number(item.dataset.id);
        if (Number.isInteger(id)) {
          selectNote(id);
        }
      });

      noteListEl.addEventListener("dblclick", (e) => {
        const nameEl = e.target.closest(".note-name");
        if (!nameEl) return;
        e.stopPropagation();
        const item = nameEl.closest(".note-item");
        const id = item ? Number(item.dataset.id) : NaN;
        if (Number.isInteger(id)) startInlineRename(id);
      });

      tabStripEl.addEventListener("click", (e) => {
        const closeBtn = e.target.closest(".tab-close");
        if (closeBtn) {
          e.stopPropagation();
          const tab = closeBtn.closest(".tab");
          const id = tab ? Number(tab.dataset.id) : NaN;
          if (Number.isInteger(id)) closeTab(id);
          return;
        }
        const tab = e.target.closest(".tab");
        if (!tab) return;
        const id = Number(tab.dataset.id);
        if (Number.isInteger(id)) selectNote(id);
      });

      tabStripEl.addEventListener("auxclick", (e) => {
        if (e.button !== 1) return;
        const tab = e.target.closest(".tab");
        if (!tab) return;
        e.preventDefault();
        const id = Number(tab.dataset.id);
        if (Number.isInteger(id)) closeTab(id);
      });

      tabStripEl.addEventListener("wheel", (e) => {
        if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
          tabStripEl.scrollLeft += e.deltaY;
        }
      }, { passive: true });

      newTabBtn.addEventListener("click", handleNewNote);

      sidebarToggleBtn.addEventListener("click", () => {
        sidebarVisible = !sidebarVisible;
        applyLayout();
      });

      editorToggleBtn.addEventListener("click", () => {
        wideEditorVisible = !wideEditorVisible;
        if (!wideEditorVisible && !widePreviewVisible) {
          widePreviewVisible = true;
        }
        applyLayout();
        if (wideEditorVisible && activeId !== null) cm.focus();
      });

      previewToggleBtn.addEventListener("click", () => {
        if (wideQuery.matches) {
          widePreviewVisible = !widePreviewVisible;
          if (!widePreviewVisible && !wideEditorVisible) {
            wideEditorVisible = true;
          }
          applyLayout();
        } else {
          narrowPreviewActive = !narrowPreviewActive;
          applyLayout();
          if (!narrowPreviewActive && activeId !== null) cm.focus();
        }
      });

      wideQuery.addEventListener("change", applyLayout);
      newNoteBtn.addEventListener("click", handleNewNote);
      exportBtn.addEventListener("click", handleExport);
      window.addEventListener("pagehide", flushOnUnload);

      // Initial load over WebSocket
      async function loadInitialNotes() {
        if (wsInitializing || wsInitialized) return;
        wsInitializing = true;
        try {
          const res = await wsRequest("list_notes");
          notes = Array.isArray(res.notes) ? res.notes : [];
          sortNotesNewestFirst();

          if (notes.length === 0) {
            const first = await createNote("My Notes");
            notes = [first];
          }

          wsInitialized = true;
          const saved = restoreTabsState();
          if (saved && saved.ids.length > 0 && saved.active !== null) {
            openTabIds = saved.ids;
            renderSidebar();
            renderTabs();
            await selectNote(saved.active);
          } else {
            renderSidebar();
            await selectNote(notes[0].id);
          }
        } catch (err) {
          setStatus(err.message || "Failed to initialize", true);
        } finally {
          wsInitializing = false;
        }
      }

      function init() {
        applyLayout();
        setStatus("Connecting...");
        connectWebSocket();
      }

      init();
    })();
  </script>
</body>
</html>
